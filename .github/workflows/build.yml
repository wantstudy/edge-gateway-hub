name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 交付形态仅覆盖 Windows（Tauri 桌面）与 Linux（headless/Docker）。
        # 设计定稿明确不引入 macos-latest（浪费 CI 配额且增加无关失败面）。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace（CI 门禁）
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 部署资产静态门禁（task 60）：脚本语法自检 + 基础镜像 digest 锁文件结构校验。
  # 说明：digest 锁文件在 CI 联网前可能仍为空（未 pin），故此处只校验「结构 / 格式」，
  # 空 digest 仅告警不判红；真正 fail-closed 发生在构建前渲染步骤
  # （render-dockerfile-digests.sh 遇空 digest 非零退出），详见 deploy/README.md §4。
  deploy:
    name: deploy / supply-chain static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（部署脚本静态语法自检）
        run: |
          set -euo pipefail
          for f in deploy/scripts/*.sh deploy/docker/entrypoint.sh; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done

      - name: 基础镜像 digest 锁文件校验（结构 / 格式；空 digest 仅告警）
        run: bash deploy/scripts/render-dockerfile-digests.sh --check

      # ---- 构建真实 web-console 产物（守卫的前置条件，顺序不可颠倒）----
      # 说明：package.json 无 engines 字段；此处取 Node 22，与前端工具链（vite 5 / vue-tsc 2）匹配。
      #       npm run build = `vue-tsc --noEmit && vite build`，类型错误同样会让本 job 判红。
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - name: npm ci 并安装依赖
        working-directory: web-console
        run: npm ci

      - name: 构建 web-console 真实产物
        working-directory: web-console
        run: npm run build

      - name: 以真实产物覆盖 web-console-dist 交付目录
        run: |
          set -euo pipefail
          rm -rf deploy/docker/context/web-console-dist
          cp -r web-console/dist deploy/docker/context/web-console-dist

      # web-console 交付物守卫（fail-closed）：占位页会让 docker build 静默「成功」，
      # 却把写着 placeholder 的假界面打进镜像，故在构建前显式拒绝。
      # 上一步已用真实产物覆盖，此处再跑一次即为「自证闭环」：EXIT=0 才继续。
      - name: web-console 交付物守卫（占位页 fail-closed）
        run: bash deploy/scripts/check-web-console-dist.sh

  # ---------------------------------------------------------------------------
  # Linux 容器镜像的真实构建验证（task 60）
  #
  # 为什么必须有这个 job：此前 .github/workflows/ 下**零处** docker 构建，
  #   也就是说「Linux 主推交付形态」这条路径从未在 CI 里被真正执行过 ——
  #   Dockerfile 的每一个 COPY / 每一条 RUN 断言都只有在这台机器上跑过才算数。
  #   镜像构建失败（musl 静态链接、distroless 无 loader、产物路径错位等）
  #   在此前完全不可见。
  #
  # 与 deploy job 的职责边界（顺序依赖，不要用 needs 之外的假设跨 job 传文件）：
  #   - deploy   ：构建 web-console 真实产物，并守卫交付目录不是占位页；
  #   - container：在**已守卫**的交付目录之上构建镜像。故 needs: [deploy]。
  #     （两个 job 各自 fresh checkout，不跨 job 传递工作区文件）
  #
  # 多架构说明：vendored C（rusqlite bundled 等）无法在 Windows/宿主侧交叉编译，
  #   因此每个架构都必须在**目标架构**内构建 —— amd64 走 runner 原生（无需 QEMU），
  #   arm64 走 QEMU/binfmt（docker/setup-qemu-action）。构建在容器内完成，
  #   宿主机只负责把指令送进去。
  # ---------------------------------------------------------------------------
  container:
    name: deploy / container image (linux/${{ matrix.arch }})
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # 与 build-offline-bundle.sh 的入口契约保持一致：先守守卫再动 docker。
      # 上一步 deploy 已用真实产物覆盖交付目录，此处守卫通过即「自证闭环」。
      - name: web-console 交付物守卫（占位页 fail-closed）
        run: bash deploy/scripts/check-web-console-dist.sh

      - name: 渲染基础镜像 digest（fail-closed：未 pin 则非零退出）
        run: |
          set -euo pipefail
          # 渲染产物落在 runner 临时目录，避免污染仓库工作区。
          bash deploy/scripts/render-dockerfile-digests.sh \
            --output "${RUNNER_TEMP}/Dockerfile.rendered"
          grep -q '^FROM .*@sha256:[0-9a-f]\{64\}$' "${RUNNER_TEMP}/Dockerfile.rendered"
          echo "已渲染 Dockerfile（基础镜像 digest 已 pin）"

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      # 仅在 arm64 需要：注册 binfmt_misc，使 runner 能执行 arm64 容器。
      # amd64 由 runner 原生执行，跳过可省去约 10s 且少一个失败面。
      - name: 注册 QEMU（仅 arm64 需要）
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # 真实构建：无 --push、无 --cache-to，构建即门禁。
      - name: docker buildx build（真实构建验证）
        env:
          IMG_TAG: iot-daq-gateway:ci-${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --file "${RUNNER_TEMP}/Dockerfile.rendered" \
            --tag "${IMG_TAG}" \
            .

      # 交付物断言（fail-closed）：容器镜像最容易出的事故不是「构建失败」，
      #   而是「构建成功但层里没有东西」—— 路径错位会静默产出小体积空层，
      #   容器随后 exec 失败或直接没有前端。故在**镜像层内容**层面逐条断言：
      #   检查脚本 deploy/scripts/check-image-contents.sh 会解包 docker save 的
      #   每个 layer（docker 25+ 的 OCI 布局里 layer 是 blobs/sha256/<hex>，
      #   不在顶层，只看顶层条目必然误判），逐个校验交付物存在且体积达标。
      - name: 镜像层交付物断言（禁止空层）
        env:
          IMG_TAG: iot-daq-gateway:ci-${{ github.sha }}-${{ matrix.arch }}
        run: bash deploy/scripts/check-image-contents.sh "${IMG_TAG}"
