name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 交付形态仅覆盖 Windows（Tauri 桌面）与 Linux（headless/Docker）。
        # 设计定稿明确不引入 macos-latest（浪费 CI 配额且增加无关失败面）。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace（CI 门禁）
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 部署资产静态门禁（task 60）：脚本语法自检 + 基础镜像 digest 锁文件结构校验。
  # 说明：digest 锁文件在 CI 联网前可能仍为空（未 pin），故此处只校验「结构 / 格式」，
  # 空 digest 仅告警不判红；真正 fail-closed 发生在构建前渲染步骤
  # （render-dockerfile-digests.sh 遇空 digest 非零退出），详见 deploy/README.md §4。
  deploy:
    name: deploy / supply-chain static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（部署脚本静态语法自检）
        run: |
          set -euo pipefail
          for f in deploy/scripts/*.sh deploy/docker/entrypoint.sh; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done

      - name: 基础镜像 digest 锁文件校验（结构 / 格式；空 digest 仅告警）
        run: bash deploy/scripts/render-dockerfile-digests.sh --check

      # ---- 构建真实 web-console 产物（守卫的前置条件，顺序不可颠倒）----
      # 说明：package.json 无 engines 字段；此处取 Node 22，与前端工具链（vite 5 / vue-tsc 2）匹配。
      #       npm run build = `vue-tsc --noEmit && vite build`，类型错误同样会让本 job 判红。
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - name: npm ci 并安装依赖
        working-directory: web-console
        run: npm ci

      - name: 构建 web-console 真实产物
        working-directory: web-console
        run: npm run build

      - name: 以真实产物覆盖 web-console-dist 交付目录
        run: |
          set -euo pipefail
          rm -rf deploy/docker/context/web-console-dist
          cp -r web-console/dist deploy/docker/context/web-console-dist

      # web-console 交付物守卫（fail-closed）：占位页会让 docker build 静默「成功」，
      # 却把写着 placeholder 的假界面打进镜像，故在构建前显式拒绝。
      # 上一步已用真实产物覆盖，此处再跑一次即为「自证闭环」：EXIT=0 才继续。
      - name: web-console 交付物守卫（占位页 fail-closed）
        run: bash deploy/scripts/check-web-console-dist.sh

  # 后续 Wave 接入说明（本阶段不建，避免空跑）：
  # - Wave 5 task 38：Tauri 桌面打包（tauri-action，NSIS/MSI），仅在 tag/手动触发时执行；
  # - Wave 5 task 60：Docker 多架构镜像构建（linux/amd64 + linux/arm64）+ cosign 签名。
