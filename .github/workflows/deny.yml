name: Cargo Deny（供应链合规门禁）

# task 58：依赖许可证 / RustSec 公告 / 版本禁令门禁。
# - 触发：push 到 master 与所有针对 master 的 PR
# - 配置：仓库根 deny.toml（licenses 白名单 / advisories 低门槛 / bans 通配符禁令）
# - 红线背景：纯 Rust 依赖栈；引入新依赖前先跑 `cargo deny check licenses` 自查。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deny:
    name: cargo deny check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 预取 Cargo.lock 引用的 crate 源码，避免 cargo-deny 在干净 runner 上
      # 因离线解析依赖树而变慢/失败（action 内部会做 metadata 解析）。
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      # 官方 action：自动安装 cargo-deny 并执行 `cargo deny check`（检查项由
      # deny.toml 驱动：licenses + bans + advisories；sources 内嵌于 bans 检查）。
      # 注：advisories 检查需要访问 RustSec advisory-db，离线/内网 runner 需放行
      # https://github.com/rustsec/advisory-db。
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          # 锁定文件是权威（仓库纪律：禁改 Cargo.lock），不自动升级 lock。
          command-arguments: '--locked'
