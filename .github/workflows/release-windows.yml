name: Release Windows Installer

# 在 windows-latest 上构建并（可选）Authenticode 签名 IoT-DAQ 网关桌面壳 NSIS 安装包（.exe）。
#
# 触发与产出：
# - 推送 `v*` 标签 → 构建 + **创建/更新该标签的 GitHub Release 并把 .exe 作为可下载资产发布**；
# - 手动 workflow_dispatch → 默认只产出 Actions artifact；填了 `tag` 输入则同样发布到 Release。
#
# ⚠️ 历史坑（本次修复）：本工作流此前只做 `actions/upload-artifact`。
#    artifact 只在 Actions 运行页可见（需登录、默认 90 天过期），**Releases 页面看不到**，
#    因此仓库 Releases 上一直只有 GitHub 自动生成的 "Source code (zip / tar.gz)"。
#    发布动作现在由 `softprops/action-gh-release` 承担，并附 SHA256 校验文件。
#
# 本地无法出包时的替代：本工程为 CI 就绪设计；详见 tauri-shell/README.md。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: '使用仓库密钥中的代码签名证书对安装包做 Authenticode 签名'
        type: boolean
        default: false
      tag:
        description: '发布到该标签的 GitHub Release（形如 v0.1.2）；留空则只产出 Actions artifact'
        type: string
        default: ''
      version:
        description: '期望的安装包版本号（纯数字三段，如 0.1.2，不带 v）；由 v* 标签触发时会自动从 tag 推导'
        type: string
        default: ''

# 创建 Release 与上传资产需要写权限（仓库默认 GITHUB_TOKEN 只读时，缺此配置会在发布步骤 403）。
permissions:
  contents: write

jobs:
  build-windows:
    name: Build NSIS installer (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 版本号来源统一（fail-closed，放在耗时的打包之前，尽早失败）──
      # 安装包内嵌版本来自 `tauri-shell/src-tauri/tauri.conf.json` 的 version 字段，
      # **不会自动跟随 git tag**。此前两者之间零校验：推 v0.1.1 打出的 .exe 仍写着
      # 0.1.0，而 Release 标题写 v0.1.1 —— 版本号静默取错、无人发现。
      # 现在期望版本 = workflow_dispatch 的 version 输入 → 否则由 v* 标签推导（去前导 v）；
      # 取到就与 tauri.conf.json 比对，不一致立刻非零退出（不静默改写、不降级放行）。
      - name: 版本号来源校验（git tag ↔ tauri.conf.json）
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CFG="tauri-shell/src-tauri/tauri.conf.json"
          CFG_VERSION="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${CFG}" | head -n1)"
          if [[ -z "${CFG_VERSION}" ]]; then
            echo "::error::无法从 ${CFG} 解析 version 字段"
            exit 1
          fi
          echo "tauri.conf.json 内嵌版本 = ${CFG_VERSION}"

          EXPECTED="${{ inputs.version }}"
          if [[ -z "${EXPECTED}" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          fi
          echo "期望版本 = ${EXPECTED:-（未确定）}"

          if [[ -z "${EXPECTED}" ]]; then
            echo "::error::未确定期望版本号，拒绝出包。"
            echo "::error::workflow_dispatch 请填写 version 输入；v* 标签触发则由 tag 自动推导。"
            echo "::error::理由：没有期望值就无法判断 tauri.conf.json 里的版本是不是取错了，"
            echo "::error::而「版本号静默取错」恰好是本次要堵的那类缺陷。"
            exit 1
          fi
          if [[ "${EXPECTED}" != "${CFG_VERSION}" ]]; then
            echo "::error::版本号不一致：期望 ${EXPECTED}，但 ${CFG} 为 ${CFG_VERSION}。"
            echo "::error::安装包内嵌版本取自 tauri.conf.json，不会自动跟随 git tag。"
            echo "::error::修复：把 ${CFG} 的 version 改为 ${EXPECTED} 后重新触发。"
            exit 1
          fi
          echo "version=${CFG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # windows-latest 默认未预装 NSIS，而 Tauri 的 NSIS 打包依赖 `makensis`——
      # 不装则 Rust 二进制能编出、但最终的 .exe 安装包不会产出。这是 Tauri Windows CI 最常见的失败点。
      #
      # ★ 历史坑（本次修复）：此前把安装位写死成 `C:\Program Files (x86)\NSIS`，
      #   与 chocolatey 在不同 runner 镜像下的实际落盘位置不一致时，
      #   `& "$nsis\makensis.exe"` 会**在装好 NSIS 之后**仍然报 "command not found"，
      #   属于典型的「装了却用不上」假失败。现在改为「先找 makensis.exe，找不到才失败」：
      #   候选来源为 NSIS_PATH 环境变量 → Program Files / Program Files (x86) 下的 NSIS* 目录
      #   → 卸载表登记的 InstallLocation（choco 安装位置的可信登记处），
      #   不再依赖任何硬编码路径；找到后同时写 PATH 与 NSIS_PATH（兼容 Tauri 两种解析方式）。
      - name: Install NSIS (Tauri 打包必需)
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Error "未找到 chocolatey，无法安装 NSIS"; exit 1
          }
          choco install nsis -y --no-progress

          function Find-Makensis {
              $roots = New-Object System.Collections.ArrayList
              if ($env:NSIS_PATH) { [void]$roots.Add($env:NSIS_PATH) }
              foreach ($pf in @(${env:ProgramFiles}, ${env:ProgramFiles(x86)})) {
                  if (-not $pf) { continue }
                  [void]$roots.Add((Join-Path $pf 'NSIS'))
                  Get-ChildItem -LiteralPath $pf -Directory -Filter 'NSIS*' -ErrorAction SilentlyContinue |
                      ForEach-Object { [void]$roots.Add($_.FullName) }
              }
              # 卸载表里的 InstallLocation 是安装位最可信的来源
              foreach ($k in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                               'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
                  Get-ItemProperty $k -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like 'NSIS*' -and $_.InstallLocation } |
                      ForEach-Object { [void]$roots.Add($_.InstallLocation) }
              }
              foreach ($r in $roots) {
                  if (-not $r -or -not (Test-Path -LiteralPath $r)) { continue }
                  # NSIS 3 把 makensis 放在安装根目录，部分打包变体放在 Bin/
                  foreach ($sub in @('', 'Bin', 'bin')) {
                      $dir = if ($sub) { Join-Path $r $sub } else { $r }
                      $exe = Join-Path $dir 'makensis.exe'
                      if (Test-Path -LiteralPath $exe) { return $exe }
                  }
              }
              return $null
          }

          $exe = Find-Makensis
          if (-not $exe) {
            # 单行 Write-Error：PowerShell 这里字符串要求结束符 '@@ 独占行首，
            # 与 GitHub 工作流 YAML 块标量的缩进规则冲突（会顶掉块标量的缩进层级），
            # 故多行报错信息一律拆成多条单行 Write-Error。
            Write-Error "未能定位 makensis.exe：NSIS 已安装但可执行文件不在预期位置。"
            Write-Error "已排查候选：NSIS_PATH 环境变量、Program Files 与 Program Files (x86) 下的 NSIS* 目录、卸载表登记的 InstallLocation（含 Bin/ 与 bin/ 子目录）。"
            Write-Error "请检查 chocolatey 安装包是否落到非常规位置。"
            exit 1
          }

          # 安装目录 ≠ makensis.exe 所在目录：NSIS 3 把 makensis 放在安装根目录，
          # 部分打包变体放在安装目录的 Bin/ 下。只有末级目录恰好是 Bin/bin 时才再上移一级。
          $mdir = Split-Path $exe -Parent
          if ($mdir -and (Split-Path $mdir -Leaf) -match '(?i)^bin$') {
              $dir = Split-Path $mdir -Parent
          } else {
              $dir = $mdir
          }
          $bind = Join-Path $dir 'Bin'
          Write-Host "makensis: $exe"
          Write-Host "NSIS 安装目录: $dir"

          Add-Content -Path $env:GITHUB_PATH -Value $dir -Encoding utf8
          if (Test-Path -LiteralPath $bind) { Add-Content -Path $env:GITHUB_PATH -Value $bind -Encoding utf8 }
          Add-Content -Path $env:GITHUB_ENV  -Value "NSIS_PATH=$dir" -Encoding utf8

          & $exe /VERSION

      - name: Cache cargo & tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tauri-shell/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('tauri-shell/src-tauri/Cargo.lock') }}

      - name: Install web-console dependencies
        run: npm --prefix web-console ci

      - name: Install tauri-shell dependencies (tauri-cli)
        run: npm --prefix tauri-shell ci

      # 用源 PNG 重新生成全平台图标，确保 icon.ico / icns 等完整。
      - name: Regenerate icons
        run: npm --prefix tauri-shell run icon

      # ── 构建 daemon 侧车并放入资源目录（task 33 bin 已就绪）──
      # 产物随 NSIS 包进入 resource_dir，壳启动时自动拉起；失败即终止（不让
      # 安装包悄悄降级成纯 UI 模式）。
      - name: Build daemon sidecar
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p daemon
          mkdir -p tauri-shell/src-tauri/resources
          cp target/x86_64-pc-windows-msvc/release/iot-daq-daemon.exe tauri-shell/src-tauri/resources/iot-daq-daemon.exe
          ls -l tauri-shell/src-tauri/resources/

      # web-console 产物由 tauri.conf.json 的 `beforeBuildCommand`
      # （`npm --prefix ../../web-console run build`）在打包前生成。
      - name: Build Tauri installer (NSIS)
        run: npm --prefix tauri-shell run tauri build

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SETUP=$(ls tauri-shell/src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          echo "setup=$SETUP" >> "$GITHUB_OUTPUT"
          echo "Installer: $SETUP"

      # 安装包校验文件（用户可离线核对下载是否完整；与 Release 资产一并发布）。
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          SETUP="${{ steps.locate.outputs.setup }}"
          sha256sum "$SETUP" | awk '{print $1}' > "$SETUP.sha256"
          echo "SHA256: $(cat "$SETUP.sha256")"

      # ── Authenticode 签名（仅在显式 sign=true 且提供证书密钥时）──
      - name: Import code-signing certificate
        if: ${{ github.event.inputs.sign == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "::warning::未配置 WINDOWS_CERTIFICATE，跳过签名"; exit 0 }
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($bytes, $env:WINDOWS_CERTIFICATE_PASSWORD, 'Exportable,PersistKeySet')
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My","CurrentUser")
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          $cert.Thumbprint | Out-File -FilePath thumb.txt

      - name: Sign installer (Authenticode)
        if: ${{ github.event.inputs.sign == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "::warning::未配置 WINDOWS_CERTIFICATE，跳过签名"; exit 0 }
          $thumb = (Get-Content thumb.txt).Trim()
          $cert = Get-Item "Cert:\CurrentUser\My\$thumb"
          $setup = (Get-ChildItem tauri-shell/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          Set-AuthenticodeSignature -FilePath $setup -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          Get-AuthenticodeSignature $setup | Format-List Status, StatusMessage, SignerCertificate

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: iot-daq-gateway-windows-installer-v${{ steps.version.outputs.version }}
          path: |
            tauri-shell/src-tauri/target/release/bundle/nsis/*.exe
            tauri-shell/src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

      # ── 发布到 GitHub Release（Releases 页可直接下载）──
      # 条件：tag 推送（v*）或手动触发时填了 tag。手动触发若只填 tag 不发布，
      # 仍可在 Actions 运行页下载 artifact。
      # `tag_name` 对应标签不存在时，GitHub 会在当前提交上创建该标签。
      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: IoT-DAQ 网关 v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.locate.outputs.setup }}
            ${{ steps.locate.outputs.setup }}.sha256
