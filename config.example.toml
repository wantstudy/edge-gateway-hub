# iot-daq 本地人工测试样例配置（与 crates/daemon/src/config.rs 的 GatewayConfig 对齐）
#
# 启动（Git Bash / PowerShell 均可）：
#   cargo run -p daemon --bin iot-daq-daemon -- --config config.example.toml
# 管理面默认监听 127.0.0.1:8080（--bind <addr> 或环境变量 IOT_DAQ_MGMT_BIND 覆盖）。
#
# 开发联调环境变量（生产禁用！）：
#   IOT_DAQ_DEV_ADMIN_PASS=...   # 启用 dev 管理员（username=dev, role=system），启动日志有 [WARN]
#   IOT_DAQ_JWT_SECRET=<64位hex>  # JWT 签名密钥；缺省回退 dev 常量并打 [WARN]

[gateway]
gateway_id = "gw-local-dev"
# data_dir 缺省 ./data（点位数据库/队列/遥测落盘位置），可按需覆盖：
# data_dir = "./data"

# ── 北向出口（本地页面测试可不配；留空数组即不转发）──
# [[outlets]]
# name = "line1_m1"                     # 对外标识，不暴露内部 id
# broker = "mqtt://127.0.0.1:1883"
# topic_prefix = "iotdaq/line1_m1"
# qos = 1
# tls = false
# encoding = "json"                     # protobuf（默认）| json
#
# ── TLS / mTLS 出口示例（可选；task 25。证书配置可选：2026-09-25 用户决策）──
# 说明：broker scheme 与 tls 开关必须一致（mqtts:// ⇔ tls = true）。
#       TLS 出口的信任锚**可选**：提供 ca_cert_path 则用该 CA；缺省用操作系统根证书库
#       （broker 用公共可信证书时无需任何证书文件）。mTLS 需 client_cert_path +
#       client_key_path 成对。路径需在网关启动时即存在（不存在则该出口被拒绝并跳过，
#       不静默降级明文）。切勿配置任何「跳过证书校验」开关——本实现不支持，且校验失败即拒绝。
# [[outlets]]
# name = "line1_m1_tls"
# broker = "mqtts://broker.example.com:8883"   # 端口缺省即 8883
# topic_prefix = "iotdaq/line1_m1"
# qos = 1
# tls = true
# encoding = "protobuf"                 # protobuf（默认）| json
# ca_cert_path = "/etc/iot-daq/tls/ca.crt"          # 服务端 CA（可选；缺省用系统根证书库）
# client_cert_path = "/etc/iot-daq/tls/client.crt"  # mTLS 客户端证书（与私钥成对）
# client_key_path = "/etc/iot-daq/tls/client.key"   # mTLS 客户端私钥（与证书成对）
# alpn = ["mqtt"]                       # 可选；缺省 = 不协商 ALPN
# server_name = "broker.example.com"    # 可选；须与 broker host 一致（SNI 覆盖）

# ── 采集点位（本地页面测试可不配）──
# [[points]]
# device_id = "plc-01"
# point_id = "temp_01"
# protocol = "modbus-tcp"               # modbus-tcp | modbus-rtu | s7 ...
# address = "40001"
# frequency_ms = 1000

# ── 管理面登录（生产路）。配置了本段则 dev 环境变量路自动关闭 ──
# [[mgmt_auth.users]]
# name = "alice"
# role = "system"                       # ops | lic_ops | risk | system（与前端 rbac.ts 同源）
# password_hash = "<sha256(密码) 的 64 位小写 hex>"
