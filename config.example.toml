# iot-daq 本地人工测试样例配置（与 crates/daemon/src/config.rs 的 GatewayConfig 对齐）
#
# 启动（Git Bash / PowerShell 均可）：
#   cargo run -p daemon --bin iot-daq-daemon -- --config config.example.toml
# 管理面默认监听 127.0.0.1:8080（--bind <addr> 或环境变量 IOT_DAQ_MGMT_BIND 覆盖）。
#
# 开发联调环境变量（生产禁用！）：
#   IOT_DAQ_DEV_ADMIN_PASS=...   # 启用 dev 管理员（username=dev, role=system），启动日志有 [WARN]
#   IOT_DAQ_JWT_SECRET=<64位hex>  # JWT 签名密钥；缺省回退 dev 常量并打 [WARN]

[gateway]
gateway_id = "gw-local-dev"
# data_dir 缺省 ./data（点位数据库/队列/遥测落盘位置），可按需覆盖：
# data_dir = "./data"

# ── 云端授权（**必配**：否则激活 / 心跳不可用）──
# ⚠️ 必须配置本段（至少 `cloud_url`），否则新装实例「激活必然不通」，
#    心跳与授权状态判定均不可用；仅在纯离线本地联调时才可整段留空。
#    `cloud_url` 指向**部署方自有的授权服务基址**，勿填任何示例 / 看似真实的域名。
# [gateway.licensing]
# cloud_url = "https://<授权端主机>:<端口>/v1"     # 【必配】云授权服务基址
# heartbeat_interval_secs = 86400                 # 心跳间隔（秒，默认 24h）
# trial_days = 3                                  # 试用天数（默认 3）
# grace_days = 7                                  # 离线宽限天数（默认 7）
# ⚠️ activation_code（敏感凭据）：
#   - 下方只允许**占位符**；仓库 / 日志 / 配置导出**绝不允许出现真实激活码**；
#   - Debug 输出已脱敏（<redacted>），serde 序列化不携带该字段；
#   - 真实激活码经环境变量 IOTDAQ_ACTIVATION_CODE 或管理 UI 注入。
# activation_code = "IOTDAQ-0000-0000-0000-0000"
#
# 服务端响应签名（TOFU，2026-09-25 主理人决策）：激活响应携带 server_pubkey 并被客户端
# 钉定；心跳响应用钉定公钥验签——缺签 / 篡改 / 异钥一律 fail-closed（状态不推进）。
# 契约细节见 docs/design/licensing-api.md §1.1/§1.2 与 daemon/auth/client.rs 模块注释。

# ── 系统更新（OTA；可选，缺省关闭 = 不做任何检查）──
# 网关按 poll_interval_secs 周期拉取授权端 `GET /updates/manifest`；下载后先做
# Ed25519 验签，再按版本单调性（新版本号必须**严格大于** current_version）写入
# pending 槽，等待重启确认（防降级 / 防重放旧包）。授权端无包可发时返回
# available=false（诚实空态），网关**不计失败**、不重试风暴。
# 说明：V1 下载通道仅支持 `http://`（明文，无 TLS），完整性由 Ed25519 签名兜底，
#       机密性无保障；生产部署建议走可信内网。未配置 / enabled=false = 不发请求。
# [gateway.ota]
# enabled = false                                 # 【总开关】true 才启用检查；缺省 false
# manifest_url = "http://<授权端主机>:<端口>/updates/manifest"   # 授权端下发端点（http）
# signing_key_b64 = "<授权端 OTA Ed25519 公钥 base64（32 字节）>"  # 验签公钥（缺则视为未配置）
# poll_interval_secs = 3600                       # 轮询周期（秒，默认 3600；首个周期后才检查）
# current_version = 0                             # 网关当前 OTA 版本号（u64 单调；缺省 0）

# ── 北向出口（本地页面测试可不配；留空数组即不转发）──
# [[outlets]]
# name = "line1_m1"                     # 对外标识，不暴露内部 id
# broker = "mqtt://127.0.0.1:1883"
# topic_prefix = "iotdaq/line1_m1"
# qos = 1
# tls = false
# encoding = "json"                     # protobuf（默认）| json
#
# ── TLS / mTLS 出口示例（可选；task 25。证书配置可选：2026-09-25 用户决策）──
# 说明：broker scheme 与 tls 开关必须一致（mqtts:// ⇔ tls = true）。
#       TLS 出口的信任锚**可选**：提供 ca_cert_path 则用该 CA；缺省用操作系统根证书库
#       （broker 用公共可信证书时无需任何证书文件）。mTLS 需 client_cert_path +
#       client_key_path 成对。路径需在网关启动时即存在（不存在则该出口被拒绝并跳过，
#       不静默降级明文）。切勿配置任何「跳过证书校验」开关——本实现不支持，且校验失败即拒绝。
# [[outlets]]
# name = "line1_m1_tls"
# broker = "mqtts://broker.example.com:8883"   # 端口缺省即 8883
# topic_prefix = "iotdaq/line1_m1"
# qos = 1
# tls = true
# encoding = "protobuf"                 # protobuf（默认）| json
# ca_cert_path = "/etc/iot-daq/tls/ca.crt"          # 服务端 CA（可选；缺省用系统根证书库）
# client_cert_path = "/etc/iot-daq/tls/client.crt"  # mTLS 客户端证书（与私钥成对）
# client_key_path = "/etc/iot-daq/tls/client.key"   # mTLS 客户端私钥（与证书成对）
# alpn = ["mqtt"]                       # 可选；缺省 = 不协商 ALPN
# server_name = "broker.example.com"    # 可选；须与 broker host 一致（SNI 覆盖）

# ── 设备分组（可选；默认分组 default/「默认分组」永远存在且不可删除）──
# [[device_groups]]
# id = "line-a"                          # 唯一；仅 [A-Za-z0-9_-]，不得为 default
# name = "A 线"
#
# [[devices]]                            # 设备登记（可选）：所属分组在此声明
# device_id = "plc-01"
# protocol = "modbus-tcp"
# group_id = "line-a"                    # 缺省 / 空 = 归属默认分组

# ── 采集点位（本地页面测试可不配）──
# [[points]]
# device_id = "plc-01"
# point_id = "40001"                     # 点位标识 = 南向寄存器号（modbus 4xxxx / s7 DB.. / mc D..）
# protocol = "modbus-tcp"               # modbus-tcp | modbus-rtu | s7 ...
# address = "192.168.1.10:502"           # 设备接入端点（host:port）；同义字段 endpoint 亦可
# frequency_ms = 1000
# push_enabled = true                    # 北向推送开关（别名 push）；false = 只采集/进实时流，不转发
# ── 点位元数据（全部可选；缺省 = 未声明）──
# name = "炉温"                          # 显示名（缺省回退 point_id）
# data_type = "float32"                  # 数据类型
# byte_order = "ABCD"                    # 字节序
# unit = "degC"                          # 工程单位
# deadband = 0.5                         # 死区阈值（number，工程单位）
# target_key = "temperature"             # 北向目标键（缺省回退 point_id）
# point_type = "physical"                # physical（默认）| derived（公式派生）
# formula = "p_a + p_b"                  # 公式表达式（point_type = derived 时使用）

# ── 点位模拟（可选；缺省关闭，走真实南向读）──
# [[points]]
# device_id = "plc-01"
# point_id = "40001"                     # 点位标识 = 南向寄存器号
# protocol = "modbus-tcp"
# address = "192.168.1.10:502"           # 设备接入端点（host:port）
# frequency_ms = 1000
# sim_enabled = true                     # 开启该点位模拟（不发起真实南向读）
# sim_mode = "random"                    # 模拟模式（可选；建议 random | fixed，引擎定义取值域）
# sim_min = 0.0                          # 模拟值下限
# sim_max = 100.0                        # 模拟值上限
# sim_dec = 2                            # 模拟值小数位数
# sim_period_ms = 500                    # 模拟刷新周期（ms；缺省回退 frequency_ms）

# ── 转发规则（可选；when/actions 为结构化引擎字段，语义见 crates/daemon/src/rules.rs）──
# [[rules]]
# id = "r1"
# name = "只转好值"
# forwarder_id = "line1_m1"              # 生效出口 id（[[outlets]].name）——UI 字段
# priority = 10                          # 数字越小越先匹配（缺省 0）——UI 字段
# enabled = true
#
# [rules.when]                           # WHERE 条件树（缺省 = 恒真通配）
# kind = "cmp"                           # cmp | and | or | not
# field = "value"
# op = "gt"                              # gt | ge | lt | le | eq | ne
# value = 30
#
# [[rules.actions]]                      # DO 动作（publish | remap）
# kind = "publish"
# topic = "alarms"

# ── 告警配置（可选）──
# [alarms]
# enabled = true
# [[alarms.rules]]
# id = "a1"
# name = "设备离线"
# level = "major"                        # critical | major | minor | warning
# source_type = "device"                 # device | forwarder | license | system
# condition = "status == offline"
# device_id = "dev-1"                    # 绑定设备（可选；缺省 = 任意设备）
# point_id = "p1"                        # 绑定点位（可选；缺省 = 设备级聚合）
# op = "gt"                              # 比较运算：gt | ge | lt | le | eq | ne
# threshold = 0.5                        # 数值阈值（可选）
# duration_ms = 5000                     # 持续满足该时长才触发（可选；缺省立即）
# suppress_ms = 60000                    # 抑制窗口（可选；缺省不抑制）
# enabled = true

# ── 管理面登录（生产路）。配置了本段则 dev 环境变量路自动关闭 ──
# [[mgmt_auth.users]]
# name = "alice"
# role = "system"                       # 内置角色（ops | lic_ops | risk | system）
# password_hash = "<Argon2id PHC 串，形如 $argon2id$v=19$m=19456,t=2,p=1$<b64salt>$<b64hash>>"
#                                        # 新格式（加盐，抗弱口令字典反查），出厂即按此填写。
#                                        # 仍兼容旧的 sha256(password) 64 位 hex，供存量账号
#                                        # 平滑升级；首次登录成功会自动改写为 Argon2id。
#
# ── 自定义角色（可选；[[mgmt_auth.roles]]）──
# [[mgmt_auth.roles]]
# id = "viewer"                          # 角色唯一标识
# name = "只读"                          # 角色显示名
# permissions = ["device.view", "audit.view"]   # 权限 id（见 rbac::Permission）

# ── 运维（计划重启，可选；不配 = 不启用）──
# [ops]
# scheduled_restart_at = "02:30"                # 每日定时重启时刻（本地时区，24 小时制 HH:MM）；
#                                               # 空串 / 不配 = 关闭。同一天只生效一次——
#                                               # 触发后日期写入 last_restart_date，次日自动恢复。
#                                               # 命中后走与 `POST /api/ops/restart` 完全相同的
#                                               # 优雅停机通道，由 Supervisor / 服务管理器拉起。
# last_restart_date = ""                        # 最近一次计划重启日期（YYYY-MM-DD；由调度器写入，勿手改）
#
# 管理面读写（需 ops.restart 权限）：
#   GET  /api/ops/scheduled-restart   → {enabled, at, last_fired, timezone}
#   PUT  /api/ops/scheduled-restart   → body {at: "HH:MM"|"", reason, note?, confirm}
#                                       confirm 固定回显 `scheduled-restart`
