[package]
name = "daemon"
description = "工业边缘网关核心守护进程库（驱动 / 数据处理 / 缓存 / 北向 MQTT / 授权 / 管理 API）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# task 3 机器码指纹：多源锚点 + N-of-M + HMAC-SHA256（纯 Rust 栈）。
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

# task 4 配置管理：TOML 解析 + notify 热重载（纯 Rust；Windows 侧 notify 走系统 API 声明）。
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "8"

# task 5 日志：tracing 分级 + JSON 结构化可选 + 按天轮转。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# task 8 南向驱动抽象：`#[async_trait]` 异步 trait（纯 Rust 栈红线合规）。
async-trait = "0.1"

# task 15 数据处理层：复用北向 schema 的 Quality 枚举（单一数据源，禁止两套质量码定义）。
protocol-proto = { path = "../protocol-proto" }

# task 9 Modbus TCP/RTU 驱动：tokio-modbus 0.17（纯 Rust；默认特性已含 rtu+tcp，
# tcp-server 供单测 mock 服务器；不启用 tokio-serial —— 真串口接入留待后续 wave）。
tokio-modbus = { version = "0.17", features = ["tcp-server"] }

# task 9 异步运行时（自 task 8 dev-dependency 升为正式依赖）：
# rt+macros 执行异步单测，net 连接 TCP/RTU 传输，time 支撑请求超时与重连退避，
# io-util 供传输层 AsyncRead/Write，sync 供单测 oneshot 断言通道。
# tcp-server 特性会额外启用 rt-multi-thread。
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "signal", "fs"] }
# task 19 / 依赖红线：rumqttc 的默认 `use-rustls` 特性展开为
# `use-rustls-no-provider + tokio-rustls/default`，而 `tokio-rustls/default` 会启用
# `aws_lc_rs` → 把 `aws-lc-rs` / `aws-lc-sys`（cmake/NASM C 构建）拉进活动依赖图，
# 违反「纯 Rust 依赖栈」红线（Linux CI 与 arm64 容器构建会踩）。
# 故关闭默认特性，仅启用 `use-rustls-no-provider`：保留 rustls 传输能力（`Transport::tls` 仍在），
# 但**不装任何 crypto provider**，由 daemon 侧 `ensure_rustls_provider()` 显式安装 `ring`
# （见 src/north/mqtt.rs，`to_transport` 在建连前调用）。
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
# task 19 mqtts 依赖修正：rumqttc/tokio-rustls 引入的 rustls 未启用任何 crypto provider，
# `CryptoProvider::get_default()` 返回 None → mqtts 握手必然无 provider。
# 显式启用 `ring`（纯 Rust 侧可构建；**不要选 aws-lc-rs**：cmake/NASM C 构建，违反纯 Rust 栈红线）。
# 特性在同一 rustls 0.23.x 上做版本统一，无需改动 rumqttc/tokio-rustls 自身配置。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
ed25519-dalek = "3.0.0"
serde_json = "1.0.151"
base64 = "0.23.1"
# v4：task 21 AuthBlock 的防重放 nonce（其余特性不启用，避免引入不必要的 RNG 依赖面）。
uuid = { version = "1.26.1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
prost = "0.13"
# task 52 管理 API：axum 0.7.9 已在 Cargo.lock（licensing-server 引入），零新增下载；
# 纯 Rust 栈合规（hyper/tower 全 Rust，无系统 C 库）。
axum = "0.7.9"
# task 52 SSE：Stream trait 来源（0.1.19 已在 Cargo.lock；SSE 的 Sse<S> 需要 impl Stream）。
tokio-stream = "0.1"
# task 52 SSE：Sse<S> 的 TryStream 约束来自 futures-core（0.3.34 已在 Cargo.lock，零下载）。
futures-core = "0.3"
# task 10 OPC UA 驱动：async-opcua 0.19 拆分 crate（MPL-2.0，deny.toml 已白名单）。
# 南向驱动为客户端角色 → async-opcua-client；不修改上游源码。
async-opcua-client = "0.19"
# task 10 驱动直接使用 types 层类型（NodeId / Variant / 服务请求结构等）。
async-opcua-types = "0.19"

[dev-dependencies]
# task 10 单测内嵌示例 OPC UA 服务器（connect / browse / read / write 全链路）。
async-opcua-server = "0.19"
# task 10 测试节点管理器实现 InMemoryNodeManagerImpl::write 需要 core 的 RwLock 类型。
async-opcua-core = "0.19"
# 热重载/日志轮转测试用临时目录。
tempfile = "3"

# 跨 crate 协议契约一致性测试（tests/licensing_contract_conformance.rs）：
# 直接引用 licensing-server 的 device_auth/proto/keys，逐字节比对签名域、端到端验签、
# 请求体形状。**仅测试依赖**，不影响 daemon 生产依赖闭包。
licensing-server = { path = "../licensing-server" }

# task 16 调度器单测：tokio 时间加速（pause / advance），避免真实等待秒级轮询间隔。
tokio = { version = "1", features = ["test-util", "rt", "macros", "time", "sync"] }

# task 25 TLS/mTLS：**真实握手**集成测试的客户端侧传输（`tokio-rustls` 0.26.5 已由
# rumqttc 引入 Cargo.lock，登记为 dev-dep 不新增下载）；`rustls-pemfile` 读测试 PEM。
# 纯 Rust 栈合规（rustls 系，crypto provider 统一 `ring`）。
# **必须关闭 default 特性**：tokio-rustls 的 default = ["logging","tls12","aws_lc_rs"]，
# 开着会把 aws-lc-rs 重新拉回 dev/test 依赖图（红线违规；CI `cargo deny check` 仍会红）。
# 显式声明测试真正需要的三个特性（ring provider + tls12 + logging），等价于去掉 default 的 aws_lc_rs。
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
# task 25 真实握手测试需要构造 `ServerName` / 证书解析（1.15.1 已在 Cargo.lock）。
rustls-pki-types = "1.15.1"

# task 33：headless 守护进程入口（thin main，业务全在 lib：bootstrap 装配 + mgmt 服务）。
# tauri-shell 的 Windows CI 以此产物作为 daemon 侧车（resource_dir 拉起）。
[[bin]]
name = "iot-daq-daemon"
path = "src/bin/iot-daq-daemon.rs"

# ── task 50 Tier-1 二进制硬化 profile（登记说明）─────────────────────────────
# 硬化目标口径：strip = true / lto = true / panic = "abort" / codegen-units = 1
# （opt-level 保持默认 3）。
#
# 现状与冲突说明：workspace 根 Cargo.toml 的 [profile.release] 已全局声明
#   strip = true、lto = "thin"、codegen-units = 1、panic = "abort"、opt-level = 3，
# 并对 daemon 的 release 产物（iot-daq-daemon bin）直接生效。
# Cargo 规则：[profile.*] 仅在 workspace 根 Cargo.toml 有效，非根成员内声明会被
# 忽略并产生告警，因此 daemon 侧不重复声明 profile，仅在此登记差异与后续动作：
#   1. lto = "thin"（根）弱于目标口径 lto = true（fat LTO）；如需最强加固，
#      应由 workspace 根统一升级（task 50 红线：禁改根文件，留待后续任务）。
#   2. panic = "abort" 已满足；strip = true / codegen-units = 1 已满足。
#   3. cargo test 走 dev profile，不受上述 release 配置影响（单测可正常断言 panic）。
#   4. 代码签名（CI）+ 段哈希自检（src/hardening.rs，task 58 manifest 注入 expected）
#      与本 profile 配合构成 Tier-1 完整基线；禁 Tier-2/3（壳/驱动/加密狗）。
