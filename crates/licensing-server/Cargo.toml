[package]
name = "licensing-server"
description = "云端授权服务（激活 / 心跳 / Lease Token 签发 / 激活码生命周期 / 服务端二次校验）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# task 6：LicenseError / LicenseResult 统一错误（主体实现 Wave 6 task 45-46）。
thiserror = "2"
# Ed25519 签发 / 验签（与 daemon 侧 crate::auth::signing 同一算法族）。
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
# base64 编解码（密钥从环境变量注入、Token 传输）。
base64 = "0.23"
# SHA-256：回执语义哈希（与 daemon 侧 `semantic_digest` 同族）。
# ⚠️ 仅在**回执**管线使用——Lease Token 是**直签域串、无预哈希**，两条管线不可混用。
sha2 = "0.10"
# 序列化（Token 载荷、API 请求响应）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 随机：激活码生成、nonce、测试密钥。
rand = "0.9"
# 存储：与 daemon 侧同口径（单文件 SQLite + WAL）。
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 并发：连接互斥（服务端并发量低，单连接 + Mutex 比连接池更易保证事务语义）。
parking_lot = "0.12"
# HTTP 层（task 45）：axum 路由 + tokio 多线程运行时。
# 纯 Rust 依赖栈红线：关闭 axum 默认特性中 `tokio`/`http2`/`multipart` 之外可能拖入的
# C 依赖（本项目仅需 HTTP/1.1 JSON 路由，无需 TLS —— TLS 由外层反代终止）。
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# 请求日志。
tracing = "0.1"
# D-05：bin 入口的日志初始化（tracing-subscriber 已在 workspace 依赖树——daemon
# 引入，仅新增依赖边，零新增下载；纯 Rust 栈合规）。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# tower 的 `ServiceExt::oneshot` 用于路由级集成测试（真实请求 → 真实响应）。
tower = { version = "0.5", features = ["util"] }
