# iot-daq 网关默认配置模板（占位值，现场由持久卷 config/ 覆盖）
#
# ⚠️ 本文件随镜像层分发 → 属公开内容 → 严禁写任何真实凭据 / 密钥 / 激活码。
# ⚠️ 本模板的**每一行**都必须在 daemon 的 GatewayConfig schema 内
#    （crates/daemon/src/config.rs：gateway / outlets / points / devices / mgmt_auth）。
#    schema 之外的段会被 serde **静默忽略**（D-07 教训：惰性摆设比缺失更危险）。
#
# 以下部署参数不属于 TOML schema，全部经**环境变量**注入（勿写进本文件）：
#   - 指纹 HMAC 盐：IOT_DAQ_FINGERPRINT_KEY（env）或 IOT_DAQ_FINGERPRINT_KEY_FILE（secret 文件路径）
#   - 宿主锚点 / MAC：IOT_DAQ_HOST_ANCHOR_ROOT、IOT_DAQ_HOST_MACHINE_ID_PATH、
#     IOT_DAQ_HOST_MAC、IOT_DAQ_HOST_FINGERPRINT_FILE
#   - 数据根目录覆盖：IOT_DAQ_DATA_DIR（存在且非空时优先于下方 data_dir）
#   - 管理面绑定：IOT_DAQ_MGMT_BIND（或 IOT_DAQ_HTTP_BIND / IOT_DAQ_HTTP_PORT）
#   - 日志：IOT_DAQ_LOG_LEVEL / IOT_DAQ_LOG_JSON
#
# 权威设计：docs/design/container-deploy.md + container-persistence-layout.md

[gateway]
# 网关标识（平台侧登记；缺省占位，现场覆盖）
gateway_id = "gw-unset"
# 数据根目录（陷阱 2 红线：设备签名密钥 / 试用标记 / 审计库全部落在这里）。
# 容器形态：宿主持久卷挂载点 /var/lib/iot-daq（勿用容器内相对路径——
# docker rm && docker run 即重置授权状态）。本地开发可省略本键（默认相对 data）。
data_dir = "/var/lib/iot-daq"

[gateway.licensing]
# 云授权服务地址（开源版硬编码；生产环境可通过环境变量 IOT_DAQ_LICENSE_SERVER_URL 覆盖）
# 容器形态的两种赋值方式：
#   ① 镜像内硬编码（当前，适合开源版 / 统一云服务）
#   ② 设 env IOT_DAQ_LICENSE_SERVER_URL（**可覆盖本值**，适用于自建授权服务场景）
cloud_url = "http://license.webscad.cn/licensing"
# 心跳间隔（秒；默认 24h，与 auth::client 口径一致）
heartbeat_interval_secs = 86400
# 激活码是**敏感凭据**：默认注释掉（未配置 = 不启用云端激活）。
# 真实值经 env IOTDAQ_ACTIVATION_CODE 注入；本文件只允许占位符。
# activation_code = "IOTDAQ-0000-0000-0000-0000"
# 试用 / 离线宽限天数（与 TRIAL_DAYS=3 / GRACE_DAYS=7 口径一致）
trial_days = 3
grace_days = 7

[gateway.cache]
# 本地缓存库（相对 data_dir）
sqlite_path = "cache.db"
# 缓存上限（MB；超出后按环形覆盖策略淘汰）
max_size_mb = 512
# 保留天数（离线缓存 ≥7 天）
retention_days = 7

[gateway.security]
# Web 管理界面账号鉴权开关（缺省 true = 强制账号密码）
web_auth_enabled = true
# tls_cert_path / tls_key_path 可选（北向/界面 TLS 证书与私钥路径）

# ---- 以下段默认注释：按现场需求取消注释（示例值即 schema 字段名） ----

# [[outlets]]
# name = "north-1"
# broker = "mqtts://broker.local:8883"
# topic_prefix = "telemetry"
# qos = 1
# tls = true
# encoding = "protobuf"                  # protobuf（默认）/ json
# ca_cert_path = "/certs/ca.crt"         # 可选；缺省用操作系统根证书库
# client_cert_path = "/certs/client.crt" # 可选；mTLS（与 client_key_path 成对）
# client_key_path = "/certs/client.key"
# server_name = "broker.local"           # 可选；SNI 覆盖（不是跳过校验开关）
# alpn = ["mqtt"]

# [[points]]
# device_id = "dev-01"
# point_id = "40001"                     # 点位标识（南向寄存器地址，如 Modbus 5 位编址）
# protocol = "modbus-tcp"                # modbus-tcp / modbus-rtu / opcua / s7 / mc / http / mqtt
# address = "192.168.1.10:502"           # 设备接入地址
# frequency_ms = 1000                    # 采集频率（毫秒）

# [[devices]]
# device_id = "dev-01"
# name = "一号设备"                       # 可选；显示名
# enabled = true

# [mgmt_auth]
# [[mgmt_auth.users]]
# name = "ops"
# role = "ops"                           # ops / lic_ops / risk / system
# password_hash = "<Argon2id PHC 串，形如 $argon2id$v=19$m=19456,t=2,p=1$<b64salt>$<b64hash>>"
#                                        # 新格式（加盐）。仍兼容旧的 sha256(password) hex，
#                                        # 首次登录成功会自动升级为 Argon2id。

# ---- OTA（系统更新）：默认关闭；启用需 enabled + signing_key_b64 +（manifest_url 或 cloud_url）----
# 字段与 crates/daemon/src/config.rs 的 OtaSection 严格一致。就绪判定 = is_ready：
# enabled=false / 无生效端点 / 公钥空白 → 调度任务只记一次 warn 并跳过，绝不 panic、绝不静默。
# V1 manifest 仅支持 http:// 明文，完整性由 Ed25519 验签兜底。
# ★ manifest_url 可省略：省略时按 {cloud_url}/updates/manifest 推导（cloud_url 取
#   [gateway.licensing].cloud_url，容器形态经 IOT_DAQ_LICENSE_SERVER_URL 注入）。
# ★ 容器形态（/etc/iot-daq/gateway.toml 只读不可写）经 env 注入：
#   IOT_DAQ_OTA_ENABLED / IOT_DAQ_OTA_SIGNING_KEY_B64 / IOT_DAQ_OTA_MANIFEST_URL（可省略）/
#   IOT_DAQ_OTA_CURRENT_VERSION。
# [gateway.ota]
# enabled = false                          # 缺省 false = 不做任何检查、不发网络请求
# manifest_url = "http://license.webscad.cn/licensing/updates/manifest"
#                                          # 可省略（按 cloud_url 推导）
# poll_interval_secs = 3600                # 轮询周期（秒；缺省 3600）
# signing_key_b64 = "<授权端 Ed25519 公钥 base64>"  # 32 字节公钥标准 base64
# current_version = 0                      # 网关当前 OTA 版本号（u64；新包须严格大于此值）
