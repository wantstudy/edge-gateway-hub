# =============================================================================
# iot-daq 网关 · docker-compose.yml（随包唯一事实源，现场人工零编辑）
# =============================================================================
# 设计依据：docs/design/container-deploy.md §4
#
# ★ 两条致命陷阱在此文件的固化点（改动前必读）：
#
#   [陷阱 1] 机器码必须取自宿主机 —— 见下方 `volumes:` 里的两处 `:ro` 挂载：
#       - ${IOT_DAQ_HOST_MACHINE_ID}:/host/etc/machine-id:ro
#       - ${IOT_DAQ_HOST_DMI_DIR}:/host/sys/class/dmi/id:ro
#     以及宿主 MAC 经 `environment.IOT_DAQ_HOST_MAC` 注入（由安装脚本采集）。
#     ✗ 绝不允许把容器内 /etc/machine-id 当作锚点（重建即变 → 授权失效 + SQLCipher 解不开）。
#
#   [陷阱 2] 授权状态必须落宿主机持久卷 —— 见 `read_only: true` + 单一
#     读写卷 `${IOT_DAQ_DATA_DIR}:/var/lib/iot-daq`，其余可写路径全部 tmpfs。
#     ✗ 绝不允许去掉该挂载或改成匿名卷 —— 否则 docker rm && docker run 即重置试用。
#
# 红线（container-deploy.md §5）：禁 privileged、禁挂 docker.sock、禁网络自更新。
# 校验：docker compose -f deploy/docker/docker-compose.yml config
# =============================================================================

services:
  gateway:
    # 镜像一律 digest 引用，禁可变 tag / latest（supply-chain.md §6）
    image: ${IOT_DAQ_IMAGE:?必须通过 --env-file 提供 IOT_DAQ_IMAGE（digest 形式）}
    container_name: ${IOT_DAQ_CONTAINER_NAME:-iot-daq-gateway}

    # ---- 网络：host 模式（Modbus TCP 广播发现 / UDP 组播必需，deploy.md §2.2）----
    # 注意：host 模式下不要写 ports:，会与 network_mode 冲突。
    network_mode: host

    # ---- 串口设备接入（deploy.md §2.1）----
    # 声明几个开几个；未插线的节点会导致启动失败。
    devices:
      - ${IOT_DAQ_SERIAL_DEVICES:-/dev/ttyUSB0}

    # ---- 串口节点组属主（常见 crw-rw---- root dialout）----
    # 这是 --privileged 的最小化替代方案。
    group_add:
      - ${IOT_DAQ_SERIAL_GROUP:-dialout}

    # =========================================================================
    # ★ 陷阱 2 主防线：只读根文件系统
    # =========================================================================
    # read_only: true 使镜像可写层不可写 → 「镜像可写层承载授权数据」在物理上不可能，
    # 容器重建无法借此重置试用 / 租约（persistence-layout.md 结论二）。
    read_only: true

    # 需要可写的路径一律显式 tmpfs（容器生命周期内有效、重建即清空，
    # 因此**只放**临时文件，绝不放授权状态）。
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=0755
      - /home/nonroot:rw,noexec,nosuid,size=16m,mode=0700

    # =========================================================================
    # ★ 陷阱 1 + 陷阱 2 双防线：卷挂载
    # =========================================================================
    volumes:
      # ---- 陷阱 2：唯一持久根（授权 / 试用 / 租约 / 队列 / 配置 / 日志）----
      # 必须保留 rw 语义；删掉本行 = 直接打开「重置试用」后门。
      - ${IOT_DAQ_DATA_DIR:-/var/lib/iot-daq}:/var/lib/iot-daq:rw

      # ---- 陷阱 1：宿主 OS 安装期标识，只读 ----
      # 容器内路径带 /host 前缀，避免与镜像内 /etc/machine-id（runtime 生成）混淆。
      - ${IOT_DAQ_HOST_MACHINE_ID:-/etc/machine-id}:/host/etc/machine-id:ro

      # ---- 陷阱 1：宿主 DMI（product_uuid / board_serial 等），只读 ----
      - ${IOT_DAQ_HOST_DMI_DIR:-/sys/class/dmi/id}:/host/sys/class/dmi/id:ro

      # ---- 陷阱 1 降级路径：宿主机 MAC 指纹文件（安装脚本生成），只读 ----
      - ${IOT_DAQ_FINGERPRINT_FILE:-/var/lib/iot-daq/host-fingerprint.json}:/var/lib/iot-daq/host-fingerprint.json:ro

      # ---- 指纹 HMAC 盐：只读 secret，绝不进镜像层 ----
      # 现场由 install.sh 交互式写入宿主机，权限 0600，属主 = 数据目录属主。
      - ${IOT_DAQ_FINGERPRINT_KEY_FILE:-/run/secrets/iot-daq-fingerprint-key}:/run/secrets/iot-daq-fingerprint-key:ro

    # ---- 安全加固 ----
    security_opt:
      - no-new-privileges:true          # 阻断容器内提权
    cap_drop:
      - ALL                             # 不申请任何 capability
    cap_add:
      # host 网络下进程仅监听业务端口，无需 NET_ADMIN；
      # 若现场需绑定 <1024 端口（如 502），再按需放开并记录变更。
      - NET_BIND_SERVICE

    # ---- 环境变量（全部有默认值，见 deploy/.env.example）----
    environment:
      IOT_DAQ_CONFIG: /etc/iot-daq/gateway.toml
      IOT_DAQ_DATA_DIR: /var/lib/iot-daq
      IOT_DAQ_HOST_MACHINE_ID_PATH: /host/etc/machine-id
      IOT_DAQ_HOST_DMI_DIR_PATH: /host/sys/class/dmi/id
      IOT_DAQ_HOST_FINGERPRINT_FILE: /var/lib/iot-daq/host-fingerprint.json
      IOT_DAQ_FINGERPRINT_KEY_FILE: /run/secrets/iot-daq-fingerprint-key
      # ★ 陷阱 1 关键：宿主 MAC 由安装脚本采集后注入，daemon 的 EnvAnchor 读取；
      # 容器自身 MAC（veth）严禁参与指纹。
      IOT_DAQ_HOST_MAC: ${IOT_DAQ_HOST_MAC:-}
      # 容器内自行采集开关：必须为 0（禁止回退到容器内 machine-id / 容器 MAC / 主机名）
      IOT_DAQ_ALLOW_CONTAINER_ANCHORS: "0"
      IOT_DAQ_LICENSE_SERVER_URL: ${IOT_DAQ_LICENSE_SERVER_URL:-}
      IOT_DAQ_LEASE_HEARTBEAT_SECS: ${IOT_DAQ_LEASE_HEARTBEAT_SECS:-300}
      IOT_DAQ_LEASE_GRACE_SECS: ${IOT_DAQ_LEASE_GRACE_SECS:-86400}
      IOT_DAQ_HTTP_BIND: ${IOT_DAQ_HTTP_BIND:-0.0.0.0}
      IOT_DAQ_HTTP_PORT: ${IOT_DAQ_HTTP_PORT:-8080}
      IOT_DAQ_LOG_LEVEL: ${IOT_DAQ_LOG_LEVEL:-info}
      IOT_DAQ_LOG_JSON: ${IOT_DAQ_LOG_JSON:-false}
      IOT_DAQ_TAMPER_POLICY: ${IOT_DAQ_TAMPER_POLICY:-restricted}
      IOT_DAQ_OFFLINE_MODE: ${IOT_DAQ_OFFLINE_MODE:-1}
      TZ: ${IOT_DAQ_TZ:-Asia/Shanghai}

    # ---- 资源限制（deploy.md §2.3；≤8 设备用默认值）----
    mem_limit: ${IOT_DAQ_MEM_LIMIT:-512m}
    cpus: ${IOT_DAQ_CPUS:-1.0}

    # ---- 重启策略：现场断电 / 宿主重启自愈；人工 docker stop 后不违反运维意图 ----
    restart: unless-stopped

    # ---- 健康检查（判据见 deploy.md §3.1）----
    # ★ D-06 修复：镜像为 distroless/static（无 shell、无 curl/wget），
    #   CMD-SHELL + /dev/tcp 在容器内必失败。改用镜像内置的静态探针二进制
    #   /usr/local/bin/healthprobe（纯 std 零依赖，源码见 deploy/docker/healthprobe/），
    #   exec-form 调用：每次执行一次 TCP connect 127.0.0.1:$IOT_DAQ_HTTP_PORT，
    #   成功 exit 0 / 失败 exit 1。HTTP 语义的 /healthz 校验由 install.sh 在宿主侧补做。
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthprobe"]
      interval: ${IOT_DAQ_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${IOT_DAQ_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${IOT_DAQ_HEALTHCHECK_RETRIES:-3}
      start_period: ${IOT_DAQ_HEALTHCHECK_START_PERIOD:-20s}

    # ---- 日志驱动：防写爆宿主盘（无人值守现场）----
    # 审计 / 授权日志不走 stdout，落持久卷 logs/（deploy.md §2.4）。
    logging:
      driver: json-file
      options:
        max-size: ${IOT_DAQ_LOG_MAX_SIZE:-20m}
        max-file: ${IOT_DAQ_LOG_MAX_FILE:-5}

    # =========================================================================
    # 明确不使用的项（红线，勿取消注释）：
    #   privileged: true            ✗ 全开能力面远超业务所需
    #   /var/run/docker.sock        ✗ 宿主 Docker 控制权 = 变相 root + 破坏指纹原则
    #   pid: host / ipc: host       ✗ 无业务需要
    #   network_mode: bridge+ports  ✗ 广播发现经 docker-proxy 不可达（已知坑）
    # =========================================================================

# 使用宿主绑定目录而非 named volume：便于现场用标准 Linux 工具审计 / 备份 / 权限收紧，
# 也让「授权状态落宿主机」这件事在文件系统层面一目了然（persistence-layout §1）。
