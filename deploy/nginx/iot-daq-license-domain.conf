# =============================================================================
# iot-daq 授权端 · 公网域名入口（port 80）
#   - server_name 精确匹配 license.webscad.cn，不影响既有站点（`server_name _;` 仍是兜底）
#   - /licensing/* 剥前缀反代到授权端容器 127.0.0.1:9010
#   - 与 iot-daq-both.conf 的 :9013 站点并存（同一 root 与同一上游）
#   - 本次按用户要求**不做 TLS**
# =============================================================================
server {
    listen 80;
    server_name license.webscad.cn;

    access_log /www/wwwlogs/iot-daq-license-domain.access.log;
    error_log  /www/wwwlogs/iot-daq-license-domain.error.log;

    root /www/wwwroot/iot-daq-licensing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /licensing/ {
        proxy_pass http://127.0.0.1:9010/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
