# =============================================================================
# iot-daq 授权端 · nginx 站点配置（宿主 nginx，宝塔托管环境适配）
# =============================================================================
# 作用：
#   1) 托管 admin-console 构建产物（Vue3 + hash 路由，**无需 SPA fallback**）；
#   2) 把 `/licensing/*` **剥掉前缀**反代到 licensing-server 容器（127.0.0.1:7080）。
#
# 为什么剥前缀：admin-console 的 API baseURL 是硬编码同源相对前缀 `/licensing`
#   （admin-console/src/api/client.ts:38 `const BASE_PATH = '/licensing'`），
#   而后端路由本身不带前缀（crates/licensing-server/src/http.rs:95-121，
#   如 `/admin/auth/login`）。故 nginx 必须 `proxy_pass ...:7080/`（带尾斜杠）。
#
# 安装位置（宝塔 v11 托管 nginx 的 vhost 目录，被主配置 include）：
#   /www/server/panel/vhost/nginx/iot-daq-licensing.conf
# 生效：
#   nginx -t && nginx -s reload
#
# 说明：本 server 块只以**服务器 IP** 为 server_name，精确匹配优先于既有的
#   `server_name _;` 默认块，不侵入/覆盖任何既有站点（lnanyuda.com 等）。
# =============================================================================

server {
    listen 80;
    server_name 60.205.8.146;

    access_log /www/wwwlogs/iot-daq-licensing.access.log;
    error_log  /www/wwwlogs/iot-daq-licensing.error.log;

    # admin-console 构建产物（本地构建 → 上传解压，服务器上不构建）
    root /www/wwwroot/iot-daq-licensing;
    index index.html;

    # 静态资源（hash 路由：任意 `/#/xxx` 都由 index.html 承载，无需 history fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的资源强缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- API 反代：/licensing/* → licensing-server（剥前缀）----
    location /licensing/ {
        proxy_pass http://127.0.0.1:7080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Authorization 默认透传，此处显式声明以免上游 WAF 规则误删
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
