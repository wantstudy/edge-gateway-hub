[package]
name = "iot-daq-gateway"
version = "0.1.0"
description = "iot-daq 工业边缘网关 · Windows 桌面壳（Tauri 2.x 承载 web-console + 拉起 daemon 侧车）"
authors = ["iot-daq team"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.85"

# 本 crate 为**独立 Cargo 工程**（顶部 [workspace] 脱离根 workspace），
# 目的：不让 Windows-only 的 Tauri 依赖进入根 workspace，保持 `cargo build --workspace`
# 在 Linux/macOS CI 上仍可绿灯（Tauri 仅 windows-latest 构建）。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 说明：本壳**不**直接依赖 crates/daemon（避免引入 rusqlite 等 C 依赖与跨平台链接问题）。
# daemon 以**侧车（sidecar）**形式随包分发，由本程序在启动时尝试拉起，UI 经 127.0.0.1:8080 与其通信。
# 侧车进程通过 `std::process::Command` 从 `resource_dir()` 拉起（不依赖 Tauri externalBin 注册，
# 因此即便尚未提供 daemon 二进制，`tauri build` 也能产出安装包；缺失时壳以「纯 UI 模式」降级运行）。
# 本 crate 依赖栈纯净，符合「纯 Rust」红线。

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
