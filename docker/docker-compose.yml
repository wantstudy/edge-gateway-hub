# =============================================================================
# IoT-DAQ 网关 · docker-compose.yml（标准部署版，与官网/README 一键命令等价）
# =============================================================================
# 等价的 docker run：
#   docker run -d \
#   --name edge-gateway-hub \
#   --network host \
#   --restart=always \
#   -v /data/edge-gateway:/var/lib/iot-daq:rw \
#   -v /etc/machine-id:/host/etc/machine-id:ro \
#   -v /sys/class/dmi/id:/host/sys/class/dmi/id:ro \
#   -e TZ=Asia/Shanghai \
#   wantstudy/iot-daq-gateway:latest
#
# 说明：
#   [机器码] 自动取自宿主机（/etc/machine-id + DMI），容器重建不变；
#   [指纹密钥/授权状态] 随 /data/edge-gateway 持久化，首次启动自动生成；
#   [授权服务] 地址已内置镜像，无需任何环境变量；
#   [端口] host 网络，9011 = 管理 API，9012 = Web 控制台（http://<宿主IP>:9012）。
# =============================================================================

services:
  edge-gateway-hub:
    image: wantstudy/iot-daq-gateway:latest
    container_name: edge-gateway-hub

    # host 网络：Modbus TCP 广播发现 / UDP 组播必需；host 模式下禁止写 ports:
    network_mode: host

    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 唯一持久根（授权 / 试用 / 租约 / 队列 / 配置 / 日志）——删除即重置试用
      - /data/edge-gateway:/var/lib/iot-daq:rw
      # 机器码宿主锚点（只读）
      - /etc/machine-id:/host/etc/machine-id:ro
      - /sys/class/dmi/id:/host/sys/class/dmi/id:ro
    # ---- 串口采集（Modbus RTU 需要时取消注释并确认节点存在）----
    # devices:
    #   - /dev/ttyUSB0
    # group_add:
    #   - dialout
