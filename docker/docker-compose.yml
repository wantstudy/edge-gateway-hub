# =============================================================================
# IoT-DAQ 网关 · docker-compose.yml（用户快速部署版）
# =============================================================================
# 配套镜像：downloads/iot-daq-gateway_v0.1.0_amd64.tar.gz（docker load 后使用）
#
# 快速开始（3 步）：
#   1) 准备宿主目录与指纹密钥（见 README「Docker 部署」）：
#        sudo mkdir -p /opt/iot-daq/gateway/data /opt/iot-daq/gateway/secrets
#        sudo head -c 32 /dev/urandom | sudo tee /opt/iot-daq/gateway/secrets/iot-daq-fingerprint-key >/dev/null
#        sudo chown -R 65532:65532 /opt/iot-daq/gateway/data
#        sudo chown 65532:65532 /opt/iot-daq/gateway/secrets/iot-daq-fingerprint-key
#        sudo chmod 600 /opt/iot-daq/gateway/secrets/iot-daq-fingerprint-key
#   2) cp .env.example .env   （按需修改）
#   3) docker compose up -d
#
# 两条硬约束（删掉对应挂载 = 授权/数据丢失，责任自负）：
#   [机器码] 取自宿主机（/etc/machine-id + DMI + MAC），容器重建不变；
#   [授权状态] 只落宿主持久卷 data/（read_only 根文件系统，容器可写层物理上无法藏授权）。
# =============================================================================

services:
  gateway:
    image: ${IOT_DAQ_IMAGE:-iot-daq-gateway:0.1.0}
    container_name: ${IOT_DAQ_CONTAINER_NAME:-iot-daq-gateway}

    # 运行身份固定 65532（与数据目录属主、镜像内用户一致，漂移会 Permission denied）
    user: "65532:65532"

    # host 网络：Modbus TCP 广播发现 / UDP 组播必需；host 模式下禁止写 ports:
    network_mode: host

    restart: unless-stopped
    mem_limit: ${IOT_DAQ_MEM_LIMIT:-512m}
    cpus: ${IOT_DAQ_CPUS:-1.0}

    # ---- 串口采集（需要时取消注释并确认节点存在；无串口现场保持注释）----
    # devices:
    #   - ${IOT_DAQ_SERIAL_DEVICES:-/dev/ttyUSB0}
    # group_add:
    #   - dialout

    # ---- 安全加固：只读根 + 最小能力 ----
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # 可写路径全部显式 tmpfs（易失临时数据；绝不放授权状态）
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0755
      - /home/nonroot:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=0755
      - /var/log/nginx:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=0755
      - /var/lib/nginx:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0755

    volumes:
      # 唯一持久根（授权 / 试用 / 租约 / 队列 / 配置 / 日志）——删除即重置试用
      - ${IOT_DAQ_DATA_DIR:-/opt/iot-daq/gateway/data}:/var/lib/iot-daq:rw
      # 配置目录（gateway.toml 放这里，见 README）
      - ${IOT_DAQ_DATA_DIR:-/opt/iot-daq/gateway/data}/config:/etc/iot-daq:rw
      # 机器码宿主锚点（只读）
      - /etc/machine-id:/host/etc/machine-id:ro
      - /sys/class/dmi/id:/host/sys/class/dmi/id:ro
      # 指纹 HMAC 盐（首次安装生成一次，永不改名字节；丢失 = 授权装配 fail-closed）
      - ${IOT_DAQ_FINGERPRINT_KEY_FILE:-/opt/iot-daq/gateway/secrets/iot-daq-fingerprint-key}:/run/secrets/iot-daq-fingerprint-key:ro

    environment:
      IOT_DAQ_CONFIG: /etc/iot-daq/gateway.toml
      IOT_DAQ_DATA_DIR: /var/lib/iot-daq
      IOT_DAQ_HOST_MACHINE_ID_PATH: /host/etc/machine-id
      IOT_DAQ_HOST_DMI_DIR_PATH: /host/sys/class/dmi/id
      IOT_DAQ_HOST_FINGERPRINT_FILE: /var/lib/iot-daq/host-fingerprint.json
      IOT_DAQ_FINGERPRINT_KEY_FILE: /run/secrets/iot-daq-fingerprint-key
      IOT_DAQ_HOST_MAC: ${IOT_DAQ_HOST_MAC:-}
      IOT_DAQ_ALLOW_CONTAINER_ANCHORS: "0"
      # 授权服务基址（厂商托管，无需自建；换域名只改这里）
      IOT_DAQ_LICENSE_SERVER_URL: ${IOT_DAQ_LICENSE_SERVER_URL:-http://license.webscad.cn/licensing}
      IOT_DAQ_LEASE_HEARTBEAT_SECS: "300"
      IOT_DAQ_LEASE_GRACE_SECS: "86400"
      # 端口：9011 = 管理 API（含 /api），9012 = Web 控制台
      IOT_DAQ_HTTP_BIND: ${IOT_DAQ_HTTP_BIND:-0.0.0.0}
      IOT_DAQ_HTTP_PORT: ${IOT_DAQ_HTTP_PORT:-9011}
      IOT_DAQ_WEB_PORT: ${IOT_DAQ_WEB_PORT:-9012}
      IOT_DAQ_WEB_DIST: /srv/web-console
      IOT_DAQ_LOG_LEVEL: ${IOT_DAQ_LOG_LEVEL:-info}
      IOT_DAQ_LOG_JSON: "false"
      IOT_DAQ_TAMPER_POLICY: restricted
      IOT_DAQ_OFFLINE_MODE: "1"
      TZ: Asia/Shanghai

    healthcheck:
      # 镜像内置零依赖 TCP 探针（探测 IOT_DAQ_HTTP_PORT）
      test: ["CMD", "/usr/local/bin/healthprobe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
