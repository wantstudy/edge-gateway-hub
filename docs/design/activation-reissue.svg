<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1040" font-family="system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#16a34a"/></marker>
  </defs>
  <style>
    .h1{font-size:25px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .lane{font-size:12px;font-weight:700;fill:#1e293b}
    .msg{font-size:9.5px;fill:#334155}
    .note{font-size:8.5px;fill:#475569}
    .tn{font-size:8.5px;fill:#64748b}
    .chip{font-size:10px;font-weight:700}
  </style>
  <rect x="0" y="0" width="1560" height="1040" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text class="h1" x="28" y="42">iot-daq 换机迁移时序图：废弃原激活码 + 重发新码</text>
  <text class="h2" x="28" y="70">五步闭环：查码 → 废弃（立即失效）→ 重发 → 新机激活 → 审计留痕 · 对应计划 task 42 · Wave 0 设计基线（2026-09-23 定稿）</text>

  <!-- ===== 五步条 ===== -->
  <g>
    <rect x="28" y="84" width="270" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="chip" x="163" y="103" text-anchor="middle" fill="#334155">① 后台查到原激活码</text>
    <rect x="313" y="84" width="270" height="30" rx="15" fill="#fef2f2" stroke="#dc2626"/>
    <text class="chip" x="448" y="103" text-anchor="middle" fill="#b91c1c">② 废弃 → 原设备立即失效</text>
    <rect x="598" y="84" width="270" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="chip" x="733" y="103" text-anchor="middle" fill="#334155">③ 重发新激活码</text>
    <rect x="883" y="84" width="270" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
    <text class="chip" x="1018" y="103" text-anchor="middle" fill="#166534">④ 新机联网激活成功</text>
    <rect x="1168" y="84" width="292" height="30" rx="15" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="chip" x="1314" y="103" text-anchor="middle" fill="#166534">⑤ 审计留痕 + reissued_from 溯源</text>
  </g>

  <!-- ===== 泳道头 ===== -->
  <rect x="60" y="130" width="200" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="lane" x="160" y="154" text-anchor="middle">客户（现场 / IT）</text>
  <rect x="300" y="130" width="200" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text class="lane" x="400" y="154" text-anchor="middle">原设备（旧网关）</text>
  <rect x="600" y="130" width="220" height="38" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text class="lane" x="710" y="154" text-anchor="middle" fill="#92400e">总管理后台 admin-console</text>
  <rect x="900" y="130" width="220" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text class="lane" x="1010" y="154" text-anchor="middle" fill="#1e40af">云端授权服务 licensing-server</text>
  <rect x="1250" y="130" width="220" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="lane" x="1360" y="154" text-anchor="middle" fill="#166534">新设备（新网关）</text>

  <line x1="160" y1="168" x2="160" y2="1000" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="400" y1="168" x2="400" y2="1000" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="710" y1="168" x2="710" y2="1000" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="1010" y1="168" x2="1010" y2="1000" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="1360" y1="168" x2="1360" y2="1000" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- ===== ① 查码 ===== -->
  <line x1="160" y1="196" x2="704" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="msg" x="433" y="188" text-anchor="middle" font-weight="700">① 换机申请：告知厂商换机（提供原激活码 / 租户与订单信息）</text>

  <line x1="710" y1="236" x2="1004" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="msg" x="858" y="228" text-anchor="middle">GET /admin/codes?tenant=&amp;order=（按租户 / 订单筛选查询）</text>

  <line x1="1010" y1="272" x2="716" y2="272" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text class="msg" x="858" y="264" text-anchor="middle">返回：原码详情 · 状态 bound · 绑定原设备 · 心跳 / 回执历史</text>

  <rect x="600" y="300" width="330" height="88" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text class="note" x="614" y="320" fill="#92400e" font-weight="700">① 废弃二次确认（DangerConfirmModal）</text>
  <text class="note" x="614" y="338">· 影响清单：原设备将立即停止北向转发</text>
  <text class="note" x="614" y="352">   （本地采集继续）· 不可撤销</text>
  <text class="note" x="614" y="366">· 原因必填 + 补充说明 ≥10 字</text>
  <text class="note" x="614" y="380">· 输入激活码后 8 位二次校验</text>

  <!-- ===== ② 废弃 ===== -->
  <line x1="710" y1="412" x2="1004" y2="412" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="msg" x="858" y="404" text-anchor="middle" fill="#b91c1c" font-weight="700">② POST /admin/codes/{id}/revoke（原因 + 幂等键）</text>

  <rect x="1030" y="436" width="300" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="note" x="1042" y="457" fill="#b91c1c">置 revoked · 原租约立即作废（废弃 = 立即失效）</text>

  <line x1="1010" y1="492" x2="406" y2="492" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="msg" x="705" y="484" text-anchor="middle" fill="#b91c1c">下次心跳（≤24h 内）→ 403：租约已废弃</text>

  <rect x="250" y="516" width="300" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="note" x="264" y="534" fill="#b91c1c">进入降级 / 停止北向转发（本地采集保留）</text>
  <text class="note" x="264" y="550" fill="#b91c1c">全局横幅：设备授权已被厂商废弃，</text>
  <text class="note" x="264" y="566" fill="#b91c1c">请联系厂商办理换机（客户端无解绑入口）</text>

  <!-- ===== ③ 重发 ===== -->
  <line x1="710" y1="612" x2="1004" y2="612" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="msg" x="858" y="596" text-anchor="middle" font-weight="700">③ POST /admin/codes/{id}/reissue</text>
  <text class="msg" x="858" y="610" text-anchor="middle">预绑定新机器码 或 留待首次激活绑定 · 继承 tier / 有效期可选 · 同事务 · 幂等</text>

  <rect x="1030" y="634" width="310" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="note" x="1042" y="655">生成新 activation_code：reissued_from = 原码 · 审计留痕</text>

  <line x1="1010" y1="684" x2="716" y2="684" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text class="msg" x="858" y="676" text-anchor="middle">返回新激活码 → 后台告知用户新码</text>

  <!-- ===== ④ 新机激活 ===== -->
  <line x1="160" y1="724" x2="1354" y2="724" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="msg" x="758" y="716" text-anchor="middle" font-weight="700">④ 在新设备输入新激活码（必须联网激活）</text>

  <line x1="1360" y1="760" x2="1016" y2="760" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="msg" x="1185" y="752" text-anchor="middle">POST /activation（新码 + 新机机器码指纹 + 锚点哈希 + 设备公钥 + nonce）</text>

  <rect x="1030" y="788" width="310" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="note" x="1042" y="809">冲突检测（一机一码 1:1）→ 绑定新设备 → 签发 Lease Token</text>

  <line x1="1010" y1="844" x2="1354" y2="844" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <text class="msg" x="1185" y="836" text-anchor="middle">200 Lease Token（Ed25519 签名 · tier / 档位 / 有效期）</text>

  <rect x="1240" y="872" width="280" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="note" x="1380" y="890" text-anchor="middle" fill="#166534">本地验签通过 → 已激活 Active</text>
  <text class="note" x="1380" y="906" text-anchor="middle" fill="#166534">北向转发恢复 · 全局横幅解除</text>

  <!-- ===== ⑤ 审计 ===== -->
  <rect x="40" y="936" width="1480" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="note" x="56" y="956" fill="#166534" font-weight="700" font-size="10.5">⑤ 审计留痕与溯源</text>
  <text class="note" x="56" y="976">revoke / reissue / activation 全链审计（操作者 · 时间 · 原因 · 幂等键）；激活码详情页生命周期时间线：发放 → 绑定 → 废弃 → 重发，reissued_from 溯源链可视化（对齐 task 44 / 64）</text>

  <text class="tn" x="28" y="1020">约束：一码一机（默认禁止一码多机）· 废弃语义 = 立即失效（风险窗口 ≤24h）· 客户端无废弃 / 解绑 / 重置入口 · 非管理员调用 /admin/* → 403 · 口径对齐 task 41（冲突检测）/ 44（API 契约）/ 64（后台交互）</text>
</svg>
