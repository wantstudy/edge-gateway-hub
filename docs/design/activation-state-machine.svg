<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1100" font-family="system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#16a34a"/></marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker>
  </defs>
  <style>
    .h1{font-size:25px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .sl{font-size:14px;font-weight:700;fill:#0f172a}
    .st{font-size:11.5px;font-weight:700}
    .ss{font-size:9.5px}
    .tn{font-size:8.5px;fill:#64748b}
    .tb{font-size:9px;fill:#334155}
    .bd{font-size:10.5px;fill:#475569}
  </style>
  <rect x="0" y="0" width="1560" height="1100" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text class="h1" x="28" y="42">iot-daq 激活流程与生命周期状态机设计图</text>
  <text class="h2" x="28" y="70">设备授权状态机 + 激活码状态机（含换机废弃 / 重发触发者边界）· 对应计划 task 42 · Wave 0 设计基线（2026-09-23 定稿）</text>

  <!-- ===== 图例 ===== -->
  <g transform="translate(1050,14)">
    <rect x="0" y="0" width="490" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#475569">图例</text>
    <line x1="14" y1="34" x2="52" y2="34" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
    <text class="ss" x="60" y="38" fill="#166534">正常推进 / 恢复路径</text>
    <line x1="14" y1="54" x2="52" y2="54" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
    <text class="ss" x="60" y="58" fill="#b91c1c">失败 / 拒绝 / 废弃路径</text>
    <rect x="14" y="66" width="14" height="11" fill="#fef3c7" stroke="#d97706"/>
    <text class="ss" x="60" y="75">试用 / 降级（不停用，可恢复）</text>
    <rect x="250" y="66" width="14" height="11" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="ss" x="272" y="75">过渡 / 终局状态</text>
  </g>

  <!-- ===== 一、设备授权状态机 ===== -->
  <text class="sl" x="28" y="124">一、设备授权状态机（网关本地 licensing 模块维护 · 状态 7 / 迁移 11）</text>

  <rect x="40" y="142" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="st" x="115" y="174" text-anchor="middle" fill="#334155">未激活</text>
  <text class="ss" x="115" y="194" text-anchor="middle" fill="#64748b">首次启动</text>

  <line x1="190" y1="177" x2="231" y2="177" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="235" y="142" width="170" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="st" x="320" y="174" text-anchor="middle" fill="#92400e">试用中 Trial</text>
  <text class="ss" x="320" y="194" text-anchor="middle" fill="#92400e">3 天倒计时 · 全功能</text>

  <line x1="405" y1="177" x2="426" y2="177" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="430" y="142" width="150" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="st" x="505" y="174" text-anchor="middle" fill="#075985">激活中</text>
  <text class="ss" x="505" y="194" text-anchor="middle" fill="#075985">等待服务端响应</text>

  <line x1="580" y1="177" x2="621" y2="177" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <rect x="625" y="142" width="260" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="st" x="755" y="174" text-anchor="middle" fill="#166534">已激活 Active</text>
  <text class="ss" x="755" y="194" text-anchor="middle" fill="#166534">租约有效 · 北向转发中 · 24h 心跳</text>

  <path d="M 740,140 C 740,106 800,106 800,140" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ss" x="770" y="100" text-anchor="middle" fill="#475569">心跳正常（24h）→ 刷新 last_heartbeat</text>

  <path d="M 505,140 C 505,98 115,98 115,140" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="ss" x="310" y="90" text-anchor="middle" fill="#b91c1c">激活失败：码已废 / 机器码不匹配 / 网络失败 → 回未激活（试用倒计时不重置）</text>

  <line x1="690" y1="212" x2="690" y2="326" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ss" x="698" y="252" fill="#475569">心跳失败 / 断网</text>
  <text class="ss" x="698" y="268" fill="#475569">横幅提示 · 可恢复</text>

  <line x1="820" y1="326" x2="820" y2="216" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text class="ss" x="828" y="268" fill="#166534">恢复心跳→Active</text>

  <rect x="625" y="330" width="260" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="st" x="755" y="362" text-anchor="middle" fill="#92400e">宽限期 Gracing</text>
  <text class="ss" x="755" y="382" text-anchor="middle" fill="#92400e">心跳失败 · 离线 ≤7 天 · 北向仍转发</text>

  <rect x="430" y="470" width="260" height="78" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text class="st" x="560" y="498" text-anchor="middle" fill="#9a3412">降级 / 受限 Degraded</text>
  <text class="ss" x="560" y="516" text-anchor="middle" fill="#9a3412">北向停发 · 保留本地采集 + 断点缓存</text>
  <text class="ss" x="560" y="532" text-anchor="middle" fill="#9a3412">横幅告警 · 可自动恢复</text>

  <rect x="720" y="470" width="170" height="78" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="st" x="805" y="494" text-anchor="middle" fill="#b91c1c">停止北向转发</text>
  <text class="tn" x="805" y="512" text-anchor="middle" fill="#b91c1c">被废弃 / 租约耗尽</text>
  <text class="tn" x="805" y="528" text-anchor="middle" fill="#475569">本地采集保留</text>
  <text class="tn" x="805" y="544" text-anchor="middle" fill="#b91c1c">不可自动恢复</text>

  <line x1="660" y1="400" x2="570" y2="466" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="ss" x="672" y="432" fill="#b91c1c">离线 &gt; 7 天</text>
  <text class="ss" x="672" y="448" fill="#475569">守卫：时钟校验（防回拨）</text>

  <polyline points="320,212 320,509 424,509" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrAmber)"/>
  <text class="ss" x="330" y="282" fill="#92400e">试用 3 天到期</text>
  <text class="ss" x="330" y="298" fill="#92400e">→ 降级免费版（不停用）</text>
  <text class="tn" x="330" y="314">（副作用见迁移表第 9 行）</text>

  <line x1="690" y1="509" x2="714" y2="509" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="ss" x="805" y="566" text-anchor="middle" fill="#b91c1c">迁移：租约有效期耗尽 或 被后台废弃（心跳 403）</text>

  <polyline points="730,466 730,442 505,442 505,216" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
  <text class="ss" x="510" y="430" fill="#16a34a">重新激活（后台重发新码）</text>

  <!-- ===== 二、激活码状态机 ===== -->
  <text class="sl" x="928" y="124">二、激活码状态机（服务端 · 迁移触发者标注）</text>

  <rect x="1080" y="142" width="230" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="st" x="1195" y="168" text-anchor="middle" fill="#075985">已发放 Issued</text>
  <text class="ss" x="1195" y="188" text-anchor="middle" fill="#075985">可预绑定机器码发放</text>

  <line x1="1195" y1="206" x2="1195" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ss" x="1320" y="230" fill="#334155">触发者：设备首次激活</text>
  <text class="ss" x="1320" y="246" fill="#64748b">（服务端执行 1:1 绑定）</text>

  <rect x="1080" y="264" width="230" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="st" x="1195" y="290" text-anchor="middle" fill="#166534">已绑定 Bound</text>
  <text class="ss" x="1195" y="310" text-anchor="middle" fill="#166534">绑定机器码指纹（1:1）</text>

  <line x1="1195" y1="328" x2="1195" y2="382" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text class="ss" x="1320" y="352" fill="#b91c1c" font-weight="700">触发者：仅总管理后台（废弃）</text>
  <text class="ss" x="1320" y="368" fill="#b91c1c">二次确认 · 原因必填 · 输入后 8 位</text>

  <rect x="1080" y="386" width="230" height="64" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="st" x="1195" y="412" text-anchor="middle" fill="#b91c1c">已废弃 Revoked</text>
  <text class="ss" x="1195" y="432" text-anchor="middle" fill="#b91c1c">原设备租约立即失效</text>

  <line x1="1195" y1="450" x2="1195" y2="504" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="ss" x="1320" y="474" fill="#334155">触发者：仅总管理后台（重发）</text>
  <text class="ss" x="1320" y="490" fill="#64748b">新码 · 溯源 · tier/有效期可选</text>

  <rect x="1080" y="508" width="230" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="st" x="1195" y="534" text-anchor="middle" fill="#334155">已重发 Reissued</text>
  <text class="ss" x="1195" y="554" text-anchor="middle" fill="#64748b">新码重新走 issued→bound</text>

  <rect x="920" y="600" width="620" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text class="bd" x="936" y="622" fill="#b91c1c" font-weight="700">触发者边界（Must NOT Have 对齐）</text>
  <text class="ss" x="936" y="642">· 废弃 / 重发只能由总管理后台经云端 /admin/* API 执行</text>
  <text class="ss" x="936" y="658">· 客户端无任何废弃 / 解绑 / 重置试用入口（前端可点元素扫描为零）</text>
  <text class="ss" x="936" y="674">· 契约层：非管理员角色调用废弃 / 重发 → 403（对齐 task 44）</text>

  <!-- ===== 设备授权迁移表 ===== -->
  <text class="bd" x="28" y="620" font-weight="700" font-size="12.5">设备授权状态机 · 迁移表（触发事件 / 守卫条件 / 可观测副作用）</text>
  <text class="tb" x="28" y="642" font-weight="700">迁移</text>
  <text class="tb" x="238" y="642" font-weight="700">触发事件</text>
  <text class="tb" x="478" y="642" font-weight="700">守卫条件</text>
  <text class="tb" x="638" y="642" font-weight="700">可观测副作用</text>
  <line x1="24" y1="648" x2="888" y2="648" stroke="#cbd5e1"/>

  <rect x="24" y="654" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="667">未激活 → 试用中</text>
  <text class="tb" x="238" y="667">首次启动</text>
  <text class="tb" x="478" y="667">—</text>
  <text class="tb" x="638" y="667">试用 3 天倒计时开始（云端首激时间兜底）</text>

  <text class="tb" x="28" y="686">试用中 → 激活中</text>
  <text class="tb" x="238" y="686">用户提交激活码</text>
  <text class="tb" x="478" y="686">必须联网（无离线激活）</text>
  <text class="tb" x="638" y="686">请求：指纹+锚点哈希+激活码+公钥+nonce</text>

  <rect x="24" y="692" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="705">激活中 → 已激活</text>
  <text class="tb" x="238" y="705">服务端绑定并签发 Token</text>
  <text class="tb" x="478" y="705">本地验签通过（Ed25519）</text>
  <text class="tb" x="638" y="705">解锁北向转发 · 横幅消失 · 凭证落盘</text>

  <text class="tb" x="28" y="724" fill="#b91c1c">激活中 → 未激活</text>
  <text class="tb" x="238" y="724">激活被拒（码已废/异机/网络）</text>
  <text class="tb" x="478" y="724">服务端 4xx / 超时</text>
  <text class="tb" x="638" y="724">回未激活 · 提示原因 · 试用不重置</text>

  <rect x="24" y="730" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="743">已激活 → 已激活</text>
  <text class="tb" x="238" y="743">24h 心跳成功</text>
  <text class="tb" x="478" y="743">—</text>
  <text class="tb" x="638" y="743">刷新 last_heartbeat · B 档附审计回执</text>

  <text class="tb" x="28" y="762">已激活 → 宽限期</text>
  <text class="tb" x="238" y="762">心跳失败 / 断网</text>
  <text class="tb" x="478" y="762">离线 ≤7 天</text>
  <text class="tb" x="638" y="762">全局横幅提示 · 北向仍转发</text>

  <rect x="24" y="768" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="781" fill="#166534">宽限期 → 已激活</text>
  <text class="tb" x="238" y="781">恢复心跳</text>
  <text class="tb" x="478" y="781">时钟校验通过</text>
  <text class="tb" x="638" y="781">横幅消失 · 恢复正常转发</text>

  <text class="tb" x="28" y="800">宽限期 → 降级/受限</text>
  <text class="tb" x="238" y="800">持续离线 &gt; 7 天</text>
  <text class="tb" x="478" y="800">时钟校验（防回拨延长）</text>
  <text class="tb" x="638" y="800">停北向转发 · 保留本地采集+缓存</text>

  <rect x="24" y="806" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="819" fill="#92400e">试用中 → 降级免费版</text>
  <text class="tb" x="238" y="819">试用 3 天到期</text>
  <text class="tb" x="478" y="819">—</text>
  <text class="tb" x="638" y="819">仅 Modbus·8 设备·≥1s·无北向·无 OTA</text>

  <text class="tb" x="28" y="838" fill="#b91c1c">降级/受限 → 停北向转发</text>
  <text class="tb" x="238" y="838">租约耗尽 / 被后台废弃</text>
  <text class="tb" x="478" y="838">心跳 403</text>
  <text class="tb" x="638" y="838">不可自动恢复 · 采集保留 · 审计留痕</text>

  <rect x="24" y="844" width="864" height="18" fill="#f8fafc"/>
  <text class="tb" x="28" y="857" fill="#166534">停止北向转发 → 激活中</text>
  <text class="tb" x="238" y="857">用户重新激活（新码）</text>
  <text class="tb" x="478" y="857">持厂商重发的新码</text>
  <text class="tb" x="638" y="857">走激活流程 · 成功回 Active</text>

  <line x1="24" y1="868" x2="888" y2="868" stroke="#cbd5e1"/>

  <!-- ===== 失败路径 ===== -->
  <rect x="920" y="700" width="620" height="150" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text class="bd" x="936" y="722" fill="#b91c1c" font-weight="700">✗ 失败路径（≥4 条，红色系）</text>
  <text class="ss" x="936" y="746">① 激活码已废（Revoked）→ 激活被拒，停留未激活 / 试用，提示申请换机</text>
  <text class="ss" x="936" y="770">② 机器码不匹配（同码异机）→ 403 CODE_BOUND_TO_OTHER_DEVICE，引导后台换机</text>
  <text class="ss" x="936" y="794">③ 服务器不可达 → 宽限 ≤7 天（北向继续）；超期 → 降级：停北向转发、保留采集</text>
  <text class="ss" x="936" y="818">④ 时钟异常（回拨）→ 判异常：不延长宽限与试用；单调钟 + 服务端时间比对；记审计</text>
  <text class="tn" x="936" y="840">所有失败路径均写审计日志；客户端不缓存「是否同机 / 是否有效」的服务端结论</text>

  <!-- ===== 底部决议区 ===== -->
  <rect x="20" y="940" width="740" height="118" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text class="bd" x="36" y="962" fill="#92400e" font-weight="700">试用 → 降级衔接（降级而非停用）</text>
  <text class="ss" x="36" y="984">· 试用 3 天到期 → 自动转降级免费版：仅 Modbus 协议 · 最多 8 设备 · 采样间隔 ≥1s · 无北向转发 · 无 OTA</text>
  <text class="ss" x="36" y="1002">· 本地采集持续（数据留在本地可导出），不因试用到期停机</text>
  <text class="ss" x="36" y="1020">· 激活正式码后恢复 Active 与完整功能；试用倒计时以云端首次激活时间为准，重装不重置</text>
  <text class="ss" x="36" y="1038">· 客户端授权页呈现试用倒计时与恢复路径（横幅文案见 ui-gateway-console.md）</text>

  <rect x="780" y="940" width="760" height="118" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text class="bd" x="796" y="962" fill="#b91c1c" font-weight="700">废弃语义决议：立即失效（非到期失效）</text>
  <text class="ss" x="796" y="984">· 后台确认废弃 → 服务端即时置 Revoked 并作废原租约 → 原设备最迟下一次心跳（≤24h）被拒</text>
  <text class="ss" x="796" y="1002">· 被拒后进入降级 / 停止北向转发（本地采集保留），全局横幅提示联系厂商</text>
  <text class="ss" x="796" y="1020">· 理由：换机 / 风控场景需把越权使用风险窗口压到 ≤24h；到期失效将留下「剩余整个有效期」的窗口</text>
  <text class="ss" x="796" y="1038">· 全程审计留痕；废弃与重发可在后台合并执行（换机工单 ≤3 次点击，见 ui-admin-console.md）</text>

  <text class="tn" x="28" y="1086">口径对齐：task 40（信任流 ①-⑨ 与本状态机一致）· task 41（同码异机拒绝 / N-of-M）· task 44（/activation /heartbeat /admin/codes/* 契约与 403）· task 46/47（实现）</text>
</svg>
