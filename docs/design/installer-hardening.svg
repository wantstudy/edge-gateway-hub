<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1100" font-family="system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
  </defs>
  <style>
    .h1{font-size:25px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .ct{font-size:11.5px;font-weight:700;fill:#1e293b}
    .cd{font-size:9.5px;fill:#475569}
    .rf{font-size:8.5px;fill:#b91c1c}
    .sl{font-size:13px;font-weight:700;fill:#0f172a}
    .bd{font-size:10.5px;fill:#475569}
    .tn{font-size:8.5px;fill:#64748b}
  </style>
  <rect x="0" y="0" width="1560" height="1100" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text class="h1" x="28" y="42">iot-daq 安装程序防破解设计图：安装与启动安全链路</text>
  <text class="h2" x="28" y="70">分发 → 签名校验 → 安装 → 首次启动 → 运行时自检 → 授权判定（Rust 侧）· 对应计划 task 43 · Wave 0 设计基线（2026-09-23 定稿）</text>

  <!-- ===== 图例 ===== -->
  <g transform="translate(1050,14)">
    <rect x="0" y="0" width="490" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="14" y="18" width="14" height="11" fill="#fef2f2" stroke="#dc2626"/>
    <text class="cd" x="34" y="27" fill="#b91c1c">校验失败 / 不做项</text>
    <rect x="180" y="18" width="14" height="11" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cd" x="200" y="27" fill="#166534">Tier-1 必做 / 通过</text>
    <rect x="340" y="18" width="14" height="11" fill="#fffbeb" stroke="#d97706"/>
    <text class="cd" x="360" y="27" fill="#92400e">专项框（试用 / 时钟 / 容器）</text>
  </g>

  <!-- ===== 六环节安全链路 ===== -->
  <!-- 环节 1 -->
  <rect x="28" y="110" width="230" height="300" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="50" cy="134" r="10" fill="#334155"/>
  <text x="50" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text class="ct" x="68" y="139">分发 / 下载</text>
  <line x1="40" y1="154" x2="246" y2="154" stroke="#e2e8f0"/>
  <text class="cd" x="40" y="176">· 仅官方渠道 / HTTPS 下发</text>
  <text class="cd" x="40" y="194">· 官网公布安装包哈希</text>
  <text class="cd" x="40" y="212">· 离线现场：tar 哈希清单核对</text>
  <rect x="38" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="48" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="48" y="364">哈希不符 → 停止获取，</text>
  <text class="rf" x="48" y="378">重新下载分发物</text>
  <line x1="258" y1="180" x2="278" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 环节 2 -->
  <rect x="282" y="110" width="230" height="300" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="304" cy="134" r="10" fill="#334155"/>
  <text x="304" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text class="ct" x="322" y="139">安装包签名校验</text>
  <line x1="294" y1="154" x2="500" y2="154" stroke="#e2e8f0"/>
  <text class="cd" x="294" y="176">· Win：OV / EV 证书</text>
  <text class="cd" x="294" y="194">   Authenticode + RFC3161 时间戳</text>
  <text class="cd" x="294" y="212">· NSIS / MSI 签名校验</text>
  <text class="cd" x="294" y="230">· Linux：deb / rpm GPG 与仓库</text>
  <text class="cd" x="294" y="248">· AppImage 包签名</text>
  <rect x="292" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="302" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="302" y="364">签名校验失败 / 无签名</text>
  <text class="rf" x="302" y="378">→ 拒绝安装</text>
  <line x1="512" y1="180" x2="532" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 环节 3 -->
  <rect x="536" y="110" width="230" height="300" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="558" cy="134" r="10" fill="#334155"/>
  <text x="558" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text class="ct" x="576" y="139">安装 · payload manifest</text>
  <line x1="548" y1="154" x2="754" y2="154" stroke="#e2e8f0"/>
  <text class="cd" x="548" y="176">· 包内 payload 哈希清单</text>
  <text class="cd" x="548" y="194">· 安装器逐文件校验</text>
  <text class="cd" x="548" y="212">· 与 task 50 实现边界对齐</text>
  <text class="cd" x="548" y="230">   （安装器只装，不二次加密）</text>
  <rect x="546" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="556" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="556" y="364">任一哈希不符 → 中止安装</text>
  <text class="rf" x="556" y="378">并清理半成品</text>
  <line x1="766" y1="180" x2="786" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 环节 4 -->
  <rect x="790" y="110" width="230" height="300" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="812" cy="134" r="10" fill="#334155"/>
  <text x="812" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text class="ct" x="830" y="139">首次启动</text>
  <line x1="802" y1="154" x2="1008" y2="154" stroke="#e2e8f0"/>
  <text class="cd" x="802" y="176">· 前端资源完整性清单校验</text>
  <text class="cd" x="802" y="194">   （Rust 启动时执行）</text>
  <text class="cd" x="802" y="212">· 试用标记四重冗余初始化</text>
  <text class="cd" x="802" y="230">· 机器码指纹首次计算</text>
  <rect x="800" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="810" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="810" y="364">资源哈希不符 → 受限模式</text>
  <text class="rf" x="810" y="378">（停北向 + 审计告警）</text>
  <line x1="1020" y1="180" x2="1040" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 环节 5 -->
  <rect x="1044" y="110" width="230" height="300" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="1066" cy="134" r="10" fill="#334155"/>
  <text x="1066" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text class="ct" x="1084" y="139">运行时完整性自检</text>
  <line x1="1056" y1="154" x2="1262" y2="154" stroke="#e2e8f0"/>
  <text class="cd" x="1056" y="176">· 二进制段哈希 / 签名自检</text>
  <text class="cd" x="1056" y="194">   （启动 + 关键节点 + 周期）</text>
  <text class="cd" x="1056" y="212">· 关键资源哈希比对</text>
  <text class="cd" x="1056" y="230">· 低成本反调试（用户态）</text>
  <rect x="1054" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="1064" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="1064" y="364">篡改 / 调试 → 受限模式：</text>
  <text class="rf" x="1064" y="378">停北向转发 + 审计告警</text>
  <line x1="1274" y1="180" x2="1294" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 环节 6 -->
  <rect x="1298" y="110" width="230" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <circle cx="1320" cy="134" r="10" fill="#16a34a"/>
  <text x="1320" y="138" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text class="ct" x="1338" y="139">授权判定（Rust 侧）</text>
  <line x1="1310" y1="154" x2="1516" y2="154" stroke="#bbf7d0"/>
  <text class="cd" x="1310" y="176">· 本地验签 Lease Token</text>
  <text class="cd" x="1310" y="194">   （Ed25519 内置公钥集+kid）</text>
  <text class="cd" x="1310" y="212">· 租约状态机判定</text>
  <text class="cd" x="1310" y="230">   （Active / 宽限 / 降级）</text>
  <text class="cd" x="1310" y="248">· 判定驱动数据面；JS 只展示</text>
  <rect x="1308" y="330" width="210" height="64" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="1318" y="348" font-weight="700">✗ 失败行为</text>
  <text class="rf" x="1318" y="364">验签失败 / 无有效租约</text>
  <text class="rf" x="1318" y="378">→ 拒绝解锁北向转发</text>

  <!-- ===== 专项 A：试用标记多重冗余 ===== -->
  <text class="sl" x="28" y="452">专项 A · 试用标记多重冗余（四重交叉校验）</text>
  <rect x="28" y="462" width="500" height="300" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="44" y="482" width="225" height="48" rx="6" fill="#fffdf5" stroke="#cbd5e1"/>
  <text class="ct" x="56" y="502" font-size="10.5">① 标记文件</text>
  <text class="tn" x="56" y="518">license/trial/ 目录 · 加密落盘</text>
  <rect x="289" y="482" width="225" height="48" rx="6" fill="#fffdf5" stroke="#cbd5e1"/>
  <text class="ct" x="301" y="502" font-size="10.5">② 注册表 / 配置目录</text>
  <text class="tn" x="301" y="518">Win 注册表 · Linux 独立配置目录</text>
  <rect x="44" y="540" width="225" height="48" rx="6" fill="#fffdf5" stroke="#cbd5e1"/>
  <text class="ct" x="56" y="560" font-size="10.5">③ SQLCipher 库内记录</text>
  <text class="tn" x="56" y="576">随本地库加密存储（task 34）</text>
  <rect x="289" y="540" width="225" height="48" rx="6" fill="#fffdf5" stroke="#cbd5e1"/>
  <text class="ct" x="301" y="560" font-size="10.5">④ 云端首次激活时间</text>
  <text class="tn" x="301" y="576">服务端为准 · 重装不重置</text>
  <text class="cd" x="44" y="614">交叉校验：任一不一致 → 取最早时间，判异常并记审计</text>
  <rect x="44" y="628" width="468" height="118" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="56" y="648" font-weight="700">单点被删兜底推演：</text>
  <text class="rf" x="56" y="666">· 删 ① / ② / ③ 任一 → 其余三处仍在 → 试用不重置</text>
  <text class="rf" x="56" y="682">· 本地全失（全盘格式化）→ 以云端首激时间恢复试用与绑定</text>
  <text class="rf" x="56" y="698">· 换整机 + 全新安装 → 云端识别新设备 → 新试用（与换机路径一致，</text>
  <text class="rf" x="56" y="714">   商业上可接受；同宿主重建容器不重置，见专项 C）</text>
  <text class="rf" x="56" y="736">· 禁止明文 / 可逆弱混淆存储（Must NOT Have）</text>

  <!-- ===== 专项 B：时钟回拨检测 ===== -->
  <text class="sl" x="548" y="452">专项 B · 时钟回拨检测</text>
  <rect x="548" y="462" width="480" height="300" rx="8" fill="#ffffff" stroke="#d97706"/>
  <rect x="564" y="482" width="105" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="ct" x="616" y="504" font-size="10" text-anchor="middle">单调时钟</text>
  <text class="tn" x="616" y="520" text-anchor="middle">进程内不回退</text>
  <line x1="669" y1="510" x2="685" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="687" y="482" width="105" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="ct" x="739" y="504" font-size="10" text-anchor="middle">历史最大时间</text>
  <text class="tn" x="739" y="520" text-anchor="middle">max_seen 多处冗余</text>
  <line x1="792" y1="510" x2="808" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="810" y="482" width="105" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="ct" x="862" y="504" font-size="10" text-anchor="middle">服务端时间比对</text>
  <text class="tn" x="862" y="520" text-anchor="middle">心跳 / 激活响应</text>
  <line x1="915" y1="510" x2="931" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="933" y="482" width="80" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="ct" x="973" y="504" font-size="10" text-anchor="middle" fill="#b91c1c">回拨判定</text>
  <text class="tn" x="973" y="520" text-anchor="middle">异常即拦截</text>
  <rect x="564" y="560" width="448" height="186" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="578" y="582" font-weight="700">回拨异常处置（守卫：状态机迁移需时间校验通过）：</text>
  <text class="rf" x="578" y="604">· 不延长试用期 / 宽限期：到期按 max_seen 计算</text>
  <text class="rf" x="578" y="622">· 判异常并记审计（时间、偏移量）</text>
  <text class="rf" x="578" y="640">· 与服务端时间恢复同步后自动解除</text>
  <text class="rf" x="578" y="662">· 组合残余：断网 + 长期回拨只能靠本地 max_seen 兜底，</text>
  <text class="rf" x="578" y="678">   无法完全检测（自曝项，见 threat-model.md 第 3 行）</text>
  <text class="tn" x="578" y="706">单调时钟：Win = QueryPerformanceCounter / Linux = CLOCK_MONOTONIC；</text>
  <text class="tn" x="578" y="722">max_seen 冗余存放于试用标记的四处冗余中（专项 A），交叉恢复</text>

  <!-- ===== 专项 C：Linux 容器场景 ===== -->
  <text class="sl" x="1048" y="452">专项 C · Linux 容器场景（镜像 = 分发物，task 59）</text>
  <rect x="1048" y="462" width="492" height="300" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="cd" x="1064" y="488">· cosign 签名 + cosign verify（镜像与签名附件）</text>
  <text class="cd" x="1064" y="506">· digest 固定：compose 以 digest 引用，不用可变 tag</text>
  <text class="cd" x="1064" y="524">· 离线 tar 包哈希清单 + 校验脚本（docker load 之前）</text>
  <rect x="1064" y="544" width="460" height="200" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="1078" y="566" font-weight="700">✗ 红线（不可妥协）</text>
  <text class="rf" x="1078" y="588">· 镜像可写层不得承载试用标记 / 租约 / 授权状态</text>
  <text class="rf" x="1078" y="606">· 必须落宿主持久卷 /var/lib/iot-daq（license/ trial/）</text>
  <text class="rf" x="1078" y="630">推演：</text>
  <text class="rf" x="1078" y="650">· 同卷 docker rm 重建 → 试用与租约保持（不重置）</text>
  <text class="rf" x="1078" y="668">· 空卷重建 → 视为新装，但宿主指纹相同 → 云端识别为</text>
  <text class="rf" x="1078" y="684">   同一设备 + 云端首激时间 → 「换容器重置试用」不成立</text>
  <text class="rf" x="1078" y="708">· 镜像内不含敏感物：无私钥 / 激活码 / 宿主指纹 / 默认口令</text>
  <text class="tn" x="1064" y="756">口径与 task 59（宿主锚点 / 持久卷 / 供应链）完全一致</text>

  <!-- ===== Tier 定案 ===== -->
  <text class="sl" x="28" y="796">防破解力度定案（Tier 分级 · 预算 控制面 : 客户端 = 7 : 3）</text>
  <rect x="28" y="806" width="760" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="ct" x="44" y="828" fill="#166534">Tier-1 必做（提高成本基线）</text>
  <text class="cd" x="44" y="850">· 全平台代码签名 · strip / LTO / panic=abort 构建硬化</text>
  <text class="cd" x="44" y="868">· 字符串与常量混淆 · 段哈希完整性自检（SHA-256 段清单）</text>
  <text class="cd" x="44" y="886">· 低成本反调试（用户态；拒内核驱动与 rootkit 级手段）</text>
  <text class="tn" x="44" y="912">构建参数可执行：strip = true · lto = "fat" · panic = "abort" · 段哈希 = SHA-256</text>
  <rect x="808" y="806" width="350" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="ct" x="824" y="828" fill="#334155">Tier-2 暂不做</text>
  <text class="cd" x="824" y="850">· 控制流平坦化 · 字符串加密</text>
  <text class="cd" x="824" y="868">· 模块交叉校验 · Frida 检测</text>
  <text class="tn" x="824" y="896">理由：收益 / 成本比低，维护负担重，</text>
  <text class="tn" x="824" y="912">待 Tier-1 数据评估后再议</text>
  <rect x="1178" y="806" width="362" height="130" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text class="ct" x="1194" y="828" fill="#b91c1c">Tier-3 明确不做（Must NOT）</text>
  <text class="cd" x="1194" y="850">· 内核驱动 · VMProtect / Themida 商业壳</text>
  <text class="cd" x="1194" y="868">· 硬件加密狗</text>
  <text class="tn" x="1194" y="896">理由：Tauri / 杀软冲突、误报率高、</text>
  <text class="tn" x="1194" y="912">维护成本不可接受（与 Must NOT Have 一致）</text>

  <!-- ===== 原则区 ===== -->
  <rect x="28" y="956" width="760" height="96" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="ct" x="44" y="978">定位声明与量化目标</text>
  <text class="cd" x="44" y="998">· 提高成本 ≠ 绝对防破解（残余风险自曝见 threat-model.md）</text>
  <text class="cd" x="44" y="1016">· 量化目标：拦掉 90% 非专业破解尝试；专业破解者付出 &gt; 数人日仍无法获得云端有效授权</text>
  <text class="cd" x="44" y="1034">· 预算分配：控制面（云端 + 后台）: 客户端 = 7 : 3</text>
  <rect x="808" y="956" width="732" height="96" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="ct" x="824" y="978">防逆向 ≠ 防拷机 · 授权判定位置原则</text>
  <text class="cd" x="824" y="998">· 防「拷给第二台机器用」= 机器码绑定 + 一机一码（task 41），不混入二进制加固范畴</text>
  <text class="cd" x="824" y="1016">· 授权与防篡改判定只在 Rust 侧；WebView / JS 只做展示，无判定逻辑</text>
  <text class="cd" x="824" y="1034">· 前端资源等同公开源码（可解包读改）：只做完整性清单哈希校验，机密一律不进前端</text>

  <text class="tn" x="28" y="1082">口径对齐：task 40（受限模式 = 停北向转发 + 审计告警；残余风险自曝）· task 41（机器码绑定）· task 50（payload manifest 实现边界）· task 59（cosign / digest / 持久卷）· Must NOT Have（无内核驱动 / 加密狗 / 明文存储）</text>
