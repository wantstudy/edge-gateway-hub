<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 980" font-family="system-ui,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
  </defs>
  <style>
    .h1{font-size:25px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .zl{font-size:13px;font-weight:700}
    .bt{font-size:12px;font-weight:700;fill:#1e293b}
    .bd{font-size:10px;fill:#475569}
    .sm{font-size:9.5px;fill:#475569}
    .rf{font-size:9.5px;fill:#b91c1c}
    .tn{font-size:8.5px;fill:#64748b}
  </style>
  <rect x="0" y="0" width="1560" height="980" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text class="h1" x="28" y="42">iot-daq 云端授权服务与总管理后台：部署与组件图</text>
  <text class="h2" x="28" y="70">admin-console → licensing-server → 数据库 / 签名私钥隔离区 · A/B/C 三档控制通道 · 对应计划 task 44 · Wave 0 设计基线（2026-09-23 定稿）</text>

  <!-- ===== 客户现场（网关侧） ===== -->
  <rect x="20" y="100" width="380" height="540" rx="10" fill="#fffbeb" fill-opacity="0.65" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="zl" x="36" y="124" fill="#92400e">客户现场（网关侧 · 客户可篡改区）</text>

  <rect x="36" y="140" width="348" height="190" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="48" y="162">iot-daq 网关（设备宿主机）</text>
  <rect x="48" y="174" width="324" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="sm" x="60" y="194" font-weight="700">数据面</text>
  <text class="sm" x="60" y="210">· 南向采集：Modbus / OPC UA / PLC</text>
  <text class="sm" x="60" y="226">· 北向转发 → 客户 Broker（B 档不经厂商）</text>
  <rect x="48" y="252" width="324" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text class="sm" x="60" y="272" font-weight="700" fill="#166534">本地授权模块（Rust · 判定唯一权威）</text>
  <text class="sm" x="60" y="288">· 机器码指纹 · Lease Token 本地验签 · 租约状态机</text>
  <text class="sm" x="60" y="304">· 24h 心跳调度 + 审计回执缓存（断网延迟补报）</text>

  <rect x="36" y="348" width="348" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="bt" x="48" y="370" font-size="11">客户 Broker（北向出口）</text>
  <text class="sm" x="48" y="388">· 业务数据出口；到厂商云仅控制通道（心跳 / 回执）</text>
  <text class="sm" x="48" y="404">· B 档断网时网关仍持续转发，回执允许延迟补报</text>

  <rect x="36" y="428" width="348" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text class="rf" x="48" y="450" font-weight="700">✗ 客户端权限边界（红线）</text>
  <text class="rf" x="48" y="468">· 无解绑 / 废弃 / 重置试用入口；数据模型无此接口</text>
  <text class="rf" x="48" y="484">· 无档位切换入口（档位随 Lease Token 下发，后台配置）</text>
  <text class="rf" x="48" y="500">· 调用 /admin/* → 403（仅厂商管理员）</text>

  <rect x="36" y="532" width="348" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="bt" x="48" y="554" font-size="11">部署形态（device 记录，供运维溯源）</text>
  <text class="sm" x="48" y="574">· native：systemd 服务（keyring 保护凭证）</text>
  <text class="sm" x="48" y="590">· docker：宿主锚点只读挂载 + 持久卷 /var/lib/iot-daq（task 59）</text>
  <text class="sm" x="48" y="606">· 容器重建 / 升级 → 不产生新 device 记录、不触发换机重发</text>

  <!-- ===== 网关 → 云端 四条控制通道 ===== -->
  <line x1="400" y1="180" x2="524" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="463" y="166" text-anchor="middle" font-weight="700">① 激活</text>
  <text class="tn" x="463" y="196" text-anchor="middle">绑定 + Token 签发</text>

  <line x1="400" y1="242" x2="524" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="463" y="228" text-anchor="middle" font-weight="700">② 心跳（24h）</text>
  <text class="tn" x="463" y="258" text-anchor="middle">携带审计序号区间</text>

  <line x1="400" y1="304" x2="524" y2="304" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="463" y="290" text-anchor="middle" font-weight="700">③ /verify</text>
  <text class="tn" x="463" y="320" text-anchor="middle">A 档 Token / 消息校验</text>

  <line x1="400" y1="366" x2="524" y2="366" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="463" y="352" text-anchor="middle" font-weight="700">④ /audit/receipt</text>
  <text class="tn" x="463" y="382" text-anchor="middle">B 档审计回执</text>

  <!-- ===== 厂商可控区 ===== -->
  <rect x="530" y="100" width="1010" height="540" rx="10" fill="#eff6ff" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="zl" x="546" y="124" fill="#1e40af">厂商可控区（厂商云）</text>

  <rect x="530" y="150" width="680" height="240" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="546" y="174">licensing-server（云端授权服务 · 唯一 API 入口）</text>
  <text class="bd" x="546" y="198">· POST /activation —— 激活 + 绑定（一机一码冲突检测，task 41）</text>
  <text class="bd" x="546" y="218">· POST /heartbeat —— 24h 心跳；携带最近审计回执序号区间</text>
  <text class="bd" x="546" y="238">· POST /verify —— A 档全链：验签 + ±5min 时间窗 + 全局 Nonce + 白名单 + 计量</text>
  <text class="bd" x="546" y="258">· POST /audit/receipt —— B 档回执：字段白名单 {device_mid, lease_id,</text>
  <text class="bd" x="546" y="276">     seq_from, seq_to, count, payload_digest, ts, sig}；拒收任何业务字段</text>
  <text class="bd" x="546" y="296">· /admin/*（issue / revoke / reissue / codes / devices）—— 仅厂商管理员（RBAC）</text>
  <text class="sm" x="546" y="326">云端检测：序号跳空 / 回退 / 回执缺失 → 风控告警（人工核实，不自动封禁）</text>
  <text class="sm" x="546" y="344">鉴权边界：设备端 = Lease Token + 设备签名；管理端 = RBAC 会话；全量操作审计</text>
  <text class="sm" x="546" y="362">A/B/C 档位随 Lease Token 下发（verify_mode）；B 档默认</text>

  <rect x="1250" y="150" width="270" height="240" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="bt" x="1266" y="174" fill="#b91c1c">签名私钥保管（隔离区）</text>
  <text class="sm" x="1266" y="198">· Ed25519 签名私钥</text>
  <text class="sm" x="1266" y="216">· KMS / 离线托管</text>
  <text class="sm" x="1266" y="234">· 独立签名服务：仅接受</text>
  <text class="sm" x="1266" y="250">   签名请求，私钥不出隔离区</text>
  <text class="sm" x="1266" y="268">· kid 多密钥并存与轮换：</text>
  <text class="sm" x="1266" y="284">   新旧并存 → 旧客户端仍可验签</text>
  <text class="rf" x="1266" y="312" font-weight="700">✗ 私钥不与业务 API</text>
  <text class="rf" x="1266" y="328" font-weight="700">   同一可写位置（红线）</text>
  <text class="tn" x="1266" y="356">客户端内置公钥集（非单钥），</text>
  <text class="tn" x="1266" y="372">轮换无需重发所有客户端</text>

  <rect x="530" y="440" width="420" height="180" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="546" y="464">admin-console（厂商总管理后台）</text>
  <text class="sm" x="546" y="488">· 激活码：发放 / 筛选 / 详情 / 导出（生命周期时间线）</text>
  <text class="sm" x="546" y="506">· 废弃：二次确认 + 原因必填 + 输入后 8 位（最危险操作）</text>
  <text class="sm" x="546" y="524">· 重发：预绑定 / 留待绑定 · reissued_from 溯源 · 幂等</text>
  <text class="sm" x="546" y="542">· 设备 / 租户列表 · 回执异常页（异常 ≠ 破解，转人工核实）</text>
  <text class="sm" x="546" y="560">· 审计日志页 · RBAC：运营 / 授权运营 / 风控 / 系统</text>
  <text class="sm" x="546" y="578">· 换机工单：废弃 + 重发合并执行（≤3 次点击）</text>
  <text class="tn" x="546" y="602">前端不持私钥、不直连授权数据库（仅经管理 API）</text>

  <rect x="990" y="440" width="530" height="180" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="1006" y="464">授权数据库</text>
  <text class="sm" x="1006" y="488">· tenant · device（部署形态 native / docker + 镜像 digest）</text>
  <text class="sm" x="1006" y="506">· activation_code（issued / bound / revoked / reissued）· lease</text>
  <text class="sm" x="1006" y="524">· heartbeat · audit_receipt（B 档回执与跳空判定）</text>
  <text class="sm" x="1006" y="542">· nonce_cache（防重放）· signing_key（kid）· audit_log</text>
  <text class="sm" x="1006" y="566">· audit_log 入口：后台全量操作 + 网关心跳 / 回执 + 风控告警</text>
  <text class="tn" x="1006" y="596">ER 详见 licensing-data-model.md（9 表）；字段级契约见 licensing-api.md（下一轮）</text>

  <line x1="640" y1="436" x2="640" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="650" y="412">管理 API · RBAC 鉴权边界 · 全量审计</text>
  <line x1="1250" y1="390" x2="1250" y2="436" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="sm" x="1260" y="416">读写</text>
  <line x1="1214" y1="260" x2="1246" y2="260" stroke="#475569" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="tn" x="1230" y="286" text-anchor="middle">签名请求 / 结果</text>

  <!-- ===== A/B/C 三档 ===== -->
  <text class="zl" x="28" y="676" font-size="13">A/B/C 三档控制通道（档位 = 租户级 / 设备级配置，随 Lease Token 下发；后台可切换，客户端无档位入口）</text>

  <rect x="28" y="686" width="480" height="140" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="44" y="710">A 档 · 数据经厂商云</text>
  <text class="sm" x="44" y="732">· /verify 全链：验签 + ±5min 时间窗 + 全局 Nonce + 白名单 + 计量</text>
  <text class="sm" x="44" y="752">· 厂商能验证：消息级真实性 / 计量</text>
  <text class="rf" x="44" y="772">· 验证不了：客户端代码级绕过本地判定</text>
  <text class="tn" x="44" y="806">校验点最多；适合接受业务数据出网的客户</text>

  <rect x="528" y="686" width="500" height="140" rx="8" fill="#fffbeb" fill-opacity="0.6" stroke="#b45309" stroke-width="2"/>
  <rect x="930" y="696" width="60" height="20" rx="10" fill="#b45309"/>
  <text x="960" y="710" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">默认档</text>
  <text class="bt" x="544" y="710" fill="#92400e">B 档（默认）· 业务数据不经厂商</text>
  <text class="sm" x="544" y="732">· 控制通道仅两条：24h 心跳 + POST /audit/receipt（字段白名单）</text>
  <text class="sm" x="544" y="752">· 断网时网关仍持续转发；回执允许延迟补报（序号连续）</text>
  <text class="sm" x="544" y="772">· 云端检测：序号跳空 / 回退 / 回执缺失 → 风控告警（人工核实）</text>
  <text class="rf" x="544" y="792">· 验证不了：业务数值真伪 / 回执被破解代码抑制（自曝项）</text>
  <text class="tn" x="544" y="814">网关侧校验：Lease Token 本地验签 + 租约状态机（task 40/42）</text>

  <rect x="1048" y="686" width="492" height="140" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text class="bt" x="1064" y="710">C 档 · 仅租约心跳</text>
  <text class="sm" x="1064" y="732">· 仅 24h 租约心跳出网</text>
  <text class="sm" x="1064" y="752">· 厂商能验证：设备存活与租约有效</text>
  <text class="rf" x="1064" y="772">· 验证不了：任何业务侧信息（无回执、无计量）</text>
  <text class="tn" x="1064" y="806">适合对出网最敏感的客户；降级兜底同 B 档状态机</text>

  <!-- ===== 设计红线 ===== -->
  <rect x="28" y="846" width="1512" height="66" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text class="rf" x="44" y="868" font-weight="700">设计红线：</text>
  <text class="rf" x="44" y="888">① 废弃 / 重发仅厂商管理员经后台执行（客户端无解绑入口，数据模型无此接口，调用 /admin/* → 403）　② B 档断网仍持续转发 + 回执延迟补报 + 序号跳空 / 回退 / 缺失告警　③ 签名私钥隔离（KMS / 离线，与业务 API 不同可写位置）　④ 不写实现代码（本图为 Wave 6 任务 45-48 的设计基线）</text>

  <text class="tn" x="28" y="946">口径对齐：task 40（信任边界与档位定义）· task 41（一机一码冲突检测）· task 42（废弃 / 重发语义与状态机）· task 59（容器形态 device 记录）· task 64（后台交互线框）</text>
</svg>
