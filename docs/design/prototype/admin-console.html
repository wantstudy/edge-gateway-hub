<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoT-DAQ 授权管理后台 · 界面原型</title>
<style>
:root{
  --brand:#1F6FEB;--brand-hover:#3B82F6;--brand-subtle:#E8F1FE;
  --text-1:#1D2129;--text-2:#4E5969;--text-3:#86909C;
  --border:#E5E6EB;--divider:#F2F3F5;--bg-app:#F7F8FA;--bg-card:#FFF;--bg-hover:#F7F8FA;
  --ok:#00A870;--warn:#FF7D00;--danger:#F53F3F;--info:#1F6FEB;--unknown:#86909C;
  --ok-bg:#E8FFEA;--warn-bg:#FFF7E8;--danger-bg:#FFECE8;--info-bg:#E8F1FE;--unknown-bg:#F2F3F5;
  --radius:8px;--radius-sm:4px;--shadow:0 4px 16px rgba(29,33,41,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6;color:var(--text-1);background:var(--bg-app);-webkit-font-smoothing:antialiased}
.mono,.kpi-val,td.mono{font-family:"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg-card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:6px;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.spacer{flex:1}
.topbar .mini{font-size:12px;color:var(--text-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.pill.warn{background:var(--warn-bg);color:#8A4B00;border-color:#FFE0B2}
.pill.ok{background:var(--ok-bg);color:#0A6B47;border-color:#B5F0CE}
.pill.plain{background:#fff;color:var(--text-2);border-color:var(--border)}
.avatar{width:30px;height:30px;border-radius:50%;background:#F3E8FF;color:#7C3AED;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.body{display:flex;flex:1;min-height:0}
.sidebar{width:236px;flex:0 0 236px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.nav-group-title{padding:14px 16px 6px;font-size:11px;letter-spacing:.08em;color:var(--text-3)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;color:var(--text-2);font-size:13px;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.on{background:var(--brand-subtle);color:var(--brand);border-left-color:var(--brand);font-weight:600}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:16px}
.nav-item .badge.warn{background:var(--warn)}
.sidebar-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--divider);font-size:11px;color:var(--text-3);line-height:1.7}
.main{flex:1;min-width:0;overflow-y:auto;padding-bottom:40px}
.page-head{background:var(--bg-card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:flex-start;gap:16px}
.page-head h1{margin:0;font-size:20px;font-weight:600}
.page-head .desc{margin:4px 0 0;font-size:12px;color:var(--text-3);max-width:900px}
.page-head .ops{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.content{padding:16px 24px;display:flex;flex-direction:column;gap:16px;max-width:1560px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border:1px solid;font-size:13px}
.banner.warn{background:var(--warn-bg);border-color:#FFE0B2;color:#6B3B00}
.banner.danger{background:var(--danger-bg);border-color:#FFCDC5;color:#7A1418}
.banner.info{background:var(--info-bg);border-color:#C6DDFB;color:#123C86}
.banner.ok{background:var(--ok-bg);border-color:#B5F0CE;color:#0A5C3D}
.banner .bops{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;align-items:center}
.btn{font-family:inherit;font-size:13px;padding:6px 14px;min-height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;color:var(--text-1);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C9CDD4;background:var(--bg-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 10px;min-height:26px;font-size:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--divider)}
.card-head h3{margin:0;font-size:15px;font-weight:600}
.card-head .sub{font-size:12px;color:var(--text-3)}
.card-head .ops{margin-left:auto;display:flex;gap:8px}
.card-body{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1280px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr}}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .lbl{font-size:12px;color:var(--text-3)}
.kpi-val{font-size:26px;font-weight:600;line-height:1.3;display:flex;align-items:baseline;gap:4px}
.kpi-val .unit{font-size:12px;font-weight:400;color:var(--text-3)}
.kpi .sub{font-size:12px;color:var(--text-3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--text-2);background:#FAFBFC;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid var(--divider)}
tbody tr:hover{background:var(--bg-hover)}
tbody tr:last-child td{border-bottom:0}
td.right,th.right{text-align:right}
.row-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.row-danger td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:18px;border:1px solid}
.tag.ok{background:var(--ok-bg);color:#0A6B47;border-color:#B5F0CE}
.tag.warn{background:var(--warn-bg);color:#8A4B00;border-color:#FFE0B2}
.tag.danger{background:var(--danger-bg);color:#A8171B;border-color:#FFCDC5}
.tag.info{background:var(--info-bg);color:#12489C;border-color:#C6DDFB}
.tag.unknown{background:var(--unknown-bg);color:#5A6069;border-color:var(--border)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13px;margin:0}
.kv dt{color:var(--text-3);font-size:12px}
.kv dd{margin:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--text-2)}
.fld .req{color:var(--danger)}
.fld .hint{font-size:11px;color:var(--text-3);line-height:1.5}
.fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:13px;color:var(--text-1);background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;min-height:32px}
.radio-row{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer}
.radio.on{border-color:var(--brand);background:var(--brand-subtle)}
.rdo{width:14px;height:14px;border-radius:50%;border:1px solid #C9CDD4;flex:0 0 14px;margin-top:3px;background:#fff}
.radio.on .rdo{border-color:var(--brand);border-width:4px}
.radio .rt{font-size:13px;font-weight:500}
.radio .rd{font-size:12px;color:var(--text-3)}
.switch{width:34px;height:18px;border-radius:999px;background:#C9CDD4;position:relative;flex:0 0 34px}
.switch.on{background:var(--brand)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.switch.on::after{left:18px}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--border)}
.tl-item.ok::before{border-color:var(--ok);background:var(--ok)}
.tl-item.warn::before{border-color:var(--warn)}.tl-item.danger::before{border-color:var(--danger)}
.tl-t{font-size:12px;color:var(--text-3);font-family:Consolas,monospace}
.tl-h{font-size:13px;font-weight:600}
.tl-d{font-size:12px;color:var(--text-2)}
.bar-track{height:8px;border-radius:999px;background:var(--divider);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--brand)}
.bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}.bar-fill.danger{background:var(--danger)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--divider)}
.list-item:last-child{border-bottom:0}
.li-h{font-size:13px;font-weight:600}.li-d{font-size:12px;color:var(--text-3)}
.li-ops{margin-left:auto;display:flex;gap:8px}
.note{font-size:12px;color:var(--text-3);line-height:1.6;display:flex;gap:8px}
.note .ni{color:var(--info)}
.coverage{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.cov{height:22px;border-radius:3px;background:var(--ok-bg);border:1px solid #B5F0CE}
.cov.gap{background:var(--danger-bg);border-color:#FFCDC5}
.cov.miss{background:var(--unknown-bg);border-color:var(--border)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hint-strip{font-size:12px;color:var(--text-3);background:var(--bg-app);border-radius:var(--radius-sm);padding:8px 12px}
.mask{position:fixed;inset:0;background:rgba(29,33,41,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);width:640px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--divider)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--divider);display:flex;justify-content:flex-end;gap:8px}
.impact{background:var(--danger-bg);border:1px solid #FFCDC5;border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:#7A1418}
.impact ul{margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
"use strict";
var state = { page: "ad-overview", role: "admin" };
var ROLE_LABEL = { admin: "管理员 admin", ops: "运营 ops", viewer: "只读 viewer" };

function tag(t, tone){ return '<span class="tag ' + (tone||"unknown") + '">' + t + "</span>"; }
function fmtNum(v){ if(v>=1000) return (v/1000).toFixed(1)+"k"; if(v>=10) return Math.round(v)+""; return (Math.round(v*10)/10)+""; }

function barChart(series, labels, h){
  h = h || 150; var w = 620, p = {l:40,r:12,t:14,b:24};
  var all = []; series.forEach(function(s){ s.data.forEach(function(v){ all.push(v); }); });
  var max = (Math.max.apply(null, all) * 1.15) || 1;
  var iw = w-p.l-p.r, ih = h-p.t-p.b, n = labels.length, gw = iw/n, bw = Math.max(2, gw*0.7/series.length);
  var s = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px" preserveAspectRatio="none">';
  for(var g=0; g<=3; g++){ var y = p.t+ih*g/3;
    s += '<line x1="'+p.l+'" y1="'+y+'" x2="'+(w-p.r)+'" y2="'+y+'" stroke="#F2F3F5"/>';
    s += '<text x="'+(p.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#86909C">'+fmtNum(max*(1-g/3))+'</text>'; }
  labels.forEach(function(lb,i){
    var gx = p.l + i*gw + gw*0.15;
    series.forEach(function(se,si){
      var v = se.data[i]||0, bh = (v/max)*ih;
      var fill = (se.missFlag && se.missFlag[i]) ? "#F53F3F" : se.color;
      s += '<rect x="'+(gx+si*bw).toFixed(1)+'" y="'+(p.t+ih-bh).toFixed(1)+'" width="'+(bw-1).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+fill+'"/>';
    });
    if(i % Math.ceil(n/8) === 0) s += '<text x="'+(p.l+i*gw+gw/2)+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="#86909C">'+lb+'</text>';
  });
  return s + "</svg>";
}

function btn(a){
  var cls = "btn" + (a.kind?" "+a.kind:"") + (a.sm?" sm":"");
  var click = a.modal ? ' onclick=\'openModal(' + JSON.stringify(a.modal) + ')\'' : "";
  return '<button class="'+cls+'"'+(a.disabled?" disabled":"")+click+">"+a.label+"</button>";
}
function renderBlocks(list){ return list.map(renderBlock).join(""); }
function renderBlock(b){
  if(typeof b === "string") return b;
  switch(b.type){
    case "banner":
      return '<div class="banner '+(b.kind||"info")+'"><div><b>'+b.title+'</b>'+(b.text?"<br>"+b.text:"")+'</div>'+
        (b.actions?'<div class="bops">'+b.actions.map(btn).join("")+'</div>':"")+'</div>';
    case "kpis":
      return '<div class="grid g4">'+b.items.map(function(k){
        return '<div class="kpi"><div class="lbl">'+k.label+'</div><div class="kpi-val '+(k.tone||"")+'">'+k.value+
          (k.unit?'<span class="unit">'+k.unit+'</span>':"")+'</div><div class="sub">'+(k.sub||"")+'</div></div>'; }).join("")+'</div>';
    case "grid":
      return '<div class="grid '+(b.cls||"g2")+'">'+b.blocks.map(renderBlock).join("")+'</div>';
    case "card":
      return '<div class="card">'+(b.title?'<div class="card-head"><h3>'+b.title+'</h3>'+
        (b.sub?'<span class="sub">'+b.sub+'</span>':"")+(b.actions?'<div class="ops">'+b.actions.map(btn).join("")+'</div>':"")+'</div>':"")+
        '<div class="card-body">'+b.blocks.map(renderBlock).join("")+'</div></div>';
    case "table":
      return '<div class="tbl-wrap"><table><thead><tr>'+b.columns.map(function(c){
          return '<th class="'+(c.align||"")+'">'+c.label+'</th>'; }).join("")+
        (b.rowActions?'<th class="right">操作</th>':"")+'</tr></thead><tbody>'+
        b.rows.map(function(r){
          return '<tr class="'+(r.cls||"")+'">'+b.columns.map(function(c){
            return '<td class="'+(c.align||"")+(c.mono?" mono":"")+'">'+(r[c.k]===undefined?"":r[c.k])+'</td>'; }).join("")+
            (b.rowActions?'<td class="right">'+(r._ops||"")+'</td>':"")+'</tr>'; }).join("")+
        '</tbody></table>'+(b.foot?'<div style="padding:10px 12px;font-size:12px;color:var(--text-3);border-top:1px solid var(--divider)">'+b.foot+'</div>':"")+'</div>';
    case "fields":
      return '<div class="fields">'+b.items.map(function(f){
        var inner;
        if(f.type==="select") inner = "<select>"+f.options.map(function(o){ return "<option"+(o===f.value?" selected":"")+">"+o+"</option>"; }).join("")+"</select>";
        else if(f.type==="textarea") inner = "<textarea rows='"+(f.rows||3)+"' placeholder='"+(f.placeholder||"")+"'>"+(f.value||"")+"</textarea>";
        else if(f.type==="switch") inner = '<div style="display:flex;align-items:center;gap:8px"><span class="switch'+(f.value?" on":"")+'"></span><span style="font-size:12px;color:var(--text-3)">'+(f.value?"已启用":"已关闭")+'</span></div>';
        else if(f.type==="radio") inner = '<div class="radio-row">'+f.options.map(function(o){
          var on = o.value===f.value;
          return '<div class="radio'+(on?" on":"")+'"><span class="rdo"></span><div><div class="rt">'+o.label+'</div>'+(o.desc?'<div class="rd">'+o.desc+'</div>':"")+'</div></div>'; }).join("")+"</div>";
        else inner = '<input type="text" value="'+(f.value||"")+'" placeholder="'+(f.placeholder||"")+'">';
        return '<div class="fld'+((f.full||f.type==="radio"||f.type==="textarea")?" full":"")+'"><label>'+f.label+(f.req?' <span class="req">*</span>':"")+'</label>'+inner+
          (f.hint?'<div class="hint">'+f.hint+'</div>':"")+'</div>'; }).join("")+"</div>"+
        (b.footer?'<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">'+b.footer.map(btn).join("")+'</div>':"");
    case "kv":
      return '<dl class="kv">'+b.items.map(function(i){ return "<dt>"+i.k+"</dt><dd"+(i.mono?' class="mono"':"")+">"+i.v+"</dd>"; }).join("")+"</dl>";
    case "timeline":
      return '<div class="timeline">'+b.items.map(function(i){
        return '<div class="tl-item '+(i.tone||"")+'"><div class="tl-t">'+i.time+'</div><div class="tl-h">'+i.title+'</div>'+(i.desc?'<div class="tl-d">'+i.desc+'</div>':"")+'</div>'; }).join("")+'</div>';
    case "list":
      return '<div>'+b.items.map(function(i){
        return '<div class="list-item"><div><div class="li-h">'+i.title+'</div>'+(i.desc?'<div class="li-d">'+i.desc+'</div>':"")+'</div>'+
          (i.actions?'<div class="li-ops">'+i.actions.map(btn).join("")+'</div>':"")+'</div>'; }).join("")+'</div>';
    case "progress":
      return '<div style="display:flex;flex-direction:column;gap:12px">'+b.items.map(function(i){
        var pct = Math.min(100, Math.round(i.value/i.max*100));
        var tone = i.tone || (pct>90?"danger":pct>70?"warn":"ok");
        return '<div><div style="display:flex;gap:10px;font-size:12px;margin-bottom:5px"><span style="color:var(--text-2)">'+i.label+'</span>'+
          '<span style="margin-left:auto;color:var(--text-3)">'+i.note+'</span></div><div class="bar-track"><div class="bar-fill '+tone+'" style="width:'+pct+'%"></div></div></div>'; }).join("")+'</div>';
    case "coverage":
      var cells = "";
      for(var i=0;i<b.total;i++){
        var k = b.gaps.indexOf(i+1)>=0 ? " gap" : ((b.missing && b.missing.indexOf(i+1)>=0) ? " miss" : "");
        cells += '<div class="cov'+k+'" title="区间 #'+(i+1)+'"></div>';
      }
      return '<div>'+(b.title?'<div style="font-size:13px;font-weight:600;margin-bottom:8px">'+b.title+'</div>':"")+
        '<div class="coverage">'+cells+'</div>'+
        '<div class="legend" style="margin-top:10px"><span><i style="background:#E8FFEA;border:1px solid #B5F0CE"></i>回执正常</span>'+
        '<span><i style="background:#FFECE8;border:1px solid #FFCDC5"></i>序号跳空</span>'+
        '<span><i style="background:#F2F3F5;border:1px solid var(--border)"></i>缺失</span></div>'+
        (b.note?'<div class="note" style="margin-top:10px"><span class="ni">ⓘ</span><div>'+b.note+'</div></div>':"")+'</div>';
    case "note":
      return '<div class="note"><span class="ni">ⓘ</span><div>'+b.text+'</div></div>';
    case "hint":
      return '<div class="hint-strip">'+b.text+'</div>';
    case "impact":
      return '<div class="impact">'+b.text+'</div>';
    case "chart":
      return '<div>'+(b.title?'<div style="font-size:13px;font-weight:600;margin-bottom:8px">'+b.title+'</div>':"")+
        barChart(b.series,b.labels,b.h)+
        '<div class="legend" style="margin-top:8px">'+b.series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>'; }).join("")+'</div></div>';
    default: return "";
  }
}
function openModal(spec){
  document.getElementById("modal-root").innerHTML =
    '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<div class="modal-head"><h3>'+(spec.danger?"⚠ ":"")+spec.title+'</h3></div>'+
    '<div class="modal-body">'+renderBlocks(spec.blocks)+'</div>'+
    '<div class="modal-foot">'+(spec.cancel===false?"":'<button class="btn" onclick="closeModal()">'+(spec.cancelLabel||"取消")+'</button>')+
    '<button class="btn '+(spec.danger?"danger":"primary")+'" onclick="closeModal()">'+spec.confirm+'</button></div></div></div>';
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
function setRole(r){ state.role = r; if(!PAGES[state.page] || PAGES[state.page].roles.indexOf(r)<0) state.page = firstAllowed(r); render(); }
function go(p){ state.page = p; closeModal(); render(); }
function firstAllowed(r){
  var ids = Object.keys(PAGES);
  for(var i=0;i<ids.length;i++){ if(PAGES[ids[i]].roles.indexOf(r)>=0) return ids[i]; }
  return ids[0];
}

var GROUPS = [];
function render(){
  var ids = Object.keys(PAGES);
  GROUPS = [];
  ids.forEach(function(id){
    if(PAGES[id].roles.indexOf(state.role) < 0) return;
    if(GROUPS.indexOf(PAGES[id].group) < 0) GROUPS.push(PAGES[id].group);
  });
  var nav = "";
  GROUPS.forEach(function(g){
    nav += '<div class="nav-group-title">' + g + "</div>";
    ids.forEach(function(id){
      var p = PAGES[id];
      if(p.group !== g || p.roles.indexOf(state.role) < 0) return;
      nav += '<div class="nav-item' + (id === state.page ? " on" : "") + '" onclick="go(\'' + id + '\')">' +
        "<span>" + p.title + "</span>" +
        (p.badge ? '<span class="badge warn">' + p.badge + "</span>" : "") + "</div>";
    });
  });
  var page = PAGES[state.page];
  if(!page){ state.page = firstAllowed(state.role); page = PAGES[state.page]; }
  document.getElementById("app").innerHTML =
    '<div class="app"><div class="topbar">' +
      '<div class="brand"><span class="logo">LIC</span>IoT-DAQ 授权管理后台</div>' +
      '<span class="mini">厂商侧 · 运营与售后</span>' +
      '<span class="spacer"></span>' +
      '<span class="mini">角色</span><select onchange="setRole(this.value)">' +
        Object.keys(ROLE_LABEL).map(function(r){ return "<option value='" + r + "'" + (r === state.role ? " selected" : "") + ">" + ROLE_LABEL[r] + "</option>"; }).join("") +
      "</select>" +
      '<span class="pill warn" onclick="go(\'ad-overview\')">⚠ 待处理 9 项</span>' +
      '<span class="pill ok">● 回执健康 398/412</span>' +
      '<span class="avatar">李</span>' +
    "</div>" +
    '<div class="body"><div class="sidebar">' + nav +
      '<div class="sidebar-foot">admin-console v1.0<br>独立构建 · 与网关侧隔离<br>' +
      '<a href="gateway-console.html" style="color:var(--brand)">→ 切换到客户端原型</a></div></div>' +
      '<div class="main"><div class="page-head"><div><div class="crumb">' + (page.crumb || page.group) + "</div><h1>" + page.title + "</h1>" +
      (page.sub ? '<p class="desc">' + page.sub + "</p>" : "") + "</div>" +
      (page.ops ? '<div class="ops">' + page.ops.map(btn).join("") + "</div>" : "") + "</div>" +
      '<div class="content">' + renderBlocks(page.blocks) + "</div></div>" +
    "</div></div>";
}
