<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iot-daq 客户端控制台 · iot-daq 客户端控制台（方案 A · 冰川）</title>
<meta name="description" content="iot-daq 工业边缘数据汇聚网关 · 客户端控制台改版方案 A（亮色洁净派 · 参考 Purity UI）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============================================================
   方案 A ·「Glacier 冰川」— 亮色洁净派（Purity UI 血统）
   定调：深海军蓝侧栏 + 青绿强调 + 纯白大圆角卡 + 柔和扩散阴影
   记忆点：顶栏授权状态环 + KPI 渐变图标方块 + 柔和悬浮卡片
   ============================================================ */
:root{
  /* 表面 */
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#FAFBFE; --surface-3:#F0F3F9;
  --sidebar:#0F1B3D; --sidebar-2:#16244C; --sidebar-line:rgba(255,255,255,.08);
  /* 文字 */
  --text:#101733; --text-2:#5A6486; --text-3:#8E97B4;
  --on-dark:#E8ECF7; --on-dark-2:#8A94B8;
  /* 强调 */
  --accent:#17C3B2; --accent-2:#0FA396; --accent-soft:#E2FBF7; --accent-line:#A8EDE4;
  --ink:#1B6BE0; --ink-soft:#E8F0FE;
  --grad-brand:linear-gradient(135deg,#17C3B2 0%,#1B6BE0 100%);
  --grad-teal:linear-gradient(135deg,#2BD9C8 0%,#0FA396 100%);
  --grad-ink:linear-gradient(135deg,#4C8DF6 0%,#1B4FD8 100%);
  /* 语义 */
  --ok:#12B76A; --ok-soft:#E6F9F0; --ok-line:#A9EBC8;
  --warn:#F79009; --warn-soft:#FFF6E6; --warn-line:#FFDFA6;
  --danger:#F04438; --danger-soft:#FEECEA; --danger-line:#FBC9C4;
  --info:#2E90FA; --info-soft:#E9F3FE; --info-line:#BFDDFB;
  --sim:#7A5AF8; --sim-soft:#F1EDFE; --sim-line:#D3C7FD;
  --idle:#8E97B4; --idle-soft:#F0F3F9; --idle-line:#DDE2EC;
  /* 形状 */
  --r-card:16px; --r-inner:12px; --r-btn:10px; --r-pill:999px; --r-sm:8px;
  --shadow-1:0 1px 2px rgba(16,24,60,.05);
  --shadow-2:0 10px 26px -10px rgba(16,24,60,.16);
  --shadow-3:0 30px 70px -20px rgba(16,24,60,.30);
  --shadow-pop:0 24px 60px -16px rgba(16,24,60,.28);
  /* 排版 */
  --f-display:"Sora","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --t-xs:11px; --t-sm:12px; --t-base:13px; --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:26px;
  /* 动效 */
  --d-fast:160ms; --d-base:320ms; --d-slow:640ms;
  --ease:cubic-bezier(.16,1,.3,1);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--f-body); font-size:var(--t-base); line-height:1.7; color:var(--text);
  background:var(--bg); -webkit-font-smoothing:antialiased;
}
/* 氛围层：两枚极淡径向渐变 + 极细网格，替代纯色平铺 */
.atmo{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(48rem 30rem at 8% -8%,rgba(23,195,178,.13),transparent 62%),
    radial-gradient(52rem 34rem at 102% 2%,rgba(27,107,224,.10),transparent 60%);
}
.atmo::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(16,24,60,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(16,24,60,.035) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(70% 60% at 40% 0%,#000,transparent 75%);
  -webkit-mask-image:radial-gradient(70% 60% at 40% 0%,#000,transparent 75%);
}
.mono,.num,td.mono,.kpi-val,.pvv,.big{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

/* ── 侧栏：深海军蓝分区 ───────────────────────────── */
.sidebar{width:250px;flex:0 0 250px;background:var(--sidebar);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad-teal);display:flex;align-items:center;
  justify-content:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#04241F;
  box-shadow:0 6px 16px -6px rgba(23,195,178,.9)}
.brand-txt{display:flex;flex-direction:column;line-height:1.25}
.brand-txt b{font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand-txt span{font-size:10px;color:var(--on-dark-2);letter-spacing:.14em;text-transform:uppercase}
.nav-group-title{padding:16px 20px 6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5C678C}
.nav-item{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:9px 12px;border-radius:var(--r-sm);
  cursor:pointer;color:#B9C2DC;font-size:var(--t-base);transition:background var(--d-fast) ease-out,color var(--d-fast) ease-out}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-item.on{background:rgba(23,195,178,.16);color:#fff;font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .ic{width:17px;text-align:center;font-size:14px;opacity:.9}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;border-radius:var(--r-pill);
  padding:0 7px;line-height:16px;font-weight:600}
.nav-item .badge.sim{background:var(--sim)}
.sidebar-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--sidebar-line);font-size:10px;
  color:#6B7699;line-height:1.9}
.sidebar-foot .scheme{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;
  letter-spacing:.06em;font-size:10px}
.sidebar-foot .scheme i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}

/* ── 顶栏 ─────────────────────────────────────────── */
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;padding:0 24px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(16,24,60,.07)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);
  font-size:var(--t-sm);cursor:pointer;white-space:nowrap;border:1px solid transparent;font-weight:500;
  transition:transform var(--d-fast) ease-out,box-shadow var(--d-fast) ease-out}
.pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-1)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill.ok{background:var(--ok-soft);color:#0A6B47;border-color:var(--ok-line)}
.pill.warn{background:var(--warn-soft);color:#8A4B00;border-color:var(--warn-line)}
.pill.danger{background:var(--danger-soft);color:#8C1D18;border-color:var(--danger-line)}
.pill.info{background:var(--info-soft);color:#12489C;border-color:var(--info-line)}
.pill.sim{background:var(--sim-soft);color:#4B31C4;border-color:var(--sim-line)}
.pill.plain{background:#fff;color:var(--text-2);border-color:#E1E5EF}
.pill i.dotp{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
/* 记忆点：授权状态环 */
.lic-ring{position:relative;width:34px;height:34px;flex:0 0 34px}
.lic-ring svg{transform:rotate(-90deg)}
.lic-ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:9px;font-weight:600;color:var(--ok)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad-ink);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:var(--t-sm);font-weight:600;font-family:var(--f-display)}

/* ── 主体 ─────────────────────────────────────────── */
.main{flex:1;min-width:0;overflow-y:auto;padding-bottom:56px}
.page-head{padding:26px 28px 18px;display:flex;align-items:flex-start;gap:18px}
.crumb{font-size:var(--t-sm);color:var(--text-3);margin-bottom:7px;letter-spacing:.02em}
.page-head h1{margin:0;font-family:var(--f-display);font-size:var(--t-2xl);font-weight:700;
  letter-spacing:-.03em;line-height:1.15}
.page-head .desc{margin:8px 0 0;font-size:var(--t-base);color:var(--text-2);max-width:1000px;line-height:1.65}
.page-head .ops{margin-left:auto;display:flex;gap:9px;flex:0 0 auto;padding-top:6px}
.content{padding:4px 28px 0;display:flex;flex-direction:column;gap:18px;max-width:1640px}

/* ── 通告条 ───────────────────────────────────────── */
.banner{display:flex;gap:13px;align-items:flex-start;padding:15px 18px;border-radius:var(--r-inner);
  border:1px solid;font-size:var(--t-base);box-shadow:var(--shadow-1)}
.banner .bi{width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;margin-top:2px}
.banner b{display:block;font-family:var(--f-display);font-size:var(--t-md);font-weight:600;margin-bottom:3px}
.banner .bops{margin-left:auto;display:flex;gap:9px;flex:0 0 auto;align-items:center}
.banner.ok{background:var(--ok-soft);border-color:var(--ok-line);color:#0A5C3D}
.banner.ok .bi{background:var(--ok);color:#fff}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-line);color:#6B3B00}
.banner.warn .bi{background:var(--warn);color:#fff}
.banner.danger{background:var(--danger-soft);border-color:var(--danger-line);color:#7A1418}
.banner.danger .bi{background:var(--danger);color:#fff}
.banner.info{background:var(--info-soft);border-color:var(--info-line);color:#123C86}
.banner.info .bi{background:var(--info);color:#fff}
.banner.sim{background:var(--sim-soft);border-color:var(--sim-line);color:#3D27A8}
.banner.sim .bi{background:var(--sim);color:#fff}

/* ── 按钮 ─────────────────────────────────────────── */
.btn{font-family:var(--f-body);font-size:var(--t-base);padding:8px 16px;min-height:40px;border-radius:var(--r-btn);
  border:1px solid #E1E5EF;background:#fff;color:var(--text);cursor:pointer;white-space:nowrap;font-weight:500;
  transition:all var(--d-fast) ease-out;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:#C7CDDD;box-shadow:var(--shadow-1);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--grad-ink);border-color:transparent;color:#fff;
  box-shadow:0 8px 20px -8px rgba(27,79,216,.7)}
.btn.primary:hover{box-shadow:0 12px 26px -8px rgba(27,79,216,.85)}
.btn.teal{background:var(--grad-teal);border-color:transparent;color:#04241F;
  box-shadow:0 8px 20px -8px rgba(15,163,150,.75)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;color:var(--ink);background:transparent}
.btn.ghost:hover{background:var(--ink-soft);box-shadow:none}
.btn.sm{padding:4px 11px;min-height:30px;font-size:var(--t-sm);border-radius:var(--r-sm)}
.btn.wide{width:100%}

/* ── 卡片 ─────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-2);overflow:hidden;
  transition:box-shadow var(--d-base) var(--ease),transform var(--d-base) var(--ease)}
.card:hover{box-shadow:var(--shadow-3)}
.card-head{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.card-head h3{margin:0;font-family:var(--f-display);font-size:var(--t-lg);font-weight:600;letter-spacing:-.015em}
.card-head .sub{font-size:var(--t-sm);color:var(--text-3)}
.card-head .ops{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-body{padding:18px 20px 20px}
.card.tight .card-body{padding:14px 16px 16px}
.card.flush .card-body{padding:18px 0 0}
.card.accent{background:
  radial-gradient(26rem 14rem at 100% 0%,rgba(23,195,178,.10),transparent 60%),var(--surface)}

/* ── 栅格 ─────────────────────────────────────────── */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g31{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}
@media(max-width:1400px){.g4,.g21,.g12,.g31{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1080px){.g4,.g3,.g2,.g21,.g12,.g31{grid-template-columns:1fr}}

/* ── KPI 卡（A 版：大卡 + 渐变图标方块，Purity 手法）── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1080px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:18px 20px;
  display:flex;flex-direction:column;gap:12px;transition:box-shadow var(--d-base) var(--ease),transform var(--d-base) var(--ease)}
.kpi:hover{box-shadow:var(--shadow-3);transform:translateY(-3px)}
.kpi-top{display:flex;align-items:center;gap:12px}
.kpi-ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;box-shadow:0 8px 18px -8px rgba(16,24,60,.6)}
.kpi-ic.teal{background:var(--grad-teal);color:#04241F}
.kpi-ic.ink{background:var(--grad-ink)}
.kpi-ic.amber{background:linear-gradient(135deg,#FFC249 0%,#F79009 100%);color:#4A2A00}
.kpi-ic.violet{background:linear-gradient(135deg,#A78BFA 0%,#7A5AF8 100%)}
.kpi-ic.rose{background:linear-gradient(135deg,#FB7185 0%,#F04438 100%)}
.kpi-lbl{font-size:var(--t-sm);color:var(--text-2);font-weight:500}
.kpi-val{font-size:var(--t-2xl);font-weight:600;line-height:1.15;letter-spacing:-.03em;display:flex;
  align-items:baseline;gap:5px}
.kpi-val .unit{font-family:var(--f-body);font-size:var(--t-sm);font-weight:400;color:var(--text-3)}
.kpi-sub{font-size:var(--t-sm);color:var(--text-3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.delta{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:600;padding:1px 8px;border-radius:var(--r-pill)}
.delta.up{background:var(--ok-soft);color:#0A6B47}
.delta.dn{background:var(--danger-soft);color:#8C1D18}
.delta.flat{background:var(--idle-soft);color:var(--text-2)}

/* ── 表格 ─────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--t-base)}
table.tbl th{text-align:left;padding:11px 14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;background:var(--surface-2);white-space:nowrap;
  border-bottom:1px solid #EDF0F6}
table.tbl th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
table.tbl th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
table.tbl td{padding:12px 14px;border-bottom:1px solid #F3F5FA;color:var(--text);vertical-align:middle}
table.tbl tbody tr{transition:background var(--d-fast) ease-out}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl td.mono{font-size:var(--t-sm);color:var(--text-2)}
table.tbl .r{text-align:right}
table.tbl .c{text-align:center}
table.tbl tr.row-sim{background:linear-gradient(90deg,rgba(122,90,248,.07),transparent 55%)}
table.tbl tr.row-warn{background:linear-gradient(90deg,rgba(247,144,9,.08),transparent 55%)}
table.tbl tr.row-bad{background:linear-gradient(90deg,rgba(240,68,56,.07),transparent 55%)}
.tbl-foot{padding:12px 16px;font-size:var(--t-sm);color:var(--text-3);border-top:1px solid #F3F5FA;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbl-foot .ops{margin-left:auto;display:flex;gap:8px}

/* ── 标签 / 状态点 ────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:var(--r-pill);
  font-size:var(--t-xs);font-weight:600;border:1px solid transparent;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:#0A6B47;border-color:var(--ok-line)}
.tag.warn{background:var(--warn-soft);color:#8A4B00;border-color:var(--warn-line)}
.tag.danger{background:var(--danger-soft);color:#8C1D18;border-color:var(--danger-line)}
.tag.info{background:var(--info-soft);color:#12489C;border-color:var(--info-line)}
.tag.sim{background:var(--sim-soft);color:#4B31C4;border-color:var(--sim-line)}
.tag.idle{background:var(--idle-soft);color:var(--text-2);border-color:var(--idle-line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(18,183,106,.18)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(247,144,9,.18)}
.dot.danger{background:var(--danger);box-shadow:0 0 0 3px rgba(240,68,56,.18)}
.dot.sim{background:var(--sim);box-shadow:0 0 0 3px rgba(122,90,248,.2)}
.dot.idle{background:var(--idle);box-shadow:0 0 0 3px rgba(142,151,180,.18)}
.tag.solid-ok{background:var(--ok);color:#fff;border-color:transparent}

/* ── 键值表 ───────────────────────────────────────── */
.kv{display:flex;flex-direction:column;gap:0}
.kv-i{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px dashed #EDF0F6;font-size:var(--t-base)}
.kv-i:last-child{border-bottom:none}
.kv-i .k{color:var(--text-3);flex:0 0 40%;font-size:var(--t-sm)}
.kv-i .v{margin-left:auto;text-align:right;font-weight:500;word-break:break-all}
.kv-i .v.mono{font-family:var(--f-mono);font-size:var(--t-sm)}
.kv-i .v.big{font-family:var(--f-display);font-size:var(--t-lg);font-weight:600}

/* ── 开关行 ───────────────────────────────────────── */
.sw-list{display:flex;flex-direction:column;gap:2px}
.sw-row{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid #F3F5FA}
.sw-row:last-child{border-bottom:none}
.sw-row .sw-txt{flex:1;min-width:0}
.sw-row .sw-t{font-weight:500;font-size:var(--t-base);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw-row .sw-d{font-size:var(--t-sm);color:var(--text-3);line-height:1.55;margin-top:2px}
.sw{width:46px;height:26px;flex:0 0 46px;border-radius:var(--r-pill);background:#D5DAE6;position:relative;
  cursor:pointer;border:none;padding:0;transition:background var(--d-base) var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(16,24,60,.28);transition:transform var(--d-base) var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.sw.sim.on{background:var(--sim)}
.sw:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw[disabled]{opacity:.4;cursor:not-allowed}
.sw.sm{width:36px;height:20px;flex:0 0 36px}
.sw.sm::after{width:14px;height:14px;top:3px;left:3px}
.sw.sm.on::after{transform:translateX(16px)}

/* ── 进度 / 步骤 ──────────────────────────────────── */
.prog{height:10px;border-radius:var(--r-pill);background:#E9EDF5;overflow:hidden}
.prog i{display:block;height:100%;border-radius:var(--r-pill);background:var(--grad-teal);
  transition:width var(--d-base) var(--ease)}
.prog.ink i{background:var(--grad-ink)}
.prog.err i{background:var(--danger)}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.step .si{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;font-family:var(--f-mono);
  background:var(--idle-soft);color:var(--text-3);border:1px solid var(--idle-line)}
.step.done .si{background:var(--ok);color:#fff;border-color:transparent}
.step.run .si{background:var(--grad-ink);color:#fff;border-color:transparent;
  animation:pulse 1.4s ease-in-out infinite}
.step.fail .si{background:var(--danger);color:#fff;border-color:transparent}
.step .sb{flex:1;min-width:0;font-size:var(--t-base)}
.step .sb .t{font-weight:500}
.step .sb .d{font-size:var(--t-sm);color:var(--text-3)}
.step .st{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-sm);color:var(--text-3)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(27,79,216,.5)}50%{box-shadow:0 0 0 7px rgba(27,79,216,0)}}

/* ── 表单 ─────────────────────────────────────────── */
.form{display:grid;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:var(--t-sm);font-weight:500;color:var(--text-2)}
.fld label .req{color:var(--danger)}
.fld input[type=text],.fld input[type=number],.fld input[type=password],.fld select,.fld textarea{
  font-family:inherit;font-size:var(--t-base);padding:9px 12px;min-height:40px;border:1px solid #E1E5EF;
  border-radius:var(--r-btn);background:#fff;color:var(--text);transition:border-color var(--d-fast) ease-out,box-shadow var(--d-fast) ease-out}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(23,195,178,.18)}
.fld input.mono{font-family:var(--f-mono)}
.fld .hint{font-size:var(--t-xs);color:var(--text-3);line-height:1.6}
.fld .hint.err{color:var(--danger);font-weight:500}
.fld .hint.warn{color:#8A4B00}
.row-inline{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.row-inline.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row-inline.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1080px){.row-inline,.row-inline.c3,.row-inline.c4{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:var(--t-sm);padding:4px 11px;border-radius:var(--r-pill);
  border:1px solid #E1E5EF;background:#fff;cursor:pointer;color:var(--text-2);transition:all var(--d-fast) ease-out}
.chip:hover{border-color:var(--accent);color:var(--accent-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2);font-weight:600}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── 单选块 ───────────────────────────────────────── */
.radios{display:flex;flex-direction:column;gap:10px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid #E9EDF5;
  border-radius:var(--r-inner);cursor:pointer;background:var(--surface);transition:all var(--d-fast) ease-out}
.radio:hover{border-color:var(--accent-line);background:var(--surface-2)}
.radio.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.radio:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.radio .rdo{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:2px solid #CBD2E0;margin-top:2px;
  position:relative;transition:border-color var(--d-fast) ease-out}
.radio.on .rdo{border-color:var(--accent-2)}
.radio.on .rdo::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent-2)}
.radio .rt{font-weight:600;font-size:var(--t-base);font-family:var(--f-display)}
.radio .rd{font-size:var(--t-sm);color:var(--text-3);line-height:1.6;margin-top:2px}

/* ── 提示块 ───────────────────────────────────────── */
.note{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r-inner);background:var(--surface-2);
  border:1px solid #EDF0F6;font-size:var(--t-sm);color:var(--text-2);line-height:1.7}
.note .ni{color:var(--ink);font-weight:700;flex:0 0 auto}
.note.sim{background:var(--sim-soft);border-color:var(--sim-line);color:#3D27A8}
.hint-strip{font-size:var(--t-sm);color:var(--text-3);padding:9px 13px;border-radius:var(--r-sm);
  background:var(--surface-2);border-left:3px solid var(--accent);line-height:1.7}
.impact{border-radius:var(--r-inner);border:1px solid var(--danger-line);background:var(--danger-soft);
  padding:15px 18px;display:flex;gap:13px}
.impact .ii{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--danger);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-top:1px}
.impact .it{font-family:var(--f-display);font-weight:700;color:#7A1418;font-size:var(--t-md);margin-bottom:6px}
.impact ul{margin:0;padding-left:18px;color:#8C2A24;font-size:var(--t-sm);line-height:1.85}
.impact.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.impact.warn .ii{background:var(--warn)}
.impact.warn .it{color:#6B3B00}
.impact.warn ul{color:#7A4A08}

/* ── 图表 ─────────────────────────────────────────── */
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--text-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.spark{display:inline-block;vertical-align:middle}

/* ── 模拟专用 ─────────────────────────────────────── */
.sim-cell{display:flex;flex-direction:column;gap:3px}
.sim-range{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--text-2)}
.sim-range .eq{color:var(--sim);font-weight:600}
.pv-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pvv{font-family:var(--f-mono);font-size:var(--t-md);font-weight:600;padding:7px 13px;border-radius:var(--r-sm);
  background:var(--sim-soft);color:#3D27A8;border:1px solid var(--sim-line);letter-spacing:.01em}
.pvv .u{font-family:var(--f-body);font-size:var(--t-xs);font-weight:400;color:#6E5AC4;margin-left:4px}
.dec-note{font-size:var(--t-xs);color:var(--text-3)}
.range-bar{height:26px;border-radius:var(--r-sm);background:var(--surface-3);position:relative;overflow:hidden}
.range-bar .fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(122,90,248,.30),rgba(122,90,248,.16));
  border-left:2px solid var(--sim);border-right:2px solid var(--sim)}
.range-bar .tick{position:absolute;top:50%;width:2px;height:16px;margin-top:-8px;background:var(--sim);border-radius:1px}
.range-bar .eqmark{position:absolute;top:0;bottom:0;width:3px;background:var(--sim)}

/* ── 模态 ─────────────────────────────────────────── */
.mask{position:fixed;inset:0;background:rgba(16,24,60,.42);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:32px;animation:fade var(--d-base) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-pop);width:100%;
  max-width:760px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  animation:pop var(--d-base) var(--ease)}
.modal.wide{max-width:1000px}
.modal.narrow{max-width:520px}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 24px 14px}
.modal-head h3{margin:0;font-family:var(--f-display);font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em}
.modal-head .sub{font-size:var(--t-sm);color:var(--text-3);margin-top:3px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:none;background:var(--surface-3);
  color:var(--text-2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:#E5EAF3;color:var(--text)}
.modal-body{padding:4px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.modal-foot{display:flex;gap:10px;align-items:center;padding:16px 24px;border-top:1px solid #EDF0F6;
  background:var(--surface-2)}
.modal-foot .spacer{flex:1}

/* ── 标签页 ───────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid #EDF0F6;margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 16px;font-size:var(--t-base);color:var(--text-2);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;transition:all var(--d-fast) ease-out}
.tab:hover{color:var(--text)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.tab.on{color:var(--accent-2);border-bottom-color:var(--accent-2);font-weight:600}

/* ── 时间线 ───────────────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:flex;gap:13px;padding:12px 0;border-bottom:1px dashed #EDF0F6}
.tl-i:last-child{border-bottom:none}
.tl-i .td{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:0 0 6px}
.tl-i .tc{flex:1;min-width:0}
.tl-i .tt{font-size:var(--t-base);font-weight:500}
.tl-i .tu{font-size:var(--t-xs);color:var(--text-3);font-family:var(--f-mono)}

/* ── 空态 ─────────────────────────────────────────── */
.empty{padding:44px 20px;text-align:center;color:var(--text-3)}
.empty .et{font-family:var(--f-display);font-size:var(--t-lg);font-weight:600;color:var(--text-2);margin-bottom:6px}
.empty .ed{font-size:var(--t-sm);margin-bottom:16px;color:var(--text-2);line-height:1.75;
  max-width:620px;margin-left:auto;margin-right:auto}

/* ── 入场编排（3-6 组错峰）────────────────────────── */
@media (prefers-reduced-motion: no-preference){
  .rv{animation:rv var(--d-base) var(--ease) both}
  .content > *:nth-child(1){animation-delay:0ms}
  .content > *:nth-child(2){animation-delay:70ms}
  .content > *:nth-child(3){animation-delay:140ms}
  .content > *:nth-child(4){animation-delay:210ms}
  .content > *:nth-child(5){animation-delay:280ms}
  .content > *:nth-child(6){animation-delay:350ms}
}
@keyframes rv{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#D2D8E4;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#B9C1D2;background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* 渲染器「响亮失败」用：未实现的区块类型必须肉眼可见，不许静默空白 */
.blk-err{padding:12px 16px;border-radius:var(--r-sm);background:#FFF1F0;border:1px dashed #FF4D4F;
  color:#A8071A;font-size:var(--t-sm);font-weight:600;font-family:var(--f-mono)}

/* 模拟范围「量化截断」提示：输入范围与实际可输出范围不一致时必须说清 */
.dec-note.q-note{color:#0B7A70;font-weight:600}
.dec-note.q-note.bad{color:var(--danger)}
.range-bar.bad .fill{background:var(--danger)}

/* 小数位 0~6 快捷 chip：一行铺开不换行 */
.chips.nowrap{flex-wrap:nowrap}
.chips.nowrap .chip{min-width:26px;padding:3px 7px;font-size:var(--t-xs,11px)}
.fld > .chips{margin-top:5px}

/* 范围条上的状态文字（范围相等 / 步长放不下），避免只剩一根无字刻度看不懂 */
.range-bar .eqv{position:absolute;left:calc(50% + 12px);top:50%;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--sim)}
.range-bar .eqv.bad{color:var(--danger);left:50%;transform:translate(-50%,-50%)}

/* ══ 列表分页（所有列表页统一）════════════════════════ */
.pager{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;
  border-top:1px solid #F3F5FA;font-size:var(--t-sm);color:var(--text-3)}
.pager .pg-info b{color:var(--text);font-family:var(--f-mono);font-weight:700}
.pager .pg-sizes{display:flex;align-items:center;gap:5px;margin-left:auto}
.pager .pg-nav{display:flex;align-items:center;gap:3px}
.pager .pg-btn{font-family:var(--f-mono);font-size:var(--t-sm);min-width:28px;height:26px;padding:0 8px;
  border:1px solid #E9EDF5;background:var(--surface);color:var(--text-2);
  border-radius:var(--r-sm);cursor:pointer;transition:all var(--d-fast) var(--ease)}
.pager .pg-btn:hover:not(.disabled){border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.pager .pg-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pager .pg-btn.disabled{opacity:.38;cursor:not-allowed}
.pager .pg-gap{color:var(--text-3);padding:0 3px}
.pager .pg-jump{display:flex;align-items:center;gap:5px}
.pager .pg-jump input{width:48px;height:26px;padding:0 6px;text-align:center;font-family:var(--f-mono);
  font-size:var(--t-sm);border:1px solid #E9EDF5;border-radius:var(--r-sm);background:var(--surface);color:var(--text)}

/* ══ 表单栅格 + 输入单位后缀 ═════════════════════════ */
.form.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
.form .fld.span{grid-column:1/-1}
.form-grp{grid-column:1/-1;font-family:var(--f-display);font-size:var(--t-sm);font-weight:700;
  color:var(--text-2);letter-spacing:.05em;padding-top:12px;border-top:1px dashed #E9EDF5;margin-top:4px}
.form-grp:first-child{border-top:0;padding-top:0;margin-top:0}
.inp-unit{display:flex;align-items:center;gap:8px}
.inp-unit input,.inp-unit select{flex:1;min-width:0}
.inp-unit > span{font-size:var(--t-sm);color:var(--text-3);flex:0 0 auto}
.radios.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ══ 设备 ↔ 点位映射 ═════════════════════════════════ */
.mapflow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;padding:16px;
  background:var(--surface-2);border:1px solid #EDF0F7;border-radius:var(--r-inner)}
.mf-node{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface);
  border:1px solid #E9EDF5;border-radius:var(--r-sm);min-width:0}
.mf-node .mf-ic{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;background:var(--accent-soft);color:var(--accent-2)}
.mf-node b{display:block;font-size:var(--t-sm);white-space:nowrap}
.mf-node i{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--text-3);white-space:nowrap}
.mf-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 10px;min-width:86px;position:relative}
.mf-arrow::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#DDE2EC}
.mf-arrow span{position:relative;font-family:var(--f-mono);font-size:10px;color:var(--text-2);
  background:var(--surface-2);padding:1px 6px;border-radius:4px}
.devlist{display:flex;flex-direction:column;gap:6px}
.devlist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
  background:var(--surface);border:1px solid #E9EDF5;border-radius:var(--r-inner);
  transition:all var(--d-fast) var(--ease)}
.devlist-item:hover{border-color:var(--accent-line);background:var(--surface-2)}
.devlist-item.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.devlist-item .dn{font-weight:600;font-size:var(--t-sm)}
.devlist-item .dm{font-family:var(--f-mono);font-size:10px;color:var(--text-3)}
.devlist-item .dc{margin-left:auto;font-family:var(--f-mono);font-weight:700;font-size:var(--t-sm);color:var(--text-2)}
.devlist-item.on .dc{color:var(--accent-2)}
/* 切换协议后字段区重载的提示闪光 */
@keyframes fld-flash{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
.fld-reload{animation:fld-flash var(--d-base) var(--ease)}

/* ══ 新增设备向导条 / 区块小标题 / 底部操作条 ═══════ */
.wz{display:flex;align-items:center;gap:0;padding:14px 18px;background:var(--surface);
  border:1px solid #EDF0F7;border-radius:var(--r-card);box-shadow:var(--shadow-1);flex-wrap:wrap}
.wz-i{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--text-3);font-weight:600}
.wz-i .wz-n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:var(--t-xs);background:var(--surface-3);color:var(--text-3)}
.wz-i.run{color:var(--text)}
.wz-i.run .wz-n{background:var(--accent);color:#fff}
.wz-i.done{color:var(--accent-2)}
.wz-i.done .wz-n{background:var(--accent-soft);color:var(--accent-2)}
.wz-line{flex:1 1 24px;height:1px;background:#E4E9F2;margin:0 12px;min-width:16px}
.sub-h{font-family:var(--f-display);font-size:var(--t-sm);font-weight:700;color:var(--text-2);
  margin:14px 0 8px;letter-spacing:.03em}
.actbar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);
  border:1px solid #EDF0F7;border-radius:var(--r-card);box-shadow:var(--shadow-2);flex-wrap:wrap}
.actbar .ab-txt{flex:1;font-size:var(--t-sm);color:var(--text-3)}
.actbar .ab-txt b{color:var(--text);font-family:var(--f-mono)}
/* 表格内的可点元素与两行单元格 */
.lnk{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-mono);font-weight:700;
  color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;font-size:var(--t-base)}
.lnk:hover{color:var(--accent)}
.dev-name{font-weight:600}
.cell-2{display:flex;flex-direction:column;line-height:1.35}
.cell-2 b{font-weight:500}
.cell-2 i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--text-3)}
.ck{display:inline-block;width:14px;height:14px;border:1px solid var(--idle-line);border-radius:3px}
/* 点位表上方的设备切换条 */
.tbl-tools{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #F3F5FA;flex-wrap:wrap}
.tbl-tools .tt-lbl{font-size:var(--t-sm);color:var(--text-3);flex:0 0 auto}
.tbl-tools .chip{display:inline-flex;align-items:center;gap:5px}
.tbl-tools .cpt{font-family:var(--f-mono);font-size:10px;opacity:.72}

/* 协议要点列表（新增设备页「当前选择」卡） */
.tips{margin:8px 0 0;padding-left:18px;font-size:var(--t-sm);color:var(--text-2);line-height:1.72}
.tips li{margin-bottom:4px}
.tips li::marker{color:var(--accent)}

/* ══ 点位映射「主从布局」：左设备列表 / 右点表与操作 ═══════════

.split{display:grid;grid-template-columns:minmax(272px,340px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1240px){.split{grid-template-columns:1fr}}
.sl-hd{padding:0 0 12px;border-bottom:1px dashed #EDF0F6;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.sl-search{font-family:var(--f-mono);font-size:var(--t-sm);padding:8px 12px;min-height:36px;
  border:1px solid #E1E5EF;border-radius:var(--r-btn);background:var(--surface-2);color:var(--text);width:100%}
.sl-search:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(23,195,178,.16)}
.sl-grps .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body)}
.cpt{font-family:var(--f-mono);font-size:10px;opacity:.72}
.sl-list{display:flex;flex-direction:column;gap:6px}
.dl-i{display:flex;flex-direction:column;gap:3px;padding:11px 13px;cursor:pointer;
  border:1px solid #E9EDF5;border-radius:var(--r-inner);background:var(--surface);
  transition:all var(--d-fast) var(--ease)}
.dl-i:hover{border-color:var(--accent-line);background:var(--surface-2);transform:translateX(2px)}
.dl-i.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.dl-i:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dl-r1{display:flex;align-items:center;gap:8px}
.dl-r1 .dn{font-weight:600;font-size:var(--t-base)}
.dl-i.on .dl-r1 .dn{color:var(--accent-2)}
.dl-r2{font-family:var(--f-mono);font-size:10px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-r3{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);color:var(--text-2)}
.dl-r3 .dl-pts{margin-left:auto;font-family:var(--f-mono);font-weight:700;color:var(--text-2)}
.dl-i.on .dl-r3 .dl-pts{color:var(--accent-2)}
.sl-ft{padding:11px 2px 0;margin-top:10px;border-top:1px dashed #EDF0F6;
  font-size:var(--t-sm);color:var(--text-3)}
.sl-empty{padding:26px 8px;text-align:center;color:var(--text-3)}
.sl-empty b{display:block;font-family:var(--f-display);font-size:var(--t-base);color:var(--text-2);margin-bottom:5px}
.sl-empty i{display:block;font-style:normal;font-size:var(--t-sm);margin-bottom:12px}
/* 右面板 */
.sp-head{padding:0 18px 14px;border-bottom:1px solid #F3F5FA;display:flex;flex-direction:column;gap:5px}
.sp-t{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sp-t b{font-family:var(--f-display);font-size:var(--t-lg);font-weight:700;letter-spacing:-.015em}
.sp-t .sp-st{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-sm);color:var(--text-2)}
.sp-meta{font-size:var(--t-sm);color:var(--text-3)}
.sp-ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.sp-pad{padding:16px 18px 2px}
.sp-pad .kv{margin-top:2px}

/* ══ 向导：可点回退 / 未到达锁定 / 步骤上下文 ═══════════════ */
.wz-i.clickable{cursor:pointer}
.wz-i.clickable:hover{color:var(--text)}
.wz-i.lock{opacity:.5;cursor:not-allowed}
.wz-ctx{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--text-2)}
.wz-ctx b{font-family:var(--f-mono);color:var(--text)}
.ab-warn{color:var(--danger);font-weight:600}

/* ══ 第五轮反馈：去页头 / 左列固定高度+分页 / 右面板页签按钮 / 实时数据查询框 ══ */
.page-ops{padding:22px 28px 0;display:flex;gap:9px;justify-content:flex-end;max-width:1640px}
.content{padding-top:16px}
/* 左列设备列表：固定高度滚动 + 分页条（覆盖此前的自然高度） */
.sl-list{height:520px;overflow-y:auto;padding-right:4px;flex:1 1 auto;min-height:0}
.sl-ft .pager{font-size:var(--t-xs)}
/* 右面板顶部页签按钮（复用 .tab 基础样式，改为分段按钮观感） */
.sp-tabs{margin-top:10px;border-bottom:none;gap:6px;overflow:visible}
.sp-tabs .tab{border:1px solid #E9EDF5;border-radius:var(--r-btn);padding:7px 14px;
  background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.sp-tabs .tab:hover{border-color:var(--accent-line);color:var(--accent-2)}
.sp-tabs .tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2);font-weight:600}
/* 实时数据页设备查询框 */
.live-q{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live-q input[type="search"]{font-family:var(--f-mono);font-size:var(--t-sm);padding:9px 13px;min-height:38px;width:320px;
  border:1px solid #E1E5EF;border-radius:var(--r-btn);background:var(--surface-2);color:var(--text)}
.live-q input[type="search"]:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(23,195,178,.16)}
.lq-cur{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--text-2)}
.lq-cur b{font-family:var(--f-display);color:var(--text);font-size:var(--t-base)}
.lq-cur i{font-style:normal;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--text-3)}

/* ══ 第六轮反馈：设备按钮随状态行 + 公式编辑弹窗 ══ */
.sp-dev-ops{display:inline-flex;gap:8px;margin-left:14px;vertical-align:middle}
.fx-expr{width:100%;font-family:var(--f-mono);font-size:var(--t-sm);line-height:1.6;color:var(--text);
  background:var(--surface-2);border:1px solid #E1E5EF;border-radius:var(--r-btn);padding:10px 12px;resize:vertical}
.fx-expr:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(23,195,178,.16)}
.fx-check{margin-top:2px}
.fx-check .chip{cursor:default}
.fx-check .chip.ok{border-color:rgba(23,195,178,.45);color:var(--accent-2);background:var(--accent-soft)}
.fx-check .chip.warn{border-color:rgba(255,176,32,.5);color:#9A6B00;background:rgba(255,176,32,.12)}

/* ══ 第七轮反馈：自定义参数行 / 点位行内操作组 ══ */
.cp-rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cp-row{display:grid;grid-template-columns:minmax(140px,220px) minmax(180px,1fr) auto;gap:8px;align-items:center}
.cp-row input{font-size:var(--t-sm);padding:8px 11px;min-height:36px;border:1px solid #E1E5EF;
  border-radius:var(--r-btn);background:var(--surface-2);color:var(--text)}
.cp-row .cp-k{font-family:var(--f-mono)}
.cp-row input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(23,195,178,.16)}
.row-ops{display:inline-flex;gap:6px;margin-left:6px;white-space:nowrap}

/* ══ 第八轮反馈：贴牌（OEM）预览 ══ */
.oem-pv{margin-top:12px;padding:16px 18px;border:1px dashed var(--accent-line);border-radius:var(--r-card);
  background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--surface-2)}
.oem-pv .pv-brand{display:inline-flex;align-items:center;gap:10px}
.oem-pv .pv-brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:var(--t-base)}
.oem-pv .pv-brand b{display:block;font-family:var(--f-display);font-size:var(--t-base);line-height:1.2}
.oem-pv .pv-brand span{display:block;font-size:var(--t-xs);color:var(--text-3);letter-spacing:.04em}
.oem-pv .pv-slogan{margin-top:10px;font-family:var(--f-display);font-size:var(--t-sm);color:var(--text-2)}
.oem-pv .pv-cap{margin-top:10px;font-size:var(--t-xs);color:var(--text-3)}

/* ══ 第九轮反馈：北向转发 · 消息示例代码块 ══ */
.msg-sample{margin:0;padding:13px 15px;background:var(--surface-3);border:1px solid var(--idle-line);
  border-radius:var(--r-inner);font-family:var(--f-mono);font-size:var(--t-xs);line-height:1.7;
  color:var(--text-2);white-space:pre;overflow:auto;max-height:360px}

</style>

<script>

  var DEVICES = [

  /* ── 实时数据页：选中设备各点位的实时曲线 ──────────────
     曲线为确定性伪随机演示序列（围绕当前真实值 / 模拟值波动），
     同一点位每次渲染形状一致 —— 便于对比与断言。 */
  function liveSeries(p) {
    var c = SIMP[p.id];
    var base = parseFloat(c && c.on ? simNow(p.id) : realOf(p));
    if (isNaN(base)) base = 50;
    var seed = 0, i;
    for (i = 0; i < p.id.length; i++) seed = (seed * 31 + p.id.charCodeAt(i)) % 100000;
    var out = [];
    for (i = 0; i < 12; i++) {
      var r = Math.sin((seed + i * 7.9) * 127.1) * 43758.5453;
      r = r - Math.floor(r);
      out.push(+(base * (1 + (r - 0.5) * 0.08)).toFixed(2));
    }
    return out;
  }

<script>
/* ============================================================
   iot-daq 客户端界面 · 改版 v2 共用引擎
   A 冰川 / B 石墨 共用同一套页面内容与渲染器，
   视觉语言完全由各自的 CSS 决定（含 KPI 的 schema 分支）。

   本文件包含：
     ① 通用工具与图表（纯 SVG，无依赖）
     ② ★ 点位模拟引擎（模拟开关 · 模拟范围 · 范围可相等 · 小数位 · 量化输出）
     ③ 块渲染器 + 模态 + 路由
   页面内容在 pages.js（挂到 window.__PAGES__）
   ============================================================ */
(function () {
  "use strict";
  var S = window.__SCHEME__;

  /* ══ ① 通用工具 ══════════════════════════════════════ */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* act('go','points') → onclick="go('points')"，避免多层引号转义 */
  function act(fn, arg) {
    return ' onclick="' + fn + "(" + (arg === undefined || arg === "" ? "" : "'" + arg + "'") + ')"';
  }
  function tag(t, tone) { return '<span class="tag ' + (tone || "idle") + '">' + t + "</span>"; }
  function dot(tone) { return '<span class="dot ' + (tone || "idle") + '"></span>'; }
  function btn(a) {
    var cls = "btn" + (a.kind ? " " + a.kind : "") + (a.sm ? " sm" : "") + (a.wide ? " wide" : "");
    var click = a.onclick ? act(a.onclick, a.arg) : (a.modal ? act("openModalById", a.modal) : "");
    return '<button type="button" class="' + cls + '"' + (a.disabled ? " disabled" : "") + click + ">" +
      (a.icon ? '<span aria-hidden="true">' + a.icon + "</span>" : "") + a.label + "</button>";
  }
  function kv(items) {    return '<div class="kv">' + items.map(function (i) {
      return '<div class="kv-i"><span class="k">' + i.k + '</span><span class="v' + (i.mono ? " mono" : "") +
        (i.big ? " big" : "") + '">' + i.v + "</span></div>";
    }).join("") + "</div>";
  }

  /* ══ 图表（纯 SVG）══════════════════════════════════ */
  function spark(vals, tone) {
    var w = 68, h = 20, max = Math.max.apply(null, vals), min = Math.min.apply(null, vals), rng = max - min || 1;
    var pts = vals.map(function (v, i) {
      return (i / (vals.length - 1) * w).toFixed(1) + "," + (h - 2 - (v - min) / rng * (h - 4)).toFixed(1);
    }).join(" ");
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h +
      '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' +
      (tone === "danger" ? "var(--danger)" : tone === "warn" ? "var(--warn)" : "var(--accent)") +
      '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }
  function areaChart(series, labels, opt) {
    opt = opt || {};
    var w = 600, h = opt.h || 168, pl = 36, pr = 10, pt = 12, pb = 24;
    var iw = w - pl - pr, ih = h - pt - pb;
    var all = [].concat.apply([], series.map(function (s) { return s.data; }));
    var max = Math.max.apply(null, all) * 1.12, min = 0;
    function px(i) { return pl + (series[0].data.length < 2 ? iw / 2 : i / (series[0].data.length - 1) * iw); }
    function py(v) { return pt + ih - (v - min) / (max - min) * ih; }
    var uid = opt.uid || "g";
    var svg = '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="趋势图"><defs>';
    series.forEach(function (s, si) {
      svg += '<linearGradient id="' + uid + si + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + s.color + '" stop-opacity=".30"/>' +
        '<stop offset="100%" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient>';
    });
    svg += "</defs>";
    for (var g = 0; g <= 3; g++) {
      var gy = (pt + ih * g / 3).toFixed(1), gv = Math.round(max - (max - min) * g / 3);
      svg += '<line x1="' + pl + '" y1="' + gy + '" x2="' + (w - pr) + '" y2="' + gy +
        '" stroke="currentColor" stroke-opacity=".10" stroke-dasharray="3 4"/>' +
        '<text x="' + (pl - 6) + '" y="' + (+gy + 3.5) + '" text-anchor="end" font-size="9" fill="currentColor" opacity=".45" font-family="monospace">' + gv + "</text>";
    }
    labels.forEach(function (lb, i) {
      if (series[0].data.length > 8 && i % 2) return;
      svg += '<text x="' + px(i).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="9" fill="currentColor" opacity=".45" font-family="monospace">' + lb + "</text>";
    });
    series.forEach(function (s, si) {
      var line = s.data.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); }).join(" ");
      svg += '<polygon points="' + pl + "," + (pt + ih) + " " + line + " " + (w - pr) + "," + (pt + ih) + '" fill="url(#' + uid + si + ')"/>';
      svg += '<polyline points="' + line + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      svg += '<circle cx="' + px(s.data.length - 1).toFixed(1) + '" cy="' + py(s.data[s.data.length - 1]).toFixed(1) + '" r="3.2" fill="' + s.color + '"/>';
    });
    return '<div class="chart">' + svg + "</svg></div>" +
      '<div class="legend">' + series.map(function (s) {
        return "<span><i style=\"background:" + s.color + '"></i>' + s.name + "</span>";
      }).join("") + "</div>";
  }
  function barChart(series, labels, opt) {
    opt = opt || {};
    var w = 600, h = opt.h || 150, pl = 30, pr = 10, pt = 10, pb = 22;
    var iw = w - pl - pr, ih = h - pt - pb;
    var all = [].concat.apply([], series.map(function (s) { return s.data; }));
    var max = Math.max.apply(null, all) * 1.15;
    var n = series[0].data.length, gw = iw / n, bw = gw / (series.length + 0.6);
    var svg = '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="柱状图">';
    for (var g = 0; g <= 2; g++) {
      var gy = (pt + ih * g / 2).toFixed(1), gv = Math.round(max - max * g / 2);
      svg += '<line x1="' + pl + '" y1="' + gy + '" x2="' + (w - pr) + '" y2="' + gy +
        '" stroke="currentColor" stroke-opacity=".10" stroke-dasharray="3 4"/>' +
        '<text x="' + (pl - 5) + '" y="' + (+gy + 3.5) + '" text-anchor="end" font-size="9" fill="currentColor" opacity=".45" font-family="monospace">' + gv + "</text>";
    }
    series.forEach(function (s, si) {
      s.data.forEach(function (v, i) {
        var bh = v / max * ih, x = pl + gw * i + gw * 0.3 + bw * si, y = pt + ih - bh;
        svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.82).toFixed(1) +

  /* ══ ② ★ 点位模拟引擎 ═══════════════════════════════

  /* 仅存「模拟配置」；真实值 real 归属 POINTS（单一数据源，避免两处不一致渲染出 undefined） */
  var SIMP = {

    Q_Good: { on: false, mode: "ramp", min: 0, max: 9999, dec: 0, dt: "uint32", unit: "件" },
    Run_State: { on: false, mode: "random", min: 0, max: 1, dec: 0, dt: "bool", unit: "—" }
  };
  var POINTS = [
    { id: "T_Barrel1", name: "料筒温度1", addr: "DB1.0", dt: "float32", bo: "AB CD", unit: "℃", dead: "0.5", target: "T_Barrel1", kind: "raw", real: "192.4" },

    { id: "V_Vac", name: "真空度", addr: "DB1.12", dt: "float32", bo: "AB CD", unit: "kPa", dead: "0.001", target: "V_Vac", kind: "raw", real: "0.482" },

    { id: "P_Hold", name: "保压压力", addr: "DB1.20", dt: "float32", bo: "AB CD", unit: "MPa", dead: "0.01", target: "P_Hold", kind: "raw", real: "62.35" },
    { id: "V_Inj", name: "注射速度", addr: "DB1.24", dt: "float32", bo: "AB CD", unit: "mm/s", dead: "0.1", target: "V_Inj", kind: "raw", real: "78.4" },

    { id: "Q_Total", name: "累计产量", addr: "DB2.4", dt: "uint32", bo: "CD AB", unit: "件", dead: "0", target: "Q_Total", kind: "raw", real: "8231" },
    { id: "Q_Good", name: "合格品数", addr: "DB2.8", dt: "uint32", bo: "CD AB", unit: "件", dead: "0", target: "Q_Good", kind: "raw", real: "8094" },
    { id: "Run_State", name: "运行状态", addr: "DB2.12", dt: "bool", bo: "—", unit: "—", dead: "0", target: "Run_State", kind: "raw", real: "1" },
    { id: "E_Unit", name: "单位能耗", addr: "—", dt: "float64", bo: "—", unit: "kWh", dead: "0.01", target: "E_Unit", kind: "calc", real: "0.4212", fx: "K_Energy / Q_Delta" },
    { id: "C_Unit", name: "单件成本", addr: "—", dt: "float64", bo: "—", unit: "元", dead: "0.001", target: "C_Unit", kind: "calc", real: "0.9930", fx: "(K_Energy / Q_Delta) * P_Rate" }
  ];
  /* 真实值统一取处：POINTS.real 为准，缺字段时给「—」而不是打印 undefined */
  function realOf(p) { return (p && p.real !== undefined && p.real !== null) ? p.real : "—"; }
  var MODE_LABEL = { random: "均匀随机", ramp: "线性递增", sine: "正弦波动", fixed: "固定值" };
  var TICK = 0;
  var FWD_SIM = false;

  /* 稳定伪随机：同一配置 + 同样本序号 → 同样本值（便于验证与复现） */
  function rnd(seed) {
    var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;

  /* 可表示的量化边界：lo 向上取到步长、hi 向下取到步长 */
  function simBounds(c) {
    var s = Math.pow(10, c.dec);
    var lo = Math.ceil(c.min * s - 1e-9) / s;
    var hi = Math.floor(c.max * s + 1e-9) / s;
    return { lo: lo, hi: hi, eq: c.min === c.max, tooNarrow: c.min !== c.max && lo > hi };
  }
  function simValidate(c) {
    var out = [], b = simBounds(c), step = Math.pow(10, -c.dec);
    if (c.min > c.max) out.push({ level: "error", text: "最小值不能大于最大值" });
    else if (b.tooNarrow) out.push({ level: "error", text: "范围容不下一个步长（" + step + "），请增大范围或减少小数位" });
    if (c.min === c.max) out.push({ level: "info", text: "范围相等 → 固定值输出，仍按 " + c.dec + " 位小数格式化" });
    if (/^(u?int|bool)/.test(c.dt) && c.dec > 0) out.push({ level: "warn", text: "整数 / 布尔类型点位忽略小数位，已强制为 0 位" });
    if (c.dec > 6) out.push({ level: "error", text: "小数位最多 6 位" });
    return out;
  }
  function simInvalid(c) {
    return simValidate(c).some(function (v) { return v.level === "error"; });
  }
  /* 生成一个模拟样本；返回值的小数位恰好为 dec（cfg 为配置对象，便于弹窗草稿复用） */
  function simSampleCfg(c, seedKey, i) {
    if (!c) return "—";
    var dec = /^(u?int|bool)/.test(c.dt) && c.dec > 0 ? 0 : c.dec;
    var cc = dec === c.dec ? c : { min: c.min, max: c.max, dec: dec, mode: c.mode, dt: c.dt };
    var b = simBounds(cc), raw;
    if (cc.min === cc.max) {
      raw = cc.min;
    } else if (b.tooNarrow) {
      raw = b.hi;
    } else {
      var r = rnd(hashStr(seedKey) + i * 7.9 + cc.min * 13 + cc.max * 7 + cc.dec * 101);
      if (cc.mode === "random") raw = b.lo + r * (b.hi - b.lo);
      else if (cc.mode === "ramp") raw = b.lo + (b.hi - b.lo) * ((i % 8) / 7);
      else if (cc.mode === "sine") raw = b.lo + (b.hi - b.lo) * 0.5 * (1 + Math.sin(i * 0.7));
      else raw = cc.min;
    }
    var p = Math.pow(10, dec);
    var q = Math.round(raw * p) / p;
    if (cc.min !== cc.max && !b.tooNarrow) {
      if (q < b.lo) q = b.lo;
      if (q > b.hi) q = b.hi;
    }
    return q.toFixed(dec);
  }
  function simSample(id, i) { return simSampleCfg(SIMP[id], id, i); }
  function simNow(id) { return simSample(id, TICK + hashStr(id) % 11); }
  function simOnCount() {
    return Object.keys(SIMP).filter(function (k) { return SIMP[k].on; }).length;
  }
  function toggleSim(id) { SIMP[id].on = !SIMP[id].on; render(); }
  function setSimAll(on) {
    var to = on === "1" || on === 1 || on === true;
    Object.keys(SIMP).forEach(function (k) { SIMP[k].on = to; });
    render();
  }
  function toggleFwd() { FWD_SIM = !FWD_SIM; render(); }
  function toggleNoop() { render(); }
  function noop() { }
  function simRangeText(c) {
    var b = simBounds(c), eq = c.min === c.max ? " eq" : "";
    var t = '<span class="sim-range' + eq + '">' + c.min + (eq ? " ＝ " : " ~ ") + c.max +
      '<span class="dec-note"> / ' + c.dec + " 位</span>";
    /* 输入范围被小数位量化截断时，必须明示「实际可用边界」——
       否则会出现「范围写 1.001~1.004、输出却是 1.00」这种说不清的账 */
    if (!b.eq && !b.tooNarrow && (b.lo !== c.min || b.hi !== c.max)) {
      t += '<span class="dec-note q-note" title="按 ' + c.dec + ' 位小数四舍五入后，实际可输出的范围">→ ' +
        b.lo + " ~ " + b.hi + "</span>";
    }
    if (b.tooNarrow) {
      t += '<span class="dec-note q-note bad" title="范围容不下一个步长">步长 ' + Math.pow(10, -c.dec) + " 放不下</span>";
    }

  }
  /* 1s 一次局部刷新表格里的「当前值」。
     ★ 只刷 #content 内的预览，不碰弹窗——弹窗里的预览由「草稿」驱动，
       若被 tick 用已提交配置覆盖，用户正在编辑的数字会闪回旧值。 */
  function refreshSimCells() {
    document.querySelectorAll("#content [data-simval]").forEach(function (el) {
      var id = el.getAttribute("data-simval");
      if (SIMP[id] && SIMP[id].on) el.textContent = simNow(id);
    });
    document.querySelectorAll("#content [data-simpreview]").forEach(function (el) {
      el.innerHTML = simPreviewOf(SIMP[el.getAttribute("data-simpreview")], el.getAttribute("data-simpreview"));
    });
    var cnt = document.getElementById("sim-count");
    if (cnt) cnt.textContent = String(simOnCount());
  }
  function simPreviewOf(c, key) {
    if (!c) return '<span class="dec-note">该点位不支持模拟（公式点位由其它点位推导）</span>';
    if (simInvalid(c)) return '<span class="dec-note" style="color:var(--danger)">配置非法，无法生成样本</span>';
    var out = "";
    for (var i = 0; i < 4; i++) out += '<span class="pvv">' + simSampleCfg(c, key, i + 1) + '<span class="u">' + c.unit + "</span></span>";
    return out;
  }
  function simValidHTML(c) {
    if (!c) return '<span class="dec-note">该点位不支持模拟</span>';
    var vs = simValidate(c);
    if (!vs.length) return '<span class="dec-note">配置有效</span>';
    return vs.map(function (v) {
      var cls = v.level === "error" ? "err" : v.level === "warn" ? "warn" : "";
      var mark = v.level === "error" ? "✕ " : v.level === "warn" ? "△ " : "ⓘ ";
      return '<div class="hint ' + cls + '" style="margin-top:4px">' + mark + v.text + "</div>";

  }
  function simRangeBar(c) {
    /* 范围相等：条上只留一根刻度会看不出含义，直接标明「固定值 X」 */
    if (c.min === c.max) {
      return '<div class="range-bar eq"><div class="eqmark" style="left:50%"></div>' +
        '<span class="eqv">固定值 ' + c.min + "</span></div>";
    }
    var b = simBounds(c), mx = Math.max(c.max, 1);
    if (b.tooNarrow) return '<div class="range-bar bad"><div class="fill" style="left:50%;right:50%"></div>' +
      '<span class="eqv bad">步长放不下</span></div>';
    /* 进度条画的是「量化后真实可输出」的区间 [lo, hi]，与范围文本同源 */
    var l = Math.max(0, Math.min(100, b.lo / mx * 100));
    var r = Math.max(0, Math.min(100, (1 - b.hi / mx) * 100));
    return '<div class="range-bar"><div class="fill" style="left:' + l.toFixed(1) + '%;right:' + r.toFixed(1) + '%"></div>' +
      '<div class="tick" style="left:' + l.toFixed(1) + '%"></div>' +
      '<div class="tick" style="left:' + (100 - r).toFixed(1) + '%"></div></div>';
  }

  /* ── 模拟设置弹窗 ──
     ★ 草稿隔离：弹窗里的编辑只写 SIMDRAFT，点「开启/关闭模拟」才提交回 SIMP；
       点「关闭」直接丢弃 → 取消编辑不会污染真实配置。 */
  var SIMDRAFT = null;
  function draftOf(id) {
    if (!SIMDRAFT || SIMDRAFT.id !== id) {

  }
  function chipsDecHTML(id, dec) {
    var out = "";
    for (var n = 0; n <= 6; n++) {

    }
    return '<div class="chips nowrap" id="sim-dechips">' + out + "</div>";
  }
  function chipsModeHTML(id, mode) {
    return '<div class="chips" id="sim-modechips">' + ["random", "ramp", "sine", "fixed"].map(function (m) {
      return '<button type="button" class="chip' + (mode === m ? " on" : "") + '"' + act("setSimMode", id + "|" + m) + ">" + MODE_LABEL[m] + "</button>";
    }).join("") + "</div>";
  }
  function openSimSettings(id) {
    var c = draftOf(id);
    var p = POINTS.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    var html =
      '<div class="note sim"><span class="ni">◆</span><div><b>模拟数据不是真实数据。</b>模拟点位质量码固定为<b>「模拟」</b>，默认<b>不参与北向转发</b>；顶栏常驻「模拟中 N 点」标识，避免现场误判。</div></div>' +
      '<div class="row-inline c3">' +
      '<div class="fld"><label>最小值</label><input type="number" step="any" class="mono" id="sim-min" value="' + c.min + '" oninput="onSimInputVal(\'' + id + "','min',this.value)\"></div>" +
      '<div class="fld"><label>最大值</label><input type="number" step="any" class="mono" id="sim-max" value="' + c.max + '" oninput="onSimInputVal(\'' + id + "','max',this.value)\"></div>" +
      '<div class="fld"><label>小数位</label><input type="number" min="0" max="6" step="1" class="mono" id="sim-dec" value="' + c.dec + '" oninput="onSimInputVal(\'' + id + "','dec',this.value)\">" +
      chipsDecHTML(id, c.dec) + "</div></div>" +
      '<div class="fld"><label>模拟模式</label>' + chipsModeHTML(id, c.mode) +

      '<div class="fld"><label>模拟范围</label><div data-simbar="' + id + '">' + simRangeBar(c) + "</div></div>" +

  }
  /* 局部刷新弹窗：只改动态区块，不重建 DOM（保住输入焦点与光标位置） */
  function refreshSimModal(id, syncChips) {
    var c = draftOf(id);

    if (pv) pv.innerHTML = simPreviewOf(c, id);
    var vd = document.getElementById("sim-valid");

  /* ══ ②c 公式点编辑 ══════════════════════════════════
     草稿隔离与模拟设置同一纪律：FXDRAFT 只在弹窗里改，
     关闭即丢弃（closeModal 统一清空），保存才落库。 */
  var FXDRAFT = null;
  /* 该设备可作为公式输入的点位（公式点不可再作为输入，避免依赖环） */
  function fxInputsOf(devId) {
    var pts = (window.__devDebug && window.__devDebug.ptsOf(devId)) || [];
    return pts.filter(function (x) { return x.kind !== "calc"; });
  }
  function fxOpen(arg) {
    var p = String(arg).split("|"), devId = p[0], ptId = p[1];
    var pts = (window.__devDebug && window.__devDebug.ptsOf(devId)) || [];
    var pt = pts.filter(function (x) { return x.id === ptId; })[0];
    if (!pt) return;
    FXDRAFT = { dev: devId, pt: ptId, expr: pt.fx || "" };
    var html =
      '<div class="fld"><label>公式表达式</label>' +
      '<textarea id="fx-expr" class="fx-expr" rows="2" spellcheck="false" oninput="fxExpr(this.value)">' +
      esc(pt.fx || "") + "</textarea>" +
      '<div class="hint">支持四则运算、括号与 <code>abs / min / max / round</code>；引用点位直接写目标点位 ID。</div></div>' +
      '<div class="fld"><label>点击插入点位（' + fxInputsOf(devId).length + " 个可输入 · 公式点不可作为输入）</label>" +
      '<div class="chips" id="fx-chips">' +
      fxInputsOf(devId).map(function (x) {
        return '<button type="button" class="chip" onclick="fxInsert(\'' + x.id + '\')">' + x.name + " <code>" + x.id + "</code></button>";
      }).join("") + "</div></div>" +
      '<div class="fld"><label>引用检查 · 输入点当前值</label><div id="fx-check"></div></div>' +
      '<div class="note"><span class="ni">ⓘ</span><div>公式由采集引擎按输入点位的<b>采集频率</b>周期重算；任一输入质量码不为「良好」时，输出继承最差质量码。</div></div>';
    openModal({
      title: "编辑公式 · " + pt.name, sub: pt.id + " · " + pt.dt + " · " + pt.unit, size: "wide", noFocus: true,
      body: [{ t: "html", html: html }],
      ops: [
        btn({ label: "取消", onclick: "closeFormula" }),
        btn({ label: "保存公式", kind: "primary", onclick: "fxSave", arg: arg })
      ]
    });
    fxCheck();
  }
  function fxExpr(v) { if (FXDRAFT) { FXDRAFT.expr = v; fxCheck(); } }
  function fxInsert(id) {
    var ta = document.getElementById("fx-expr");
    if (!ta || !FXDRAFT) return;
    /* 以草稿为基准拼接（而非读 textarea）—— 两者在程序化调用时可能不同步 */
    var cur = FXDRAFT.expr || "", add = (cur && !/\s$/.test(cur) ? " " : "") + id;
    FXDRAFT.expr = cur + add;
    ta.value = FXDRAFT.expr;
    ta.focus();
    fxCheck();
  }
  /* 引用检查：表达式中的标识符逐个核对 —— 在点表中给当前值，
     是公式点给「不可作为输入」，不在点表给「外部输入」（如 K_Energy 这类跨设备量）。 */
  function fxCheck() {
    var box = document.getElementById("fx-check");
    if (!box || !FXDRAFT) return;
    var pts = (window.__devDebug && window.__devDebug.ptsOf(FXDRAFT.dev)) || [];
    var ids = [], m, re = /[A-Za-z_][A-Za-z0-9_]*/g, s = FXDRAFT.expr || "";
    while ((m = re.exec(s))) if (ids.indexOf(m[0]) < 0) ids.push(m[0]);
    if (!ids.length) { box.innerHTML = '<div class="hint">尚未引用任何点位。</div>'; return; }
    box.innerHTML = '<div class="chips fx-check">' + ids.map(function (id) {
      var pt = pts.filter(function (x) { return x.id === id; })[0];
      if (pt && pt.kind === "calc") return '<span class="chip warn">' + id + " · 公式点不可作为输入</span>";
      if (pt) return '<span class="chip ok">' + id + " · 当前 " + pt.real + " " + pt.unit + "</span>";
      return '<span class="chip">' + id + " · 外部输入</span>";
    }).join("") + "</div>";
  }
  function fxSave(arg) {
    if (!FXDRAFT) return;
    var p = String(arg).split("|"), ptId = p[1];
    var all = (window.__devDebug && window.__devDebug.ptsOf(FXDRAFT.dev)) || [];
    var pt = all.filter(function (x) { return x.id === ptId; })[0];
    if (pt) pt.fx = String(FXDRAFT.expr || "").trim() || pt.fx;
    FXDRAFT = null; closeModal(); render();
  }
  function closeFormula() { FXDRAFT = null; closeModal(); }

  /* ══ ②d 点位行操作：复制 / 编辑 / 删除 ═══════════════
     编辑走 PTDRAFT 草稿（关闭即丢弃）；删除必须过确认弹窗。 */
  var PTDRAFT = null;
  function ptLocate(arg) {
    var p = String(arg).split("|"), devId = p[0], ptId = p[1];
    var pts = (window.__devDebug && window.__devDebug.ptsOf(devId)) || [];
    var i = pts.findIndex(function (x) { return x.id === ptId; });
    return { devId: devId, pts: pts, pt: i >= 0 ? pts[i] : null, idx: i };
  }
  function ptCopy(arg) {
    var L = ptLocate(arg);
    if (!L.pt) return;
    var copy = JSON.parse(JSON.stringify(L.pt));
    copy.id = L.pt.id + "_c" + String(Date.now()).slice(-4);
    copy.name = L.pt.name + " 副本";
    /* 模拟配置不随复制带走，避免两行同时输出模拟值 */
    L.pts.splice(L.idx + 1, 0, copy);
    render();
  }
  function ptEditOpen(arg) {
    var L = ptLocate(arg);
    if (!L.pt) return;
    PTDRAFT = { devId: L.devId, ptId: L.ptId, f: {} };
    var isCalc = L.pt.kind === "calc";
    var html =
      '<div class="form cols2">' +
      fldHTML("点位名称", L.pt.name, "name", true) +
      fldHTML("目标点位", L.pt.target, "target", true) +
      (isCalc
        ? '<div class="fld"><label>地址</label><input type="text" class="mono" value="—（公式点）" disabled></div>'
        : fldHTML("地址", L.pt.addr, "addr", true, "mono")) +
      fldHTML("单位", L.pt.unit, "unit", false) +
      "</div>" +
      (isCalc
        ? '<div class="hint-strip">公式点的表达式请用操作列的「编辑公式」维护，这里只改名称 / 单位 / 目标点位。</div>'
        : '<div class="hint">地址与数据类型必须与设备手册一致：地址错位不会报错，只会悄悄读出错误值。</div>');
    openModal({
      title: "编辑点位 · " + L.pt.name, sub: L.pt.id + " · " + L.pt.dt, size: "wide", noFocus: true,
      body: [{ t: "html", html: html }],
      ops: [btn({ label: "取消", onclick: "ptEditCancel" }),
        btn({ label: "保存点位", kind: "primary", onclick: "ptEditSave", arg: arg })]
    });
  }
  function fldHTML(label, val, key, req, cls) {
    return '<div class="fld"><label>' + label + (req ? ' <span class="req">*</span>' : "") + "</label>" +
      '<input type="text"' + (cls ? ' class="' + cls + '"' : "") + ' value="' + esc(val || "") +
      '" oninput="ptField(\'' + key + '\',this.value)"></div>';
  }
  function ptField(k, v) { if (PTDRAFT) PTDRAFT.f[k] = v; }
  function ptEditSave(arg) {
    var L = ptLocate(arg);
    if (L.pt && PTDRAFT) {
      var f = PTDRAFT.f;
      if (f.name) L.pt.name = f.name.trim() || L.pt.name;
      if (f.target) L.pt.target = f.target.trim() || L.pt.target;
      if (f.addr !== undefined && L.pt.kind !== "calc") L.pt.addr = f.addr.trim() || L.pt.addr;
      if (f.unit !== undefined) L.pt.unit = f.unit.trim() || L.pt.unit;
    }
    PTDRAFT = null; closeModal(); render();
  }
  function ptEditCancel() { PTDRAFT = null; closeModal(); }
  function ptDel(arg) {
    var L = ptLocate(arg);
    if (!L.pt) return;
    openModal({
      title: "删除点位 · " + L.pt.name, sub: L.pt.id, size: "narrow",
      body: [
        { t: "impact", warn: true, title: "删除的影响", items: [
          "该点位<b>立即停止采集</b>，北向报文中对应字段同步消失。",
          "下游若依赖此 target key，会出现字段缺失；删除动作写入审计日志。"
        ] },
        { t: "form", fields: [{ label: "删除原因", value: "", req: true, hint: "写入审计日志" }] }
      ],
      ops: [btn({ label: "取消", onclick: "closeModal" }),
        btn({ label: "确认删除", kind: "danger", onclick: "ptDelDo", arg: arg })]
    });
  }
  function ptDelDo(arg) {
    var L = ptLocate(arg);
    if (L.idx >= 0) L.pts.splice(L.idx, 1);
    closeModal(); render();
  }

  /* ══ ③ 块渲染器 ═════════════════════════════════════ */
  /* ops 既可能是「已渲染的 HTML 字符串」，也可能是数组；
     ★ 绝不可把已渲染结果再送回 btn()——那会打印出 undefined */
  /* ══ ③.5 列表分页 ═══════════════════════════════════
     分页状态由引擎托管 —— 原型里真的会翻页、真的会切片，不是装饰性控件。
     硬约束：分页条的「共 N 条」一律取 rows.length，绝不接受页面写死数字。
     （本次已因「同一份数据存在两个来源」踩过一次 undefined 的坑，不再重犯。） */
  var PG = {};
  var PG_SIZES = [5, 10, 20, 50];
  function pgState(id, defSize) {
    if (!PG[id]) PG[id] = { cur: 1, size: defSize || 10 };
    return PG[id];
  }
  function pgGo(a) { var p = a.split("|"); pgState(p[0]).cur = parseInt(p[1], 10); render(); }
  function pgSize(a) {
    var p = a.split("|"); var st = pgState(p[0]);
    st.size = parseInt(p[1], 10); st.cur = 1; render();
  }
  /* 页码序列：页数多时收成 1 … 4 5 6 … 20 */
  function pageSeq(cur, pages) {
    var i, a = [];
    if (pages <= 7) { for (i = 1; i <= pages; i++) a.push(i); return a; }
    var near = [1, 2, cur - 1, cur, cur + 1, pages - 1, pages]
      .filter(function (n) { return n >= 1 && n <= pages; })
      .filter(function (n, ix, arr) { return arr.indexOf(n) === ix; })
      .sort(function (x, y) { return x - y; });
    var out = [];
    near.forEach(function (n, ix) {
      if (ix && n - near[ix - 1] > 1) out.push("…");
      out.push(n);
    });
    return out;
  }
  function pagerHTML(id, total, st) {
    var pages = Math.max(1, Math.ceil(total / st.size));
    if (st.cur > pages) st.cur = pages;
    if (st.cur < 1) st.cur = 1;
    var from = total === 0 ? 0 : (st.cur - 1) * st.size + 1;
    var to = Math.min(total, st.cur * st.size);
    var sizes = PG_SIZES.map(function (n) {
      return '<button type="button" class="chip' + (st.size === n ? " on" : "") + '"' +
        act("pgSize", id + "|" + n) + ">" + n + "</button>";
    }).join("");
    var nums = pageSeq(st.cur, pages).map(function (n) {
      if (n === "…") return '<span class="pg-gap">…</span>';
      return '<button type="button" class="pg-btn' + (n === st.cur ? " on" : "") + '"' +
        act("pgGo", id + "|" + n) + ' aria-current="' + (n === st.cur ? "page" : "false") + '">' + n + "</button>";
    }).join("");
    return '<div class="pager" data-pager="' + id + '" data-total="' + total + '" data-pages="' + pages + '">' +
      '<span class="pg-info">共 <b>' + total + "</b> 条 · 第 " + from + "–" + to + " 条</span>" +
      '<span class="pg-sizes">每页 ' + sizes + "</span>" +
      '<span class="pg-nav">' +
      '<button type="button" class="pg-btn' + (st.cur <= 1 ? " disabled" : "") + '"' +
      (st.cur <= 1 ? " disabled" : act("pgGo", id + "|" + (st.cur - 1))) + ">‹</button>" + nums +
      '<button type="button" class="pg-btn' + (st.cur >= pages ? " disabled" : "") + '"' +
      (st.cur >= pages ? " disabled" : act("pgGo", id + "|" + (st.cur + 1))) + ">›</button></span>" +
      '<span class="pg-jump">跳至 <input type="number" min="1" max="' + pages + '" value="' + st.cur +
      '" onchange="pgGo(\'' + id + "|' + this.value)\"> 页</span>" +
      "</div>";
  }

  /* ── 表单渲染（form 区块与页面内联表单共用同一实现，避免两套样式漂移）──
     cls: "cols2" 两列栅格；字段 f.span 占满整行；f.group 插入分组标题。
     ns:  字段值暂存命名空间 —— 带 f.k 的字段会把用户输入记到 FV，
          这样「上一步 / 下一步」来回切换（整页重渲染）不会把已填内容抹掉。
          oninput 只写状态、不触发渲染，因此不会打断输入焦点。 */
  var FV = {};
  function fvSet(k, v) { FV[k] = v; }
  function fvOf(k, def) { return FV[k] === undefined ? def : FV[k]; }

  /* ── 贴牌（OEM）：品牌名 / Logo / 副标题 / 标语 / 主题色 ──
     状态全部托管在 SW（启用贴牌开关）、FV（oem:: 字段）、state.radio（oemtheme），
     不引入新状态结构 → 重渲染天然一致；输入时 oemInput 只改 DOM 不重渲染（保焦点）。 */
  var BRAND_DEF = { logo: "ID", name: "IoT-DAQ", sub: "Edge Gateway", slogan: "" };
  function oemOn() { return !!swGet("settings::启用贴牌::0", false); }
  function brandOf() {
    if (!oemOn()) return BRAND_DEF;
    var nm = String(FV["oem::name"] || "").trim();
    if (!nm) return BRAND_DEF;             /* 没有品牌名 = 不算生效，避免半贴牌 */
    var lg = String(FV["oem::logo"] || "").trim();
    var sub = String(FV["oem::sub"] || "").trim();
    return {
      logo: lg || nm.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || nm.slice(0, 2),
      name: nm, sub: sub || "Powered by IoT-DAQ",
      slogan: String(FV["oem::slogan"] || "").trim()
    };
  }
  var OEM_THEME = {
    "0": null,                                             /* 青绿（原厂默认） */
    "1": { accent: "#2F6FED", accent2: "#1F56C4", soft: "#E8F0FE", line: "#B9CDF8" }
  };
  function applyOemTheme() {
    var r = document.documentElement.style;
    var t = oemOn() ? OEM_THEME[String(state.radio["oemtheme"] === undefined ? 0 : state.radio["oemtheme"])] : null;
    if (t) {
      r.setProperty("--accent", t.accent); r.setProperty("--accent-2", t.accent2);
      r.setProperty("--accent-soft", t.soft); r.setProperty("--accent-line", t.line);
    } else { r.removeProperty("--accent"); r.removeProperty("--accent-2"); r.removeProperty("--accent-soft"); r.removeProperty("--accent-line"); }
  }
  /* 贴牌输入：写 FV + 直接更新侧栏与预览 DOM（不重渲染 → 焦点不丢） */
  function oemInput(key, v) {
    FV[key] = v;
    var b = brandOf();
    var map = { "oem::name": ["brand-name", "pv-name"], "oem::sub": ["brand-sub", "pv-sub"], "oem::logo": ["brand-logo", "pv-logo"], "oem::slogan": ["pv-slogan"] };
    var val = { "brand-logo": b.logo, "brand-name": b.name, "brand-sub": b.sub, "pv-logo": b.logo, "pv-name": b.name, "pv-sub": b.sub, "pv-slogan": b.slogan };
    (map[key] || []).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = val[id];
    });
    /* 品牌名变化且 Logo 留空（Logo 取品牌名前两位派生）→ Logo 节点联动刷新 */
    if (key === "oem::name" && !String(FV["oem::logo"] || "").trim()) {
      ["brand-logo", "pv-logo"].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.textContent = b.logo;
      });
    }
  }

  /* ── 新增设备 · 自定义参数（key-value 行，可增删）──
     输入只写状态不重渲染（保焦点）；增删行才重渲染。 */
  var DEV_ID_DEF = String(Date.now());   /* 设备 ID 默认 = 当前时间戳字符串，可更改 */
  var CUSTP = [{ k: "", v: "" }];
  function custpGet() { return CUSTP; }
  function cpAdd() { CUSTP.push({ k: "", v: "" }); render(); }
  function cpDel(i) { CUSTP.splice(i, 1); if (!CUSTP.length) CUSTP.push({ k: "", v: "" }); render(); }
  function cpK(i, v) { CUSTP[i].k = v; }
  function cpV(i, v) { CUSTP[i].v = v; }
  function formHTML(fields, cls, ns) {
    var pre = ns ? ns + "::" : "";
    return '<div class="form' + (cls ? " " + cls : "") + '">' + (fields || []).map(function (f) {
      if (f.group) return '<div class="form-grp">' + f.group + "</div>";
      var key = f.k ? pre + f.k : null;
      var val = key ? fvOf(key, f.value) : f.value;
      /* fn：自定义处理器（如贴牌输入要实时改侧栏品牌且不重渲染），缺省仍是 fvSet */
      var on = key ? ' oninput="' + (f.fn || "fvSet") + "(" + "'" + key + "',this.value)" + '"' : "";
      var inp;
      if (f.type === "textarea") {
        inp = '<textarea rows="' + (f.rows || 5) + '" class="mono"' + on + ">" +
          (val === undefined ? "" : val) + "</textarea>";
      } else if (f.opts || f.type === "select") {
        inp = '<select class="mono"' + (key ? ' onchange="' + (f.fn || "fvSet") + "(" + "'" + key + "',this.value)" + '"' : "") + ">" +
          (f.opts || f.options || []).map(function (o) {
            var v = typeof o === "object" ? o.v : o, lab = typeof o === "object" ? o.l : o;
            return '<option value="' + v + '"' + (v === val ? " selected" : "") + ">" + lab + "</option>";
          }).join("") + "</select>";
      } else {
        inp = '<input type="' + (f.type || "text") + '" value="' + (val === undefined ? "" : val) + '"' +
          (f.ph ? ' placeholder="' + f.ph + '"' : "") + (f.mono === false ? "" : ' class="mono"') + on + ">";
      }
      if (f.unit) inp = '<div class="inp-unit">' + inp + "<span>" + f.unit + "</span></div>";
      return '<div class="fld' + (f.span ? " span" : "") + '"><label>' + f.label +
        (f.req ? ' <span class="req">*</span>' : "") + (f.badge ? " " + f.badge : "") + "</label>" + inp +
        (f.hint ? '<div class="hint' + (f.hintTone ? " " + f.hintTone : "") + '">' + f.hint + "</div>" : "") + "</div>";
    }).join("") + "</div>";
  }

  function opsHTML(o, sep) {
    if (!o) return "";
    if (typeof o === "string") return o;
    return o.map(function (x) { return typeof x === "string" ? x : btn(x); }).join(sep || "");
  }
  function renderBlocks(list) { return (list || []).map(renderBlock).join(""); }
  function renderBlock(b) {
    /* 允许在 body 数组里直接放按钮对象或已渲染的 HTML 字符串 */
    if (b === null || b === undefined || b === false) return "";
    if (typeof b === "string") return b;
    if (b.t === undefined && b.label !== undefined) return btn(b);
    switch (b.t) {
      case "html": return b.fn ? b.fn() : b.html;
      case "banner":
        return '<div class="banner ' + (b.kind || "info") + '"><span class="bi">' +
          (b.kind === "ok" ? "✓" : b.kind === "warn" ? "!" : b.kind === "danger" ? "✕" : b.kind === "sim" ? "◆" : "i") +
          '</span><div style="flex:1;min-width:0"><b>' + b.title + "</b>" + b.text + "</div>" +
          (b.ops ? '<div class="bops">' + opsHTML(b.ops, "") + "</div>" : "") + "</div>";
      case "kpis":
        return '<div class="kpis">' + b.items.map(function (k) {
          return '<div class="kpi"><div class="kpi-top"><span class="kpi-ic ' + (k.tone || "teal") + '">' + k.ic +
            "</span><span class=\"kpi-lbl\">" + k.label + "</span></div>" +
            '<div style="flex:0 0 auto"><div class="kpi-val">' + k.value +
            (k.unit ? '<span class="unit">' + k.unit + "</span>" : "") + "</div>" +
            (k.delta ? '<div class="kpi-sub"><span class="delta ' + (k.dtone || "flat") + '">' + k.delta + "</span>" + (k.note || "") + "</div>"
              : (k.note ? '<div class="kpi-sub">' + k.note + "</div>" : "")) +
            "</div></div>";
        }).join("") + "</div>";
      case "card":
        return '<section class="card' + (b.tight ? " tight" : "") + (b.flush ? " flush" : "") + (b.accent ? " accent" : "") + '">' +
          (b.title ? '<header class="card-head"><h3>' + b.title + "</h3>" +
            (b.sub ? '<span class="sub">' + b.sub + "</span>" : "") +
            (b.ops ? '<div class="ops">' + opsHTML(b.ops, "") + "</div>" : "") + "</header>" : "") +
          '<div class="card-body">' + renderBlocks(b.body) + "</div></section>";
      case "grid": return '<div class="grid ' + (b.cls || "g2") + '">' + renderBlocks(b.body) + "</div>";
      case "table": {
