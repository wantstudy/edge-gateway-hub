      el2.innerHTML = '<div class="steps">' + labels.map(function (l, i) {
        var st = i < step ? "done" : i === step ? "run" : "";
        return '<div class="step ' + st + '"><span class="si">' + (i < step ? "✓" : i + 1) + '</span><div class="sb"><div class="t">' + l + "</div></div>" +
          '<span class="st">' + (i < step ? "完成" : i === step ? "进行中" : "") + "</span></div>";
      }).join("") + "</div>";
      bar2.innerHTML = '<div style="display:flex;flex-direction:column;gap:7px"><div style="display:flex;font-size:var(--t-sm);color:var(--text-2)">总进度<span style="flex:1"></span><span class="mono">' +
        pct + '%</span></div><div class="prog"><i style="width:' + pct + '%"></i></div></div>';
      if (pct >= 100) { clearInterval(UPD_TIMER); UPD_TIMER = null; }
    }, 260);
  }
  function startRollback() {
    openModal({
      title: "回滚到 v1.4.2", sub: "使用上一版本备份", size: "narrow",
      body: [
        { t: "impact", warn: true, title: "回滚的影响", items: [
          "服务将<b>重启</b>并恢复上一版本，采集中断约 5–15 秒。",
          "回滚期间新产生的配置变更将丢失，请先备份。",
          "回滚后 update 通道仍为稳定版，可能再次提示升级。"
        ] },
        { t: "form", fields: [{ label: "回滚原因", value: "", req: true }] }
      ],
      ops: [btn({ label: "取消", onclick: "closeModal" }), btn({ label: "确认回滚", kind: "danger", onclick: "noop" })]
    });
  }
  function confirmRestart() {
    openModal({
      title: "重启服务", sub: "约 5–15 秒中断", size: "narrow",
      body: [
        { t: "impact", warn: true, title: "重启的影响", items: [
          "采集暂停约 <b>5–15 秒</b>；已入队数据不丢，恢复后自动补发。",
          "北向转发短暂中断，客户 Broker 可能出现一个空档。",
          "若队列中有待补发数据，将优先 flush 后再退出（优雅停机）。"
        ] },
        { t: "form", fields: [{ label: "重启原因", value: "", req: true }] }
      ],
      ops: [btn({ label: "取消", onclick: "closeModal" }), btn({ label: "确认重启", kind: "danger", onclick: "noop" })]
    });
  }

  /* ── 侧栏 ── */
  function navHTML() {
    var ids = Object.keys(PAGES), out = "", lastGroup = "";
    ids.forEach(function (id) {
      var p = PAGES[id];
      if (p.roles.indexOf(state.role) < 0) return;
      if (p.group !== lastGroup) {
        lastGroup = p.group;
        out += '<div class="nav-group-title">' + p.group + "</div>";
      }
      var badge = "";
      if (id === "alarms") badge = '<span class="badge">7</span>';
      if (id === "points" && simOnCount() > 0) badge = '<span class="badge sim">' + simOnCount() + "</span>";
      out += '<div class="nav-item' + (id === state.page ? " on" : "") + '" data-page="' + id + '" tabindex="0" role="tab" aria-selected="' +
        (id === state.page ? "true" : "false") + '"' + act("go", id) + '><span class="ic">' + (p.ic || "·") + "</span>" +
        p.title.replace(/^[^\u4e00-\u9fa5A-Za-z]+/, "") + badge + "</div>";
    });
    return out;
  }
  function topbarHTML() {
    var simN = simOnCount();
    var ring = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">' +
      '<circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/>' +
      '<circle cx="17" cy="17" r="14" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="0"/></svg>';
    var h = '<button type="button" class="pill plain" id="role-switch"' + act("cycleRole") + ' title="切换视角（RBAC 演示）">' +
      "视角：" + ROLE_LABEL[state.role] + "</button>";
    h += '<div class="spacer" style="flex:1"></div>';
    if (simN > 0) {
      h += '<button type="button" class="pill sim" id="sim-indicator"' + act("go", "points") + '><i class="dotp"></i>模拟中 <b id="sim-count">' +
        simN + "</b> 点</button>";
    } else {
      h += '<span class="pill plain" id="sim-indicator" style="opacity:.55"><i class="dotp"></i>无模拟点位</span>';
    }
    h += '<span class="pill ok" title="授权正常"><i class="dotp"></i>授权正常</span>';
    h += '<span class="lic-ring" title="租约有效期剩余 6 天 23 小时">' + ring + '<span class="lbl">365d</span></span>';
    h += '<span class="avatar" title="' + ROLE_LABEL[state.role] + '">' + ROLE_LABEL[state.role].slice(0, 1) + "</span>";
    return h;
  }
  function cycleRole() {
    var order = ["viewer", "operator", "admin"];
    setRole(order[(order.indexOf(state.role) + 1) % 3]);
  }
  function marqueeHTML() {
    if (S.id !== "b") return "";
    var items = POINTS.slice(0, 6).map(function (p) {
      var c = SIMP[p.id];
      var v = c && c.on ? simNow(p.id) : realOf(p);
      return "<span>" + p.target + " <b" + (c && c.on ? ' class="sp"' : "") + ">" + v + "</b> " + p.unit +
        (c && c.on ? " ◆SIM" : "") + "</span>";
    }).join("");
    items += "<span>QUEUE <b>1204</b> 条</span><span>TX <b class=\"up\">1284 pkt/min</b></span>" +
      "<span>LIC <b>6d23h</b></span><span>UPTIME <b>18d06h</b></span><span>VER <b>v1.4.2</b></span>";
    return '<div class="marquee" aria-hidden="true"><div class="mq-track">' + items + items + "</div></div>";
  }

  function render() {
    PAGES = buildPages();              // 每帧重建：模拟计数 / 点位表等动态值必须实时
    var page = PAGES[state.page] || PAGES[firstAllowed(state.role)];
    state.page = Object.keys(PAGES).filter(function (k) { return PAGES[k] === page; })[0];
    document.getElementById("nav").innerHTML = navHTML();
    document.getElementById("topbar").innerHTML = topbarHTML();
    var mq = document.getElementById("marquee");
    if (mq) mq.innerHTML = marqueeHTML();
    var body = page.body;
    if (page.tabs) body = [{ t: "tabs", id: page.tabs.id, cls: page.tabs.cls, items: page.tabs.items }];
    /* 页头已按要求去掉：不渲染标题 / 描述 / 面包屑，只保留内容区块。
       页面级操作按钮（新增设备等）收进一条紧凑工具行，不占纵向空间。 */
    var ops = page.ops ? '<div class="page-ops">' + opsHTML(page.ops, "") + "</div>" : "";
    document.getElementById("main").innerHTML =
      ops + '<div id="content" class="content">' + renderBlocks(body) + "</div>";
    document.getElementById("nav-foot").innerHTML =
      '<div class="scheme"><i></i>' + S.name + "</div>" + S.foot + "<br>v1.4.2 · " + S.role;
    /* 贴牌：品牌三件套跟随 OEM 配置（未启用 = 原厂标识），主题色同步覆写/还原 */
    var b = brandOf();
    ["brand-logo", "brand-name", "brand-sub"].forEach(function (id, i) {
      var el = document.getElementById(id);
      if (el) el.textContent = [b.logo, b.name, b.sub][i];
    });
    applyOemTheme();
  }

  /* ══ 启动 ═══════════════════════════════════════════ */
  window.go = go; window.setRole = setRole; window.setTab = setTab; window.pickRadio = pickRadio;
  window.toggleSim = toggleSim; window.setSimAll = setSimAll; window.openSimSettings = openSimSettings;
  window.onSimInputVal = onSimInputVal; window.setSimMode = setSimMode; window.setSimDec = setSimDec;
  window.resetSim = resetSim; window.saveSim = saveSim; window.closeSimSettings = closeSimSettings;
  window.fxOpen = fxOpen; window.fxExpr = fxExpr; window.fxInsert = fxInsert;
  window.fxSave = fxSave; window.closeFormula = closeFormula;
  window.ptCopy = ptCopy; window.ptEditOpen = ptEditOpen; window.ptField = ptField;
  window.ptEditSave = ptEditSave; window.ptEditCancel = ptEditCancel; window.ptDel = ptDel; window.ptDelDo = ptDelDo;
  window.cpAdd = cpAdd; window.cpDel = cpDel; window.cpK = cpK; window.cpV = cpV;
  window.oemInput = oemInput;
  window.toggleFwd = toggleFwd; window.toggleNoop = toggleNoop;
  window.noop = noop; window.openModalById = openModalById; window.closeModal = closeModal;
  window.toggleSw = toggleSw;
  window.goLive = goLive; window.outDevPick = outDevPick;
  window.pgGo = pgGo; window.pgSize = pgSize;
  window.setDevFilter = setDevFilter; window.goDevice = goDevice;
  window.wizGo = wizGo; window.wizNext = wizNext; window.wizPrev = wizPrev; window.wizConfirm = wizConfirm;
  window.devSearch = devSearch; window.devGrpPick = devGrpPick; window.devPick = devPick;
  window.devClearFilter = devClearFilter; window.fvSet = fvSet;
  window.copyMachineCode = copyMachineCode; window.checkUpdate = checkUpdate; window.startUpdate = startUpdate;
  window.startRollback = startRollback; window.confirmRestart = confirmRestart;
  window.render = render; window.cycleRole = cycleRole;
  window.__simDebug = { sample: simSample, bounds: simBounds, validate: simValidate, sim: SIMP, points: POINTS };

  render();
  setInterval(function () { TICK++; refreshSimCells(); }, 1000);
})();

</script>
</body>
</html>
